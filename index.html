<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101216">

<title>O-VER-KiLL｜MANAGER'S STORY</title>

<style>
@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap");

:root{
  --bg:#101216;
  --panel:#1a1d23;
  --line:#353a44;
  --text:#f4f5ef;
  --muted:#98a0ab;
  --acid:#d7ff63;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:"Noto Sans JP",sans-serif;
}

body{
  overscroll-behavior:none;
}

button{
  font:inherit;
  color:inherit;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

button:disabled{
  opacity:.35;
  cursor:not-allowed;
}

.app{
  width:min(100%,900px);
  min-height:100dvh;
  margin:auto;

  padding:
    max(14px,env(safe-area-inset-top))
    16px
    max(16px,env(safe-area-inset-bottom));

  display:flex;
  flex-direction:column;
}


/* =========================
   HEADER
========================= */

.header{
  height:66px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  border-bottom:1px solid var(--line);
}

.logo{
  font-size:23px;
  font-weight:900;
  font-style:italic;
  letter-spacing:-1px;
}

.logo span{
  display:block;

  margin-top:7px;

  color:var(--muted);

  font-size:9px;
  font-style:normal;
  letter-spacing:3px;
}

.help{
  width:42px;
  height:42px;

  border:1px solid var(--line);
  border-radius:50%;

  background:none;

  font-size:19px;
  font-weight:800;
}


/* =========================
   HUD
========================= */

.hud{
  margin-top:12px;
  padding:12px;

  background:var(--panel);

  border:1px solid var(--line);
  border-radius:10px;
}

.hudTop{
  display:flex;
  justify-content:space-between;
  align-items:center;

  gap:8px;
}

.week{
  color:var(--acid);

  font-size:11px;
  font-weight:900;
  letter-spacing:1.5px;
}

.groupInfo{
  text-align:right;

  color:var(--muted);

  font-size:11px;
  line-height:1.6;
}

.groupInfo strong{
  color:#fff;

  font-size:14px;
}

.groupBarWrap{
  display:grid;
  grid-template-columns:1fr 1fr;

  gap:10px;

  margin-top:10px;
}

.groupStat label{
  display:flex;
  justify-content:space-between;

  color:var(--muted);

  font-size:10px;
}

.groupStat strong{
  color:#fff;
}

.bar{
  height:5px;

  margin-top:5px;

  overflow:hidden;

  background:#303640;

  border-radius:999px;
}

.fill{
  width:0;
  height:100%;

  background:var(--acid);

  border-radius:999px;

  transition:width .55s ease;
}

.memberEnergyRow{
  display:grid;
  grid-template-columns:repeat(4,1fr);

  gap:8px;

  margin-top:12px;
}

.energyMini{
  padding:8px 8px 7px;

  background:#20242b;

  border:1px solid #313744;
  border-radius:8px;
}

.energyMini .top{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:5px;

  font-size:10px;
  font-weight:800;
}

.energyMini .top span:last-child{
  color:#fff;
}

.energyMini .name{
  display:flex;
  align-items:center;

  gap:6px;
}

.dot{
  width:8px;
  height:8px;

  border-radius:50%;

  background:var(--member-color,#fff);
}


/* =========================
   STAGE
========================= */

.stage{
  flex:1;
  min-height:0;

  margin-top:12px;

  display:flex;
  flex-direction:column;

  overflow:hidden;

  border:1px solid var(--line);
  border-radius:11px;

  background:
    radial-gradient(
      circle at 50% 28%,
      #353b46 0,
      #20242b 40%,
      #111318 82%
    );
}

.stageTop{
  padding:13px 15px 5px;

  display:flex;
  justify-content:space-between;

  color:var(--muted);

  font-size:10px;
  letter-spacing:1px;
}

.stageTop b{
  color:var(--acid);
}


/* =========================
   VISUAL AREA
========================= */

.visualArea{
  height:365px;

  position:relative;

  overflow:hidden;

  display:flex;
  align-items:flex-end;
  justify-content:center;

  --scene-accent:#6fb9ff;
  --scene-accent-rgb:111,185,255;

  background:
    radial-gradient(
      circle at 50% 28%,
      #343b47 0,
      #1c2028 42%,
      #101318 85%
    );
}

.visualArea::before{
  content:"";

  position:absolute;
  inset:0;

  pointer-events:none;

  opacity:1;

  transition:all .35s ease;
}

.visualArea::after{
  content:"";

  position:absolute;

  left:10%;
  right:10%;
  bottom:-16px;

  height:90px;

  background:
    radial-gradient(
      ellipse,
      rgba(0,0,0,.52),
      transparent 70%
    );

  pointer-events:none;
}


/* =========================
   MEMBER BACKGROUND
========================= */

.visualArea.scene-member::before{
  background:

    radial-gradient(
      circle at 50% 14%,
      rgba(255,255,255,.15),
      transparent 20%
    ),

    radial-gradient(
      circle at 50% 40%,
      rgba(var(--scene-accent-rgb),.18),
      transparent 30%
    ),

    linear-gradient(
      to bottom,
      rgba(255,255,255,.03),
      rgba(255,255,255,0) 20%
    ),

    repeating-linear-gradient(
      to right,
      transparent 0 88px,
      rgba(255,255,255,.022) 88px 89px,
      transparent 89px 176px
    ),

    linear-gradient(
      to top,
      rgba(0,0,0,.30),
      rgba(0,0,0,0) 42%
    );
}


/* =========================
   PLANNING BACKGROUND
========================= */

.visualArea.scene-planning::before{
  background:

    linear-gradient(
      to bottom,
      rgba(255,255,255,.04),
      rgba(255,255,255,0) 18%
    ),

    radial-gradient(
      circle at 18% 22%,
      rgba(111,185,255,.11),
      transparent 20%
    ),

    radial-gradient(
      circle at 82% 20%,
      rgba(215,255,99,.10),
      transparent 20%
    ),

    repeating-linear-gradient(
      to right,
      transparent 0 92px,
      rgba(255,255,255,.018) 92px 93px,
      transparent 93px 184px
    ),

    linear-gradient(
      to top,
      rgba(0,0,0,.32),
      rgba(0,0,0,0) 35%
    );
}


/* =========================
   PHOTO BACKGROUND
========================= */

.visualArea.scene-photo::before{
  background:

    linear-gradient(
      to bottom,
      rgba(7,10,15,.22),
      rgba(7,10,15,.15) 30%,
      rgba(7,10,15,.55)
    ),

    radial-gradient(
      circle at center,
      rgba(255,255,255,.06),
      rgba(255,255,255,0) 55%
    );
}


/* =========================
   VISUAL ELEMENTS
========================= */

.photoVisual,
.managerVisual,
.singleCharacter{
  position:absolute;

  inset:0;

  display:none;

  z-index:1;
}

.photoVisual.show,
.managerVisual.show,
.singleCharacter.show{
  display:flex;
}


/* =========================
   PHOTO
========================= */

.photoVisual{
  align-items:flex-end;
  justify-content:center;

  background-position:center center;
  background-size:cover;
  background-repeat:no-repeat;
}

.photoVisual::before{
  content:"";

  position:absolute;

  inset:0;

  background:

    linear-gradient(
      to bottom,
      rgba(8,10,14,.30),
      rgba(8,10,14,.22) 35%,
      rgba(8,10,14,.66)
    ),

    radial-gradient(
      circle at center,
      rgba(255,255,255,.06),
      rgba(255,255,255,0) 52%
    );
}

.photoOverlay{
  position:absolute;

  left:0;
  right:0;
  bottom:28px;

  z-index:2;

  padding:0 22px;

  text-align:left;
}

.photoTag{
  color:var(--acid);

  font-size:10px;
  font-weight:900;
  letter-spacing:2.4px;
}

.photoTitle{
  margin-top:8px;

  font-size:28px;
  font-weight:900;
  font-style:italic;
  letter-spacing:-1px;
}

.photoSub{
  margin-top:6px;

  color:#eef1f6;

  font-size:12px;
  font-weight:700;
}


/* =========================
   MANAGER / STRATEGY ROOM
========================= */

.managerVisual{
  align-items:center;
  justify-content:center;

  text-align:center;
}

.managerVisual::before{
  content:"";

  position:absolute;

  left:28px;
  right:28px;
  top:32px;
  bottom:42px;

  border-radius:16px;

  border:
    1px solid
    rgba(255,255,255,.06);

  background:

    linear-gradient(
      to bottom,
      rgba(255,255,255,.035),
      rgba(255,255,255,.01)
    ),

    radial-gradient(
      circle at 20% 18%,
      rgba(111,185,255,.09),
      transparent 18%
    ),

    radial-gradient(
      circle at 80% 16%,
      rgba(215,255,99,.08),
      transparent 18%
    );

  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.02),
    0 16px 40px rgba(0,0,0,.18);
}

.managerVisual::after{
  content:"STRATEGY ROOM";

  position:absolute;

  top:46px;
  left:46px;

  color:rgba(255,255,255,.28);

  font-size:10px;
  font-weight:900;
  letter-spacing:3px;
}

.managerLogo{
  position:relative;

  z-index:2;

  margin-top:-10px;

  font-size:36px;
  font-weight:900;
  font-style:italic;
  letter-spacing:-2px;

  opacity:.88;
}

.managerLogo span{
  display:block;

  margin-top:10px;

  color:var(--muted);

  font-size:10px;
  font-style:normal;
  letter-spacing:4px;
}


/* =========================
   CHARACTER
========================= */

.singleCharacter{
  align-items:flex-end;
  justify-content:center;
}

.singleCharacter::before{
  content:"";

  position:absolute;

  left:50%;
  top:48%;

  width:250px;
  height:250px;

  transform:
    translate(-50%,-50%);

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(var(--scene-accent-rgb),.26),
      rgba(var(--scene-accent-rgb),0) 68%
    );

  filter:blur(12px);

  z-index:0;
}

.singleCharacter::after{
  content:"";

  position:absolute;

  left:50%;
  bottom:28px;

  width:160px;
  height:160px;

  transform:
    translateX(-50%);

  border-radius:50%;

  border:
    1px solid
    rgba(255,255,255,.11);

  box-shadow:
    0 0 0 24px rgba(255,255,255,.028),
    0 0 0 58px rgba(255,255,255,.012);

  z-index:0;
}

.singleCharacter.enter .characterImg{
  animation:enter .35s ease both;
}

@keyframes enter{

  from{
    opacity:0;

    transform:
      translateY(22px)
      scale(.95);
  }

  to{
    opacity:1;

    transform:
      translateY(0)
      scale(1);
  }

}

.characterImg{
  position:relative;

  z-index:1;

  width:80%;
  height:100%;

  object-fit:contain;
  object-position:center bottom;

  display:block;

  filter:
    drop-shadow(
      0 18px 20px
      rgba(0,0,0,.55)
    );
}

.memberBadge{
  position:absolute;

  left:50%;
  bottom:8px;

  transform:
    translateX(-50%);

  z-index:3;

  padding:5px 12px;

  background:#0d1014e7;

  border-top:
    2px solid
    var(--member,#fff);

  border-radius:6px;

  font-size:11px;
  font-weight:900;
  letter-spacing:.5px;
}


/* =========================
   DIALOGUE
========================= */

.dialogue{
  min-height:122px;

  margin:0 12px 12px;
  padding:15px 16px 17px;

  position:relative;

  background:#f1f1eb;
  color:#16191e;

  border-radius:12px;

  box-shadow:
    0 8px 24px
    rgba(0,0,0,.35);
}

.dialogue::before{
  content:"";

  position:absolute;

  top:-10px;
  left:36px;

  width:20px;
  height:20px;

  background:#f1f1eb;

  transform:
    rotate(45deg);
}

.speaker{
  position:relative;

  z-index:2;

  margin-bottom:7px;

  font-size:11px;
  font-weight:900;
  letter-spacing:2px;
}

.dialogueText{
  position:relative;

  z-index:2;

  white-space:pre-line;

  font-size:15px;
  font-weight:500;
  line-height:1.75;
}


/* =========================
   CONTROLS
========================= */

.controls{
  padding:0 10px 10px;
}

.plan{
  margin-bottom:9px;

  display:flex;

  gap:5px;
}

.slot{
  flex:1;

  height:4px;

  background:#343a44;

  border-radius:10px;
}

.slot.done{
  background:var(--acid);
}


/* =========================
   MEMBER SELECT
========================= */

.memberGrid{
  display:grid;
  grid-template-columns:1fr 1fr;

  gap:8px;
}

.memberChoice{
  width:100%;

  padding:10px;

  text-align:left;

  border:1px solid #404753;
  border-radius:8px;

  background:#20242b;
}

.memberChoice.active{
  border-color:var(--acid);

  box-shadow:
    0 0 0 1px
    rgba(215,255,99,.28)
    inset;
}

.memberChoice .head{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:4px;

  font-size:12px;
  font-weight:900;
}

.memberChoice .role{
  margin-bottom:8px;

  color:var(--muted);

  font-size:10px;
}

.memberChoice .tiny{
  display:grid;
  grid-template-columns:1fr 1fr;

  gap:4px 8px;

  color:#dfe2e8;

  font-size:10px;
}

.memberChoice .energyLine{
  margin-top:7px;
}


/* =========================
   ACTIONS
========================= */

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;

  gap:8px;
}

.choice{
  width:100%;

  padding:11px;

  text-align:left;

  border:1px solid #434954;
  border-radius:8px;

  background:#20242b;
}

.choice:active{
  background:#292f38;
}

.choice strong{
  display:block;

  font-size:13px;
}

.choice small{
  display:block;

  margin-top:4px;

  color:var(--muted);

  font-size:10px;
  line-height:1.45;
}

.row{
  margin-top:8px;

  display:grid;
  grid-template-columns:1fr 1fr;

  gap:8px;
}

.primary{
  width:100%;

  min-height:48px;

  padding:11px;

  border:none;
  border-radius:8px;

  background:var(--acid);
  color:#12160b;

  font-weight:900;
}

.secondary{
  width:100%;

  min-height:44px;

  border:1px solid var(--line);
  border-radius:8px;

  background:#1a1e24;

  font-weight:700;
}


/* =========================
   SONG
========================= */

.songUnlock{
  margin-bottom:10px;
  padding:16px;

  text-align:center;

  border:
    1px solid
    rgba(215,255,99,.35);

  border-radius:10px;

  background:
    linear-gradient(
      145deg,
      rgba(215,255,99,.08),
      rgba(255,255,255,.015)
    );
}

.songNew{
  color:var(--acid);

  font-size:9px;
  font-weight:900;
  letter-spacing:3px;
}

.songTitle{
  margin-top:7px;

  font-size:23px;
  font-weight:900;
}

.songSub{
  margin-top:3px;

  color:var(--muted);

  font-size:10px;
}

.songButton{
  width:100%;

  margin-top:12px;
  padding:11px;

  border:
    1px solid
    rgba(215,255,99,.55);

  border-radius:8px;

  background:#151a13;
  color:var(--acid);

  font-weight:800;
}

.songButton.playing{
  background:var(--acid);
  color:#111;
}


/* =========================
   RESULT
========================= */

.result{
  padding:10px 0 6px;

  text-align:center;
}

.resultNumber{
  font-size:50px;
  font-weight:900;
}

.resultNumber small{
  color:var(--muted);

  font-size:14px;
}

.resultGrid{
  display:grid;
  grid-template-columns:1fr 1fr;

  gap:8px;
}

.resultCard{
  padding:11px;

  border:1px solid var(--line);
  border-radius:8px;

  background:#20242b;
}

.resultCard strong{
  display:block;

  font-size:13px;
}

.resultCard small{
  display:block;

  margin-top:4px;

  color:var(--muted);

  font-size:10px;
}


/* =========================
   FOOTER
========================= */

.footer{
  display:flex;
  justify-content:space-between;

  padding-top:10px;

  color:#737b86;

  font-size:10px;
}

.footer button{
  padding:0;

  border:none;

  background:none;
  color:#737b86;

  text-decoration:underline;
}


/* =========================
   FEEDBACK
========================= */

.feedback{
  position:fixed;

  top:80px;
  left:50%;

  z-index:30;

  transform:
    translate(-50%,-10px);

  padding:8px 14px;

  border-radius:999px;

  background:var(--acid);
  color:#111;

  font-size:11px;
  font-weight:900;

  opacity:0;

  pointer-events:none;

  transition:.2s;
}

.feedback.show{
  opacity:1;

  transform:
    translate(-50%,0);
}


/* =========================
   MODAL
========================= */

.modal{
  position:fixed;

  inset:0;

  z-index:50;

  display:none;
  align-items:center;
  justify-content:center;

  padding:20px;

  background:#05070bdf;

  backdrop-filter:blur(8px);
}

.modal.show{
  display:flex;
}

.modalBox{
  width:min(100%,460px);

  max-height:85dvh;

  overflow:auto;

  padding:20px;

  border:1px solid #555d69;
  border-radius:12px;

  background:#1d2128;
}

.modalBox h2{
  margin-top:0;
}

.modalBox p,
.modalBox li{
  color:#cad0d8;

  font-size:13px;
  line-height:1.8;
}

.statusBlock{
  padding:11px;

  margin-bottom:10px;

  border:1px solid #343a46;
  border-radius:10px;

  background:#222730;
}

.statusBlock h3{
  margin:0 0 8px;

  font-size:14px;
}

.statusMini{
  display:grid;
  grid-template-columns:1fr 1fr;

  gap:4px 10px;

  color:#eff2f7;

  font-size:12px;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-height:760px){

  .visualArea{
    height:300px;
  }

}

@media(min-width:700px){

  .visualArea{
    height:520px;
  }

  .characterImg{
    width:62%;
  }

}
</style>
</head>


<body>


<div class="app">


<header class="header">

  <div class="logo">

    O-VER-KiLL

    <span>
      MANAGER'S STORY
    </span>

  </div>


  <button
    class="help"
    id="help"
  >
    ?
  </button>

</header>


<section class="hud">

  <div class="hudTop">

    <div
      class="week"
      id="weekLabel"
    >
      WEEK 1 / 04
    </div>


    <div class="groupInfo">

      認知

      <strong id="reachLabel">
        10
      </strong>

      <br>

      活動資金

      <strong id="cashLabel">
        ¥220,000
      </strong>

    </div>

  </div>


  <div class="groupBarWrap">

    <div class="groupStat">

      <label>

        <span>
          認知
        </span>

        <strong id="reachValue">
          10
        </strong>

      </label>

      <div class="bar">

        <div
          class="fill"
          id="reachBar"
        >
        </div>

      </div>

    </div>


    <div class="groupStat">

      <label>

        <span>
          ライブ総合期待
        </span>

        <strong id="livePotential">
          59
        </strong>

      </label>

      <div class="bar">

        <div
          class="fill"
          id="liveBar"
        >
        </div>

      </div>

    </div>

  </div>


  <div
    class="memberEnergyRow"
    id="memberEnergyRow"
  >
  </div>

</section>


<section class="stage">


  <div class="stageTop">

    <b id="stageLabel">
      FIRST MEETING
    </b>

    <span id="progressLabel">
      1 / 7
    </span>

  </div>


  <div class="visualArea">


    <div
      class="photoVisual"
      id="photoVisual"
    >

      <div class="photoOverlay">

        <div
          class="photoTag"
          id="photoTag"
        >
          DEBUT LIVE
        </div>

        <div
          class="photoTitle"
          id="photoTitle"
        >
          O-VER-KiLL
        </div>

        <div
          class="photoSub"
          id="photoSub"
        >
          ここから、物語が始まる。
        </div>

      </div>

    </div>


    <div
      class="managerVisual"
      id="managerVisual"
    >

      <div class="managerLogo">

        O-VER-KiLL

        <span>
          THE BEGINNING
        </span>

      </div>

    </div>


    <div
      class="singleCharacter"
      id="singleCharacter"
    >

/* ========================================
   HELPERS
======================================== */

function yen(n){

  return "¥"
    +
    Math.round(n)
      .toLocaleString("ja-JP");

}


function clamp(
  value,
  min=0,
  max=100
){

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );

}


function avg(values){

  return values.reduce(
    (a,b)=>a+b,
    0
  )
  /
  values.length;

}


function hexToRgb(hex){

  const value =
    hex
      .replace("#","")
      .trim();


  const full =
    value.length===3

      ? value
          .split("")
          .map(v=>v+v)
          .join("")

      : value;


  const num =
    parseInt(
      full,
      16
    );


  return {

    r:
      (num >> 16)
      &
      255,

    g:
      (num >> 8)
      &
      255,

    b:
      num
      &
      255

  };

}


function adjustMember(
  id,
  key,
  amount
){

  state.members[id][key] =
    clamp(
      state.members[id][key]
      +
      amount
    );

}


function getActionEfficiency(
  member
){

  if(
    member.energy>=60
  ){

    return 1;

  }


  if(
    member.energy>=35
  ){

    return .8;

  }


  return .6;

}


function getLivePotential(){

  const ids =
    Object.keys(
      state.members
    );


  const vocal =
    avg(
      ids.map(
        id=>
          state.members[id].vocal
      )
    );


  const dance =
    avg(
      ids.map(
        id=>
          state.members[id].dance
      )
    );


  const bond =
    avg(
      ids.map(
        id=>
          state.members[id].bond
      )
    );


  const energy =
    avg(
      ids.map(
        id=>
          state.members[id].energy
      )
    );


  return clamp(

    Math.round(

      vocal*.3

      +

      dance*.28

      +

      bond*.22

      +

      energy*.1

      +

      state.reach*.1

    )

  );

}

function setSceneTheme(
  type="planning",
  memberId=null
){

  const visualArea =
    document
      .querySelector(
        ".visualArea"
      );


  visualArea
    .classList
    .remove(
      "scene-member",
      "scene-planning",
      "scene-photo"
    );


  if(
    type==="photo"
  ){

    visualArea
      .classList
      .add(
        "scene-photo"
      );

    return;

  }


  if(
    type==="member"
    &&
    memberId
    &&
    MEMBERS[memberId]
  ){

    const color =
      MEMBERS[memberId].color;


    const rgb =
      hexToRgb(
        color
      );


    visualArea.style.setProperty(
      "--scene-accent",
      color
    );


    visualArea.style.setProperty(
      "--scene-accent-rgb",
      `${rgb.r},${rgb.g},${rgb.b}`
    );


    visualArea
      .classList
      .add(
        "scene-member"
      );


    return;

  }


  visualArea
    .classList
    .add(
      "scene-planning"
    );

}

  if(

      "planning"
    );


    managerVisual
      .classList

    return;

  const member =

    member.color

/* ========================================
   ACTIVITY
======================================== */

function doActivity(
  actionId
){

  const memberId =
    state.selectedMember;


  const meta =
    MEMBERS[
      memberId
    ];


  const member =
    state.members[
      memberId
    ];


  const action =
    ACTIONS[
      actionId
    ];


  if(!action){
    return;
  }


  if(
    state.cash<action.cost
  ){
    return;
  }


  state.cash -=
    action.cost;


  const efficiency =
    getActionEfficiency(
      member
    );


  let resultText =
    "";


  let expression =
    "smile";


  if(
    actionId==="vocal"
  ){

    const gain =
      Math.round(
        8*efficiency
      );


    adjustMember(
      memberId,
      "vocal",
      gain
    );


    adjustMember(
      memberId,
      "energy",
      -8
    );


    state.reach =
      clamp(
        state.reach+1
      );


    resultText =
`${meta.name}は
ボーカル練習に集中した。

歌唱が伸びた。`;


    expression =
      "smile";

  }


  if(
    actionId==="dance"
  ){

    const gain =
      Math.round(
        8*efficiency
      );


    adjustMember(
      memberId,
      "dance",
      gain
    );


    adjustMember(
      memberId,
      "energy",
      -9
    );


    state.reach =
      clamp(
        state.reach+1
      );


    resultText =
`${meta.name}は
ダンス練習を重ねた。

動きのキレが増した。`;


    expression =
      meta.id==="kilua"
        ? "smile"
        : "normal";

  }


  if(
    actionId==="meeting"
  ){

    const gain =
      Math.round(
        7*efficiency
      );


    adjustMember(
      memberId,
      "bond",
      gain
    );


    adjustMember(
      memberId,
      "energy",
      -4
    );


    Object
      .keys(
        state.members
      )

      .forEach(id=>{

        if(
          id!==memberId
        ){

          adjustMember(
            id,
            "bond",
            1
          );

        }

      });


    resultText =
`${meta.name}を中心に
ミーティングを行った。

4人の方向性が
少し揃ってきた。`;


    expression =
      "smile";

  }


  if(
    actionId==="sns"
  ){

    adjustMember(
      memberId,
      "energy",
      -4
    );


    adjustMember(
      memberId,
      "bond",
      2
    );


    state.reach =
      clamp(
        state.reach+8
      );


    resultText =
`${meta.name}が前に出て
SNS告知を行った。

グループの認知が
広がっていく。`;


    expression =
      "smile";

  }


  if(
    actionId==="rest"
  ){

    adjustMember(
      memberId,
      "energy",
      18
    );


    resultText =
`${meta.name}は
しっかり休養をとった。

体力が回復した。`;


    expression =
      "smile";

  }


  state.plan.push({

    memberId,

    actionId

  });


  state.selectedMember =
    null;


  save();


  renderHud();


  showFeedback(
    `${meta.name}：${action.name}`
  );


  setScene({

    speakerName:
      meta.name,

    text:
      resultText,

    label:
      `WEEK ${state.week}`,

    progress:
      `${state.plan.length} / 3`,

    visual:
      "character",

    memberId,

    expression

  });


  controls.innerHTML = `

    <button
      class="primary"
      data-action="continue"
    >

      次へ →

    </button>

  `;

}

/* ========================================
   RESULT CALC
======================================== */

function calculateResult(){

  const ids =
    Object.keys(
      state.members
    );


  const vocal =
    avg(
      ids.map(
        id=>
          state.members[id].vocal
      )
    );


  const dance =
    avg(
      ids.map(
        id=>
          state.members[id].dance
      )
    );


  const bond =
    avg(
      ids.map(
        id=>
          state.members[id].bond
      )
    );


  const energy =
    avg(
      ids.map(
        id=>
          state.members[id].energy
      )
    );


  let performance =

    vocal*.30

    +

    dance*.28

    +

    bond*.22

    +

    energy*.10

    +

    state.reach*.10;


  if(
    state.setlist==="vocal"
  ){

    performance +=
      vocal*.08;

  }


  if(
    state.setlist==="dance"
  ){

    performance +=
      dance*.08;

  }


  performance =
    clamp(
      Math.round(
        performance
      )
    );


  const attendance =
    Math.max(

      35,

      Math.round(

        30

        +

        state.reach*1.8

        +

        bond*.45

      )

    );


  const fans =
    Math.max(

      6,

      Math.round(

        attendance

        *

        (
          performance/100
        )

        *

        .55

      )

    );


  const ticketIncome =
    attendance
    *
    2000;


  state.cash +=
    ticketIncome;


  const memberScores =

    ids

      .map(id=>{

        const m =
          state.members[id];


        return {

          id,

          score:
            Math.round(

              m.vocal*.3

              +

              m.dance*.3

              +

              m.bond*.2

              +

              m.energy*.2

            )

        };

      })

      .sort(
        (a,b)=>
          b.score-a.score
      );


  state.result = {

    performance,

    attendance,

    fans,

    ticketIncome,

    mvp:
      memberScores[0].id

  };

}

/* ========================================

======================================== */

function toggleSong(){

  const button =
    $("songButton");


  if(
    !songAudio.paused
  ){

    songAudio.pause();


    if(button){

      button.textContent =
        "▶ サビを聴く";


      button
        .classList
        .remove("playing");

    }


    return;

  }


  songAudio.currentTime =
    SONG_CHORUS_START;


  songAudio.play()

    .then(()=>{

      if(button){

        button.textContent =
          "■ 停止";


        button
          .classList
          .add("playing");

      }

    })

    .catch(()=>{

      showFeedback(
        "再生できませんでした"
      );

    });

}


songAudio.addEventListener(

  "timeupdate",

  ()=>{

    if(
      songAudio.currentTime
      >=
      SONG_CHORUS_END
    ){

      songAudio.pause();


      songAudio.currentTime =
        SONG_CHORUS_START;


      const button =
        $("songButton");


      if(button){

        button.textContent =
          "▶ もう一度聴く";


        button
          .classList
          .remove("playing");

      }

    }

  }

);

  if(
    state.phase==="intro"
  ){

    renderIntro();

  }


  if(
    state.phase==="planning"
  ){

    renderPlanning();

  }


  if(
    state.phase==="liveReady"
  ){

    renderLiveReady();

  }


  if(
    state.phase==="live"
  ){

    renderLive();

  }


  if(
    state.phase==="result"
  ){

    renderResult();

  }

}


/* ========================================
   CLICK EVENTS
======================================== */

document.addEventListener(

  "click",

  event=>{


    if(
      event.target.matches(
        "[data-modal-close]"
      )
    ){

      $("modal")
        .classList
        .remove("show");

      return;

    }


    const button =
      event.target.closest(
        "[data-action]"
      );


    if(
      !button
      ||
      button.disabled
    ){

      return;

    }


    const action =
      button.dataset.action;


    /* INTRO */

    if(
      action==="introNext"
    ){

      if(
        state.intro
        <
        INTRO.length-1
      ){

        state.intro++;

      }

      else{

        state.phase =
          "planning";

      }


      save();

      render();

      return;

    }


    if(
      action==="introBack"
    ){

      state.intro =
        Math.max(
          0,
          state.intro-1
        );


      save();

      render();

      return;

    }


    /* MEMBER */

    if(
      action==="pickMember"
    ){

      state.selectedMember =
        button.dataset.id;


      save();

      render();

      return;

    }


    if(
      action==="backMember"
    ){

      state.selectedMember =
        null;


      save();

      render();

      return;

    }


    /* ACTIVITY */

    if(
      action==="activity"
    ){

      doActivity(
        button.dataset.id
      );

      return;

    }


    if(
      action==="continue"
    ){

      render();

      return;

    }


    /* ADVANCE WEEK */

    if(
      action==="advance"
    ){

      state.plan =
        [];


      state.selectedMember =
        null;


      if(
        state.week===4
      ){

        state.phase =
          "liveReady";

      }

      else{

        state.week++;

      }


      save();

      render();

      return;

    }


    /* SONG */

    if(
      action==="song"
    ){

      toggleSong();

      return;

    }


    /* LIVE */

    if(
      action==="setlist"
    ){

      state.setlist =
        button.dataset.id;


      state.phase =
        "live";


      save();

      render();

      return;

    }


    if(
      action==="finish"
    ){

      calculateResult();


      state.phase =
        "result";


      save();

      render();

      return;

    }


    /* MODALS */

    if(
      action==="stats"
    ){

      openStats();

      return;

    }


    if(
      action==="helpStep"
    ){

      openHelp();

      return;

    }


    if(
      action==="history"
    ){

      openHistory();

      return;

    }


    /* RESTART */

    if(
      action==="restart"
    ){

      if(
        confirm(
          "最初からやり直しますか？"
        )
      ){

        stopSong();


        state =
          freshState();


        save();

        render();

      }


      return;

    }

  }

);
