<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111118">

<title>O-VER-KiLL｜MANAGER'S STORY</title>

<style>
@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap");

:root{
  --bg:#111118;
  --panel:#1c1b25;
  --text:#fff;
  --muted:#aaa6b4;
  --line:#393744;
  --acid:#ddff63;
  --pink:#ff8ba2;
  --blue:#72bdff;
  --green:#69e09a;
  --yellow:#ffdc69;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#101017;
  color:var(--text);
  font-family:"Noto Sans JP",sans-serif;
  -webkit-user-select:none;
  user-select:none;
}

button{
  font:inherit;
  -webkit-tap-highlight-color:transparent;
}

.screen{
  position:fixed;
  inset:0;
  display:none;
}

.screen.active{
  display:flex;
}


/* =========================================================
   LOADING
========================================================= */

#loadingScreen{
  z-index:100;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;

  background:
    radial-gradient(circle at 50% 20%,rgba(221,255,99,.18),transparent 34%),
    radial-gradient(circle at 15% 75%,rgba(112,189,255,.18),transparent 30%),
    radial-gradient(circle at 85% 72%,rgba(255,139,162,.16),transparent 30%),
    linear-gradient(160deg,#252233,#111118);
}

.loadingStars{
  position:absolute;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}

.loadingStars span{
  position:absolute;
  font-size:28px;
  opacity:.7;
  animation:floatStar 2.6s ease-in-out infinite;
}

.loadingStars span:nth-child(1){
  top:9%;
  left:12%;
}

.loadingStars span:nth-child(2){
  top:18%;
  right:14%;
  animation-delay:.4s;
}

.loadingStars span:nth-child(3){
  bottom:19%;
  left:16%;
  animation-delay:.8s;
}

.loadingStars span:nth-child(4){
  bottom:12%;
  right:11%;
  animation-delay:1.2s;
}

@keyframes floatStar{
  0%,100%{
    transform:translateY(0) rotate(-7deg);
  }
  50%{
    transform:translateY(-12px) rotate(7deg);
  }
}

.loadingLogo{
  text-align:center;
  font-weight:900;
  font-style:italic;
  font-size:31px;
  letter-spacing:-2px;
  z-index:2;
}

.loadingLogo small{
  display:block;
  margin-top:9px;
  color:#b1adbb;
  font-size:9px;
  font-style:normal;
  letter-spacing:4px;
}

.loadingCharacterWrap{
  position:relative;
  width:230px;
  height:270px;
  margin-top:16px;
}

.loadingCharacter{
  width:100%;
  height:100%;
  object-fit:contain;
  filter:drop-shadow(0 18px 22px rgba(0,0,0,.45));
  animation:loadingBounce .9s ease-in-out infinite alternate;
}

@keyframes loadingBounce{
  from{
    transform:translateY(4px) scale(.98);
  }
  to{
    transform:translateY(-7px) scale(1.02);
  }
}

.loadingSpeech{
  min-height:42px;
  padding:8px 18px;
  margin-top:-4px;
  border-radius:999px;
  background:#fff;
  color:#16151c;
  font-size:11px;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 8px 25px rgba(0,0,0,.23);
  z-index:3;
}

.loadingBarOuter{
  width:min(78vw,330px);
  height:18px;
  margin-top:18px;
  padding:3px;
  border:2px solid rgba(255,255,255,.8);
  border-radius:999px;
  background:rgba(0,0,0,.25);
  overflow:hidden;
}

.loadingBarInner{
  height:100%;
  width:0%;
  border-radius:999px;
  background:
    linear-gradient(
      90deg,
      #75c8ff,
      #79efbe,
      #ddff63,
      #ffd86d,
      #ff90ad
    );
  transition:width .12s linear;
}

.loadingPercent{
  margin-top:7px;
  font-size:13px;
  font-weight:900;
  letter-spacing:1px;
}


/* =========================================================
   TITLE
========================================================= */

#titleScreen{
  z-index:90;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
  overflow:hidden;
  background:#000;
}

.titlePhoto{
  position:absolute;
  inset:0;
  background:url("./debut-live.webp") center/cover no-repeat;
}

.titlePhoto::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.15),
      rgba(0,0,0,.12) 38%,
      rgba(8,8,12,.80) 82%,
      #111118
    );
}

.titleSpark{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 17% 14%,rgba(221,255,99,.15),transparent 17%),
    radial-gradient(circle at 81% 24%,rgba(255,139,162,.14),transparent 18%);
  pointer-events:none;
}

.titleContent{
  position:relative;
  z-index:3;
  width:100%;
  padding:0 23px max(30px,env(safe-area-inset-bottom));
  text-align:center;
}

.titleMini{
  color:var(--acid);
  font-size:10px;
  font-weight:900;
  letter-spacing:4px;
}

.titleMain{
  margin-top:6px;
  font-size:40px;
  font-weight:900;
  font-style:italic;
  letter-spacing:-3px;
  text-shadow:0 7px 30px rgba(0,0,0,.55);
}

.titleSub{
  margin-top:5px;
  color:#ddd9e5;
  font-size:10px;
  letter-spacing:5px;
}

.startButton{
  width:100%;
  height:62px;
  margin-top:23px;
  border:0;
  border-radius:18px;
  background:
    linear-gradient(
      135deg,
      #e4ff68,
      #c8ff4d
    );
  color:#12130d;
  font-size:17px;
  font-weight:900;
  box-shadow:
    0 10px 30px rgba(213,255,93,.21),
    inset 0 -3px 0 rgba(0,0,0,.10);
  animation:startPulse 1.8s ease-in-out infinite;
}

@keyframes startPulse{
  50%{
    transform:scale(1.018);
    box-shadow:0 12px 34px rgba(213,255,93,.31);
  }
}

.continueButton{
  margin-top:10px;
  border:0;
  background:none;
  color:#bbb7c5;
  font-size:11px;
  text-decoration:underline;
}


/* =========================================================
   PROLOGUE
========================================================= */

#prologueScreen{
  z-index:80;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#050508;
}

.prologueImage{
  position:absolute;
  inset:0;
  background:url("./debut-live.webp") center/cover no-repeat;
  opacity:0;
  transform:scale(1.05);
  transition:
    opacity 1.5s ease,
    transform 4s ease;
}

.prologueImage.show{
  opacity:.72;
  transform:scale(1);
}

.prologueShade{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.42),
      rgba(0,0,0,.18) 45%,
      rgba(0,0,0,.75)
    );
}

.prologueText{
  position:relative;
  z-index:2;
  width:86%;
  text-align:center;
  white-space:pre-line;
  font-size:18px;
  font-weight:700;
  line-height:2;
  text-shadow:0 4px 16px rgba(0,0,0,.7);
}

.prologueHint{
  position:absolute;
  z-index:3;
  bottom:max(35px,env(safe-area-inset-bottom));
  font-size:10px;
  color:rgba(255,255,255,.65);
  animation:hintBlink 1.2s ease-in-out infinite;
}


/* =========================================================
   GAME
========================================================= */

#gameScreen{
  z-index:70;
  flex-direction:column;
  overflow:hidden;
  background:#15141c;
}

.gameTop{
  height:max(52px,calc(40px + env(safe-area-inset-top)));
  flex-shrink:0;
  padding:
    max(10px,env(safe-area-inset-top))
    13px
    7px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  background:#17161e;
  border-bottom:1px solid #34323d;
}

.chapter{
  color:var(--acid);
  font-size:10px;
  font-weight:900;
  letter-spacing:1.7px;
}

.topButtons{
  display:flex;
  align-items:center;
  gap:7px;
}

.miniStatus{
  border:1px solid #46434f;
  border-radius:999px;
  background:#25232c;
  color:#fff;
  padding:6px 11px;
  font-size:9px;
  font-weight:800;
}

.scene{
  position:relative;
  flex:1;
  min-height:0;
  overflow:hidden;
  background:#24252d;
}

.environment{
  position:absolute;
  inset:0;
  transition:background .35s ease;
}

.environment.studio{
  background:
    linear-gradient(to bottom,rgba(255,255,255,.07),transparent 20%),
    repeating-linear-gradient(
      to right,
      rgba(255,255,255,.03) 0 1px,
      transparent 1px 105px
    ),
    linear-gradient(
      to bottom,
      #454953 0 55%,
      #262831 55% 57%,
      #1a1b21 57%
    );
}

.environment.studio::before{
  content:"";
  position:absolute;
  left:7%;
  right:7%;
  top:8%;
  height:42%;
  border:4px solid rgba(255,255,255,.08);
  background:
    linear-gradient(
      120deg,
      rgba(255,255,255,.10),
      rgba(255,255,255,.015)
    );
}

.environment.studio::after{
  content:"DANCE STUDIO";
  position:absolute;
  right:10%;
  top:11%;
  color:rgba(255,255,255,.12);
  font-size:10px;
  font-weight:900;
  letter-spacing:3px;
}

.environment.lounge{
  background:
    radial-gradient(circle at 18% 25%,rgba(255,201,116,.18),transparent 26%),
    radial-gradient(circle at 83% 25%,rgba(111,185,255,.16),transparent 25%),
    linear-gradient(to bottom,#37333e,#221f28 60%,#19171e);
}

.environment.sns{
  background:
    radial-gradient(circle at 50% 28%,rgba(129,108,255,.26),transparent 34%),
    radial-gradient(circle at 23% 72%,rgba(255,125,175,.19),transparent 23%),
    linear-gradient(150deg,#312642,#15151e);
}

.environment.city{
  background:
    linear-gradient(to bottom,rgba(92,144,195,.24),transparent 38%),
    linear-gradient(140deg,#48515d,#2d343c 52%,#20242a);
}

.environment.manager{
  background:
    radial-gradient(circle at 50% 35%,rgba(221,255,99,.12),transparent 32%),
    linear-gradient(to bottom,#2c2c35,#18181f);
}

.stageDecoration{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.stageDecoration::before{
  content:"";
  position:absolute;
  left:7%;
  bottom:3%;
  width:86%;
  height:17%;
  background:
    radial-gradient(
      ellipse,
      rgba(0,0,0,.48),
      transparent 70%
    );
}

.characterAura{
  position:absolute;
  left:50%;
  top:43%;
  width:270px;
  height:270px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:
    radial-gradient(
      circle,
      rgba(var(--char-rgb),.23),
      rgba(var(--char-rgb),0) 68%
    );
  filter:blur(11px);
  display:none;
}

.characterAura.show{
  display:block;
}

.character{
  position:absolute;
  z-index:4;
  left:50%;
  bottom:0;
  width:78%;
  height:86%;
  object-fit:contain;
  object-position:center bottom;
  transform:translateX(-50%);
  filter:drop-shadow(0 19px 17px rgba(0,0,0,.48));
  display:none;
}

.character.show{
  display:block;
  animation:characterIn .28s ease both;
}

@keyframes characterIn{
  from{
    opacity:0;
    transform:translateX(-50%) translateY(18px) scale(.95);
  }
  to{
    opacity:1;
    transform:translateX(-50%) translateY(0) scale(1);
  }
}

.reaction{
  position:absolute;
  z-index:10;
  top:13%;
  right:15%;
  font-size:38px;
  opacity:0;
}

.reaction.show{
  animation:reactionPop .55s ease both;
}

@keyframes reactionPop{
  0%{
    opacity:0;
    transform:scale(.4) rotate(-12deg);
  }
  55%{
    opacity:1;
    transform:scale(1.2) rotate(8deg);
  }
  100%{
    opacity:1;
    transform:scale(1) rotate(0);
  }
}

.managerLogo{
  position:absolute;
  inset:0;
  z-index:2;
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.managerLogo.show{
  display:flex;
}

.managerLogo strong{
  font-size:34px;
  font-style:italic;
  letter-spacing:-2px;
}

.managerLogo small{
  display:block;
  margin-top:9px;
  color:#8c8996;
  font-size:9px;
  font-style:normal;
  letter-spacing:4px;
}


/* =========================================================
   TALK BOX
========================================================= */

.dialogueLayer{
  position:absolute;
  z-index:20;
  left:10px;
  right:10px;
  bottom:max(10px,env(safe-area-inset-bottom));
}

.dialogueBox{
  position:relative;
  min-height:150px;
  max-height:45vh;
  padding:16px 18px 17px;
  overflow:hidden;
  border-radius:18px;
  background:#faf7f0;
  color:#17171d;
  box-shadow:0 12px 35px rgba(0,0,0,.45);
}

.dialogueBox::before{
  content:"";
  position:absolute;
  top:-10px;
  left:40px;
  width:22px;
  height:22px;
  transform:rotate(45deg);
  background:#faf7f0;
}

.speaker{
  margin-bottom:8px;
  font-size:10px;
  font-weight:900;
  letter-spacing:1.7px;
}

.dialogueText{
  min-height:60px;
  white-space:pre-line;
  font-size:16px;
  font-weight:600;
  line-height:1.65;
}

.advanceHint{
  position:absolute;
  right:16px;
  bottom:11px;
  color:#77717e;
  font-size:16px;
  font-weight:900;
  animation:arrowFloat .9s ease-in-out infinite;
}

@keyframes arrowFloat{
  50%{
    transform:translateY(5px);
  }
}

.firstTapGuide{
  position:absolute;
  z-index:50;
  right:17px;
  bottom:176px;
  display:none;
  padding:8px 12px;
  border-radius:999px;
  background:var(--acid);
  color:#111;
  font-size:10px;
  font-weight:900;
  box-shadow:0 8px 22px rgba(0,0,0,.32);
  animation:guidePulse 1s ease-in-out infinite;
}

.firstTapGuide.show{
  display:block;
}

@keyframes guidePulse{
  50%{
    transform:translateY(-5px) scale(1.04);
  }
}


/* =========================================================
   CHOICES INSIDE SPEECH
========================================================= */

.choiceIntro{
  margin-bottom:7px;
  font-size:14px;
  font-weight:700;
}

.inlineChoices{
  display:grid;
  gap:7px;
  margin-top:9px;
}

.inlineChoice{
  width:100%;
  min-height:40px;
  padding:9px 11px;
  border:1px solid #c7c1cc;
  border-radius:10px;
  background:#eeebf1;
  color:#1d1a22;
  text-align:left;
  font-size:12px;
  font-weight:800;
}

.inlineChoice:active{
  transform:scale(.985);
  background:#ddff63;
}


/* =========================================================
   STAT POP
========================================================= */

.statPopLayer{
  position:absolute;
  z-index:45;
  inset:0;
  pointer-events:none;
}

.statPop{
  position:absolute;
  left:50%;
  top:26%;
  transform:translateX(-50%);
  min-width:190px;
  padding:11px 15px;
  border-radius:13px;
  background:rgba(19,18,25,.94);
  border:1px solid rgba(255,255,255,.15);
  text-align:center;
  box-shadow:0 12px 28px rgba(0,0,0,.42);
  animation:statPopAnim 1.6s ease both;
}

.statPopTitle{
  color:var(--acid);
  font-size:9px;
  font-weight:900;
  letter-spacing:2px;
}

.statPopValue{
  margin-top:5px;
  font-size:20px;
  font-weight:900;
}

.statPopValue.minus{
  color:#ff9da7;
}

@keyframes statPopAnim{
  0%{
    opacity:0;
    transform:translate(-50%,18px) scale(.85);
  }
  15%{
    opacity:1;
    transform:translate(-50%,0) scale(1.07);
  }
  70%{
    opacity:1;
  }
  100%{
    opacity:0;
    transform:translate(-50%,-22px) scale(.98);
  }
}


/* =========================================================
   RESULT MINI
========================================================= */

.resultCard{
  position:absolute;
  z-index:55;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(10,9,14,.76);
  backdrop-filter:blur(6px);
}

.resultCard.show{
  display:flex;
}

.resultInner{
  width:min(100%,380px);
  padding:18px;
  border-radius:18px;
  background:#24222c;
  border:1px solid #4c4955;
  box-shadow:0 20px 50px rgba(0,0,0,.5);
}

.resultSmall{
  color:var(--acid);
  text-align:center;
  font-size:9px;
  font-weight:900;
  letter-spacing:3px;
}

.resultHeading{
  margin-top:6px;
  text-align:center;
  font-size:18px;
  font-weight:900;
}

.resultLines{
  display:grid;
  gap:6px;
  margin-top:13px;
}

.resultLine{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 9px;
  border-radius:9px;
  background:#302e38;
  font-size:10px;
}

.resultDelta{
  font-size:14px;
  font-weight:900;
  color:#d7ff63;
}

.resultDelta.minus{
  color:#ff9da7;
}

.resultContinue{
  margin-top:11px;
  text-align:center;
  color:#aaa6b3;
  font-size:9px;
}


/* =========================================================
   WEEK END
========================================================= */

.weekEnd{
  position:absolute;
  z-index:70;
  inset:0;
  display:none;
  padding:
    max(25px,env(safe-area-inset-top))
    20px
    max(24px,env(safe-area-inset-bottom));
  overflow:auto;
  background:
    radial-gradient(circle at 50% 13%,rgba(221,255,99,.14),transparent 27%),
    #15141c;
}

.weekEnd.show{
  display:block;
}

.weekTag{
  color:var(--acid);
  font-size:10px;
  font-weight:900;
  letter-spacing:3px;
}

.weekEnd h2{
  margin:11px 0 5px;
  font-size:29px;
  line-height:1.25;
}

.weekEndText{
  color:#a7a3b0;
  font-size:11px;
  line-height:1.7;
}

.weekSummary{
  margin-top:18px;
  padding:12px;
  border-radius:13px;
  background:#222029;
  border:1px solid #3b3844;
}

.weekSummaryRow{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:7px 0;
  border-bottom:1px solid #35323d;
  font-size:10px;
}

.weekSummaryRow:last-child{
  border:none;
}

.weekDays{
  margin-top:22px;
  text-align:center;
  font-size:11px;
}

.weekDays strong{
  display:block;
  margin-top:4px;
  color:var(--acid);
  font-size:36px;
}

.weekNext{
  width:100%;
  height:53px;
  margin-top:20px;
  border:0;
  border-radius:14px;
  background:var(--acid);
  color:#111;
  font-weight:900;
}


/* =========================================================
   STATUS MODAL
========================================================= */

.modal{
  position:fixed;
  z-index:120;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(4,4,8,.84);
  backdrop-filter:blur(8px);
}

.modal.show{
  display:flex;
}

.modalBox{
  width:min(100%,410px);
  max-height:82vh;
  overflow:auto;
  padding:18px;
  border-radius:17px;
  background:#211f28;
  border:1px solid #474450;
}

.modalBox h2{
  margin:0 0 10px;
  font-size:19px;
}

.statusGroup{
  margin-bottom:12px;
  color:#aaa7b3;
  font-size:11px;
  line-height:1.8;
}

.statusMember{
  padding:10px;
  margin-top:7px;
  border-radius:10px;
  background:#2b2933;
}

.statusMember h3{
  margin:0 0 5px;
  font-size:12px;
}

.statusValues{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4px 8px;
  font-size:10px;
}

.modalClose{
  width:100%;
  margin-top:15px;
  padding:11px;
  border:0;
  border-radius:11px;
  background:var(--acid);
  color:#111;
  font-weight:900;
}


/* =========================================================
   UTILITY
========================================================= */

@keyframes hintBlink{
  50%{
    opacity:.35;
  }
}

.hidden{
  display:none !important;
}

</style>
</head>

<body>


<!-- ======================================================
     LOADING
====================================================== -->

<section class="screen active" id="loadingScreen">

  <div class="loadingStars">
    <span>★</span>
    <span>☆</span>

let loadingValue = 0;
let loadingMemberIndex = 0;


function startLoading(){

  const timer =
    setInterval(()=>{

      loadingValue +=
        Math.floor(
          Math.random()*7
        )
        +
        3;


      if(
        loadingValue > 100
      ){

        loadingValue=100;

      }


      $("loadingBar").style.width =
        loadingValue+"%";


      $("loadingPercent").textContent =
        loadingValue+"%";


      const targetIndex =
        Math.min(
          3,
          Math.floor(
            loadingValue/25
          )
        );


      if(
        targetIndex !== loadingMemberIndex
      ){

        loadingMemberIndex =
          targetIndex;


        $("loadingCharacter").src =
          loadingMembers[
            loadingMemberIndex
          ].img;


        $("loadingSpeech").textContent =
          loadingMembers[
            loadingMemberIndex
          ].text;

      }


      if(
        loadingValue>=100
      ){

        clearInterval(timer);


        setTimeout(
          ()=>{
            showScreen("title");
          },
          450
        );

      }

    },110);

}


function showScreen(name){

  [
    loadingScreen,
    titleScreen,
    prologueScreen,
    gameScreen
  ]
  .forEach(
    el=>
      el.classList.remove(
        "active"
      )
  );


  if(name==="loading"){
    loadingScreen.classList.add("active");
  }

  if(name==="title"){
    titleScreen.classList.add("active");
  }

  if(name==="prologue"){
    prologueScreen.classList.add("active");
  }

  if(name==="game"){
    gameScreen.classList.add("active");
  }

}

let prologueIndex = 0;

function startPrologue(){

  showScreen("prologue");

  prologueIndex = 0;

  prologueImage.classList.remove(
    "show"
  );

  setTimeout(
    ()=>{
      prologueImage.classList.add(
        "show"
      );
    },
    200
  );

  typePrologue(
    PROLOGUE_LINES[0]
  );

}


function typePrologue(text){

  prologueTyping =
    true;

  prologueFullText =
    text;

  prologueText.textContent =
    "";

  let i=0;


  const timer =
    setInterval(()=>{

      i++;

      prologueText.textContent =
        text.slice(
          0,
          i
        );


      if(
        i>=text.length
      ){

        clearInterval(timer);

        prologueTyping =
          false;

      }

    },45);


  prologueText._timer =
    timer;

}


prologueScreen.onclick =
()=>{

  if(
    prologueTyping
  ){

    clearInterval(
      prologueText._timer
    );

    prologueText.textContent =
      prologueFullText;

    prologueTyping =
      false;

    return;

  }


  prologueIndex++;


  if(
    prologueIndex
    >=
    PROLOGUE_LINES.length
  ){

    state.prologueSeen =
      true;

    save();

    showScreen("game");

    renderNode();

    return;

  }


  typePrologue(
    PROLOGUE_LINES[
      prologueIndex
    ]
  );

};

/* =========================================================
   HELPERS
========================================================= */

function clamp(v){

  return Math.max(
    0,
    Math.min(
      100,
      v
    )
  );

}


function avgBond(){

  const ids =
    Object.keys(
      state.members
    );

  return Math.round(
    ids.reduce(
      (sum,id)=>
        sum
        +
        state.members[id].bond,
      0
    )
    /
    ids.length
  );

}


function labelMetric(metric){

  return {

    vocal:"歌唱",

    dance:"ダンス",

    bond:"連携",

    energy:"体力",

    reach:"認知"

  }[metric];

}


/* =========================================================
   BACKGROUND
========================================================= */

function setBackground(bg){

  environment.className =
    "environment "
    +
    (
      bg
      ||
      "manager"
    );

}


/* =========================================================
   CHARACTER
========================================================= */

function setCharacter(
  memberId,
  expression="normal"
){

  character.classList.remove(
    "show"
  );

  characterAura.classList.remove(
    "show"
  );

  managerLogo.classList.remove(
    "show"
  );


  if(
    !memberId
  ){

    managerLogo.classList.add(
      "show"
    );

    return;

  }


  const member =
    MEMBERS[memberId];


  character.src =
    CHAR_IMAGES[
      memberId
    ][expression]
    ||
    CHAR_IMAGES[
      memberId
    ].normal;


  character.alt =
    member.name;


  characterAura.style.setProperty(
    "--char-rgb",
    member.rgb
  );


  requestAnimationFrame(
    ()=>{

      character.classList.add(
        "show"
      );

      characterAura.classList.add(
        "show"
      );

    }
  );

}


/* =========================================================
   REACTION
========================================================= */

function setReaction(symbol){

  reaction.classList.remove(
    "show"
  );

  reaction.textContent =
    "";


  if(!symbol){
    return;
  }


  reaction.textContent =
    symbol;


  requestAnimationFrame(
    ()=>{
      reaction.classList.add(
        "show"
      );
    }
  );

}


/* =========================================================
   TYPEWRITER
========================================================= */

let typing = false;
let currentFullText = "";
let typingTimer = null;


function typeDialogue(text){

  clearInterval(
    typingTimer
  );


  typing =
    true;


  currentFullText =
    text;


  dialogueText.innerHTML =
    "";


  advanceHint.style.display =
    "none";


  let i=0;


  typingTimer =
    setInterval(
      ()=>{

        i++;


        dialogueText.textContent =
          text.slice(
            0,
            i
          );


        if(
          i>=text.length
        ){

          clearInterval(
            typingTimer
          );


          typing =
            false;


          advanceHint.style.display =
            "block";

        }

      },
      27
    );

}


/* =========================================================
   RENDER STORY
========================================================= */

function renderNode(){

  if(
    state.node==="weekComplete"
  ){

    renderWeekEnd();

    return;

  }


  const node =
    STORY[state.node];


  if(!node){
    return;
  }


  $("chapterLabel").textContent =
    node.chapter
    ||
    "WEEK 1";


  setBackground(
    node.bg
  );


  setCharacter(
    node.member,
    node.expression
  );


  setReaction(
    node.reaction
  );


  speaker.textContent =
    node.speaker
    ||
    "MANAGER";


  dialogueBox.onclick =
    null;


  if(
    node.choices
  ){

    typing =
      false;


    advanceHint.style.display =
      "none";


    dialogueText.innerHTML = `

      <div class="choiceIntro">
        ${node.text.replace(/\n/g,"<br>")}
      </div>

      <div class="inlineChoices">

        ${node.choices
          .map(
            (choice,index)=>`

            <button
              class="inlineChoice"
              data-choice="${index}"
            >
              ${choice.text}
            </button>

          `
          )
          .join("")
        }

      </div>

    `;


    return;

  }


  typeDialogue(
    node.text
  );


  if(
    !state.tutorialSeen
  ){

    firstTapGuide.classList.add(
      "show"
    );

  }


  dialogueBox.onclick =
    advanceDialogue;

}


/* =========================================================
   ADVANCE
========================================================= */

function advanceDialogue(){

  if(
    !state.tutorialSeen
  ){

    state.tutorialSeen =
      true;

    firstTapGuide.classList.remove(
      "show"
    );

    save();

  }


  if(
    typing
  ){

    clearInterval(
      typingTimer
    );


    dialogueText.textContent =
      currentFullText;


    typing =
      false;


    advanceHint.style.display =
      "block";


    return;

  }


  const node =
    STORY[state.node];


  if(!node){
    return;
  }


  if(
    node.result
  ){

    const result =
      runResult(
        node.result
      );


    showResult(
      result,
      node.next
    );


    return;

  }


  if(
    node.next
  ){

    state.node =
      node.next;

    save();

    renderNode();

  }

}


/* =========================================================
   CHOICES
========================================================= */

dialogueText.addEventListener(
  "click",
  event=>{

    const button =
      event.target.closest(
        "[data-choice]"
      );


    if(!button){
      return;
    }


    event.stopPropagation();


    const node =
      STORY[state.node];


    const choice =
      node.choices[
        Number(
          button.dataset.choice
        )
      ];


    applyChoiceFlag(
      choice.action
    );


    state.node =
      choice.next;


    save();

    renderNode();

  }
);


function applyChoiceFlag(action){

  if(
    action==="teach"
  ){

    state.flags.danceChoice =
      "teach";

    state.flags.kiluaTeaching =
      true;

    state.flags.bondRoute =
      true;

  }


  if(
    action==="split"
  ){

    state.flags.danceChoice =
      "split";

    state.flags.bondRoute =
      true;

  }


  if(
    action==="push"
  ){

    state.flags.danceChoice =
      "push";

    state.flags.conflict =
      true;

  }


  if(
    action==="restDance"
  ){

    state.flags.danceChoice =
      "rest";

    state.flags.bondRoute =
      true;

  }


  if(
    [
      "sns",
      "flyer",
      "vocal",
      "recovery"
    ].includes(action)
  ){

    state.flags.promotionChoice =
      action;

  }

}


/* =========================================================
   RESULTS
========================================================= */

function updateMember(
  member,
  metric,
  delta
){

  const before =
    state.members[
      member
    ][metric];


  state.members[
    member
  ][metric] =
    clamp(
      before
      +
      delta
    );


  return {

    member,

    name:
      MEMBERS[
        member
      ].name,

    metric,

    before,

    after:
      state.members[
        member
      ][metric],

    delta

  };

}


function updateReach(delta){

  const before =
    state.reach;


  state.reach =
    clamp(
      state.reach
      +
      delta
    );


  return {

    member:"group",

    name:"GROUP",

    metric:"reach",

    before,

    after:state.reach,

    delta

  };

}

/* =========================================================
   RESULT UI
========================================================= */

function showResult(
  result,
  nextNode
){

  resultInner.innerHTML = `

    <div class="resultSmall">
      ${result.title}
    </div>

    <div class="resultHeading">
      ${result.headline}
    </div>

    <div class="resultLines">

      ${result.changes
        .map(
          change=>`

          <div class="resultLine">

            <span>
              ${change.name}
              ・
              ${labelMetric(change.metric)}
            </span>

            <span>
              ${change.before}
              →
              ${change.after}
            </span>

            <span
              class="
                resultDelta
                ${
                  change.delta<0
                  ? "minus"
                  : ""
                }
              "
            >
              ${
                change.delta>0
                ? "+"
                : ""
              }
              ${change.delta}
            </span>

          </div>

        `
        )
        .join("")
      }

    </div>

    <div class="resultContinue">
      タップして続ける
    </div>

  `;


  resultCard.classList.add(
    "show"
  );


  animateStatPops(
    result.changes
  );


  resultCard.onclick =
    ()=>{

      resultCard.classList.remove(
        "show"
      );


      state.node =
        nextNode;


      save();

      renderNode();

    };

}


/* =========================================================
   POP NUMBERS
========================================================= */

function animateStatPops(
  changes
){

  statPopLayer.innerHTML =
    "";


  const important =
    changes.slice(
      0,
      3
    );


  important.forEach(
    (change,index)=>{

      setTimeout(
        ()=>{

          const pop =
            document.createElement(
              "div"
            );


          pop.className =
            "statPop";


          pop.style.top =
            (
              19
              +
              index*11
            )
            +
            "%";


          pop.innerHTML = `

            <div class="statPopTitle">
              ${change.name}
            </div>

            <div
              class="
                statPopValue
                ${
                  change.delta<0
                  ? "minus"
                  : ""
                }
              "
            >

              ${labelMetric(change.metric)}

              ${
                change.delta>0
                ? "+"
                : ""
              }

              ${change.delta}！

            </div>

          `;


          statPopLayer.appendChild(
            pop
          );


          setTimeout(
            ()=>{
              pop.remove();
            },
            1700
          );

        },
        index*260
      );

    }
  );

}


/* =========================================================
   WEEK END
========================================================= */

function buildWeekSummary(){

  const rows = [];


  if(
    state.reach
    !==
    state.startSnapshot.reach
  ){

    const delta =
      state.reach
      -
      state.startSnapshot.reach;


    rows.push(`

      <div class="weekSummaryRow">

        <span>
          GROUP｜認知
        </span>

        <strong>
          ${state.startSnapshot.reach}
          →
          ${state.reach}

          <span
            style="
              color:
              ${delta>=0
                ? "#ddff63"
                : "#ff9da7"};
            "
          >
            ${delta>=0?"+":""}${delta}
          </span>

        </strong>

      </div>

    `);

  }


  Object.keys(
    MEMBERS
  )
  .forEach(
    id=>{

      [
        "vocal",
        "dance",
        "bond",
        "energy"
      ]
      .forEach(
        metric=>{

          const before =
            state.startSnapshot
              .members[id][metric];


          const after =
            state.members[id][metric];


          if(
            before===after
          ){
            return;
          }


          const delta =
            after-before;


          rows.push(`

            <div class="weekSummaryRow">

              <span>
                ${MEMBERS[id].name}
                ｜
                ${labelMetric(metric)}
              </span>

              <strong>
                ${before}
                →
                ${after}

                <span
                  style="
                    color:
                    ${delta>=0
                      ? "#ddff63"
                      : "#ff9da7"};
                  "
                >
                  ${delta>=0?"+":""}${delta}
                </span>

              </strong>

            </div>

          `);

        }
      );

    }
  );


  return rows.join("");

}


function renderWeekEnd(){

  state.weekFinished =
    true;

  save();


  weekEnd.innerHTML = `

    <div class="weekTag">
      WEEK 1 COMPLETE
    </div>

    <h2>
      4人でやるって、<br>
      難しい。
    </h2>

    <div class="weekEndText">
      まだバラバラ。<br>
      でも、少しずつ4人の形が見えてきた。
    </div>

    <div class="weekSummary">

      ${buildWeekSummary()}

    </div>

    <div class="weekDays">

      デビューまで

      <strong>
        あと21日
      </strong>

    </div>

    <button
      class="weekNext"
      id="weekNext"
    >
      WEEK 2へ →
    </button>

  `;


  weekEnd.classList.add(
    "show"
  );


  $("weekNext").onclick =
    ()=>{

      alert(
        "WEEK 2は次のアップデートで追加します！"
      );

    };

}


/* =========================================================
   STATUS
========================================================= */

$("statusButton").onclick =
()=>{

  $("modalBox").innerHTML = `

    <h2>
      O-VER-KiLL STATUS
    </h2>

    <div class="statusGroup">

      認知：
      ${state.reach}

      <br>

      連携平均：
      ${avgBond()}

      <br>

      活動資金：

    </div>


    ${Object.keys(MEMBERS)
      .map(
        id=>{

          const member =
            MEMBERS[id];


          const stats =
            state.members[id];


          return `

            <div class="statusMember">

              <h3
                style="
                  color:${member.color}

              >
                ${member.name}
              </h3>

              <div class="statusValues">

                <div>
                  🎤 歌唱
                  ${stats.vocal}
                </div>

                <div>
                  💃 ダンス
                  ${stats.dance}
                </div>

                <div>
                  🤝 連携
                  ${stats.bond}
                </div>

                <div>
                  ❤️ 体力
                  ${stats.energy}
                </div>

              </div>

            </div>

          `;

        }
      )
      .join("")
    }


    <button
      class="modalClose"
      data-close
    >
      閉じる
    </button>

  `;


  $("modal").classList.add(

  );

};


$("modal").onclick =
event=>{

  if(
    event.target.id==="modal"
    ||
    event.target.matches(
      "[data-close]"
    )
  ){

    $("modal").classList.remove(
      "show"
    );

  }

};

   INITIALIZE
========================================================= */

startLoading();

</script>
