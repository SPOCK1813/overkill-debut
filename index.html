const env=$("env"),char=$("char"),aura=$("aura"),mgr=$("managerMark"),react=$("reaction"),speaker=$("speaker"),text=$("text"),dialogue=$("dialogue"),nextMark=$("nextMark"),tap=$("tapGuide");
let typing=false,full="",tm=null;
function setScene(n){$("chapter").textContent=n.chapter||"WEEK 1";env.className="environment "+(n.bg||"manager");char.classList.remove("show");aura.classList.remove("show");mgr.classList.remove("show");react.classList.remove("show");react.textContent="";if(n.member){char.src=IMG[n.member][n.expression||"normal"];aura.style.setProperty("--char-rgb",M[n.member].rgb);requestAnimationFrame(()=>{char.classList.add("show");aura.classList.add("show")})}else mgr.classList.add("show");if(n.reaction){react.textContent=n.reaction;react.classList.add("show")}speaker.textContent=n.speaker||"MANAGER"}
function typeLine(t){clearInterval(tm);typing=true;full=t;text.innerHTML="";nextMark.style.display="none";let i=0;tm=setInterval(()=>{i++;text.textContent=t.slice(0,i);if(i>=t.length){clearInterval(tm);typing=false;nextMark.style.display="block"}},24)}
function render(){if(state.node==="weekComplete"){renderWeek();return}const n=S[state.node];setScene(n);dialogue.onclick=null;if(n.choices){typing=false;nextMark.style.display="none";text.innerHTML=`<div class="choiceIntro">${n.text.replace(/
/g,"<br>")}</div><div class="choices">${n.choices.map((c,i)=>`<button class="choice" data-choice="${i}">${c[0]}</button>`).join("")}</div>`}else{typeLine(n.text);if(!state.tutorialSeen)tap.classList.add("show");dialogue.onclick=advance}}
function advance(){if(!state.tutorialSeen){state.tutorialSeen=true;tap.classList.remove("show");save()}if(typing){clearInterval(tm);text.textContent=full;typing=false;nextMark.style.display="block";return}const n=S[state.node];if(n.result){showResult(runResult(n.result),n.next);return}state.node=n.next;save();render()}
text.addEventListener("click",e=>{const b=e.target.closest("[data-choice]");if(!b)return;e.stopPropagation();const c=S[state.node].choices[+b.dataset.choice];state.node=c[2];save();render()});
function up(id,m,d){const before=state.members[id][m];state.members[id][m]=clamp(before+d);return{name:M[id].name,metric:m,before,after:state.members[id][m],delta:d}}
function upR(d){const before=state.reach;state.reach=clamp(before+d);return{name:"GROUP",metric:"reach",before,after:state.reach,delta:d}}
function runResult(t){let c=[],title="RESULT",head="";if(t==="teach"){title="LESSON RESULT";head="教えることも、練習。";c=[up("kilua","dance",3),up("kilua","bond",6),up("sarina","dance",5),up("miyu","dance",5),up("raisa","dance",4),up("sarina","energy",-7),up("miyu","energy",-7),up("kilua","energy",-7),up("raisa","energy",-7)]}if(t==="split"){title="LESSON RESULT";head="4人で揃えられる。";["sarina","miyu","kilua","raisa"].forEach(id=>c.push(up(id,"dance",4),up(id,"bond",3),up(id,"energy",-7)))}if(t==="push"){title="LESSON RESULT";head="伸びた。でも少し無理をした。";c=[up("sarina","dance",7),up("miyu","dance",7),up("kilua","dance",4),up("raisa","dance",5),up("sarina","energy",-12),up("miyu","energy",-12),up("kilua","energy",-8),up("raisa","energy",-13)]}if(t==="rest"){title="LESSON RESULT";head="止まったから見えたこともある。";["sarina","miyu","kilua","raisa"].forEach(id=>c.push(up(id,"bond",4),up(id,"energy",-3)))}if(t==="sns"){title="SNS RESULT";head="知らない誰かに届いた。";c=[upR(8),up("miyu","bond",2),up("sarina","energy",-3),up("miyu","energy",-3),up("kilua","energy",-3),up("raisa","energy",-3)]}if(t==="flyer"){title="FLYER RESULT";head="一枚ずつ知ってもらう。";c=[upR(12),up("sarina","energy",-7),up("miyu","energy",-7),up("kilua","energy",-7),up("raisa","energy",-7)]}if(t==="vocal"){title="VOCAL RESULT";head="認知は増えない。でも歌は良くなる。";c=[up("sarina","vocal",5),up("miyu","vocal",5),up("kilua","vocal",4),up("raisa","vocal",4)]}if(t==="recovery"){title="RECOVERY";head="休むことも仕事。";c=["sarina","miyu","kilua","raisa"].map(id=>up(id,"energy",8))}save();return{title,head,changes:c}}
function showResult(r,next){$("resultBox").innerHTML=`<div class="resultTag">${r.title}</div><div class="resultTitle">${r.head}</div><div class="resultRows">${r.changes.map(x=>`<div class="resultRow"><span>${x.name}・${metric(x.metric)}</span><span>${x.before}→${x.after}</span><span class="delta ${x.delta<0?"minus":""}">${x.delta>0?"+":""}${x.delta}</span></div>`).join("")}</div><div class="resultHint">タップして続ける</div>`;$("result").classList.add("show");$("result").onclick=()=>{$("result").classList.remove("show");state.node=next;save();render()}}
function renderWeek(){state.weekFinished=true;save();$("weekEnd").innerHTML=`<div class="weekTag">WEEK 1 COMPLETE</div><h2>4人でやるって、難しい。</h2><div class="summary"><div class="sumRow"><span>認知</span><b>${state.startSnapshot.reach}→${state.reach}</b></div></div><div class="days">デビューまで<strong>あと21日</strong></div><button class="weekBtn">WEEK 2へ →</button>`;$("weekEnd").classList.add("show")}
$("statusBtn").onclick=()=>{$("modalBox").innerHTML=`<h2>O-VER-KiLL STATUS</h2>${Object.keys(M).map(id=>{const s=state.members[id];return`<div class="member"><h3 style="color:${M[id].color}">${M[id].name}</h3><div class="vals"><div>🎤 ${s.vocal}</div><div>💃 ${s.dance}</div><div>🤝 ${s.bond}</div><div>❤️ ${s.energy}</div></div></div>`}).join("")}<button class="close" data-close>閉じる</button>`;$("modal").classList.add("show")};$("modal").onclick=e=>{if(e.target.id==="modal"||e.target.matches("[data-close]"))$("modal").classList.remove("show")};
