<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101216">
<title>O-VER-KiLL｜MANAGER'S STORY</title>

<style>
@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800;900&display=swap");

:root{
  --bg:#101216;
  --panel:#191c22;
  --panel2:#22262e;
  --line:#353a44;
  --text:#f4f5ef;
  --muted:#969da8;
  --acid:#d9ff66;
  --green:#65df90;
  --blue:#6fb9ff;
  --red:#ff737f;
  --yellow:#ffdc69;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:"Noto Sans JP",sans-serif;
}

body{
  overscroll-behavior:none;
}

button{
  font:inherit;
  color:inherit;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

button:disabled{
  opacity:.35;
  cursor:not-allowed;
}

.app{
  width:min(100%,900px);
  min-height:100dvh;
  margin:auto;
  padding:
    max(14px,env(safe-area-inset-top))
    16px
    max(16px,env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
}

.header{
  height:67px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--line);
  flex:none;
}

.logo{
  font-size:23px;
  font-weight:900;
  font-style:italic;
  letter-spacing:-1px;
  line-height:1;
}

.logo span{
  display:block;
  margin-top:8px;
  font-size:9px;
  letter-spacing:3px;
  font-style:normal;
  color:var(--muted);
}

.help{
  width:42px;
  height:42px;
  border:1px solid var(--line);
  border-radius:50%;
  background:transparent;
  font-weight:800;
  font-size:19px;
}

.game{
  flex:1;
  display:flex;
  flex-direction:column;
  min-height:0;
}

.hud{
  margin-top:12px;
  padding:12px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:9px;
}

.hudtop{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:9px;
}

.week{
  font-size:11px;
  font-weight:800;
  letter-spacing:1.3px;
  color:var(--acid);
}

.cash{
  text-align:right;
  font-size:12px;
  color:var(--muted);
}

.cash strong{
  color:white;
  font-size:14px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px 10px;
}

.stat label{
  display:flex;
  justify-content:space-between;
  gap:5px;
  font-size:10px;
  color:var(--muted);
}

.stat label strong{
  color:white;
}

.bar{
  height:4px;
  margin-top:5px;
  background:#303640;
  border-radius:99px;
  overflow:hidden;
}

.fill{
  height:100%;
  width:0;
  background:var(--acid);
  border-radius:99px;
  transition:width 1s cubic-bezier(.2,.8,.2,1);
}

.stage{
  flex:1;
  min-height:0;
  margin-top:12px;
  border:1px solid var(--line);
  border-radius:10px;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 25%,#373b45 0,#21242a 38%,#121419 75%);
  display:flex;
  flex-direction:column;
}

.stageTop{
  padding:13px 15px 8px;
  display:flex;
  justify-content:space-between;
  font-size:10px;
  letter-spacing:1px;
  color:var(--muted);
}

.stageTop b{
  color:var(--acid);
}

.characters{
  flex:1;
  min-height:160px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding:10px 8px 0;
  gap:5px;
}

.character{
  width:24%;
  max-width:130px;
  height:165px;
  position:relative;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  opacity:.48;
  transform:scale(.92);
  transition:.25s;
}

.character.active{
  opacity:1;
  transform:scale(1);
}

.person{
  width:78px;
  height:128px;
  border-radius:44px 44px 15px 15px;
  background:
    radial-gradient(circle at 50% 22%,#eee 0 20%,transparent 21%),
    linear-gradient(180deg,var(--member) 0 55%,#111 56% 100%);
  border:1px solid #ffffff33;
  position:relative;
}

.person:before{
  content:"";
  position:absolute;
  width:60px;
  height:60px;
  left:8px;
  top:-3px;
  border-radius:50%;
  background:#111;
  clip-path:polygon(8% 0,92% 0,100% 65%,80% 100%,20% 100%,0 65%);
}

.name{
  position:absolute;
  bottom:5px;
  left:50%;
  transform:translateX(-50%);
  font-size:10px;
  font-weight:900;
  background:#111c;
  padding:3px 6px;
  border-top:2px solid var(--member);
  white-space:nowrap;
}

.dialogue{
  background:#f1f2eb;
  color:#171a20;
  margin:0 10px 10px;
  padding:14px 15px;
  border-radius:8px;
  box-shadow:0 5px 18px #0007;
  min-height:107px;
}

.speaker{
  font-size:10px;
  letter-spacing:1.5px;
  font-weight:900;
  margin-bottom:5px;
}

.dialogueText{
  white-space:pre-line;
  font-size:14px;
  line-height:1.75;
  font-weight:500;
}

.controls{
  padding:0 10px 10px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.choice{
  width:100%;
  border:1px solid #434954;
  background:#20242b;
  border-radius:7px;
  padding:11px;
  text-align:left;
}

.choice:active{
  background:#2b3039;
}

.choice strong{
  display:block;
  font-size:13px;
}

.choice small{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
  line-height:1.45;
}

.primary{
  width:100%;
  min-height:48px;
  background:var(--acid);
  color:#151a0c;
  border:none;
  border-radius:7px;
  padding:12px;
  font-weight:900;
}

.secondary{
  width:100%;
  min-height:44px;
  border:1px solid var(--line);
  background:#1a1e24;
  border-radius:7px;
  padding:10px;
  font-weight:700;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:7px;
}

.plan{
  display:flex;
  gap:5px;
  margin-bottom:8px;
}

.slot{
  flex:1;
  height:4px;
  background:#343a44;
  border-radius:5px;
}

.slot.done{
  background:var(--acid);
}

.feedback{
  position:fixed;
  top:calc(env(safe-area-inset-top) + 75px);
  left:50%;
  transform:translate(-50%,-15px);
  background:#d9ff66;
  color:#12160b;
  border-radius:99px;
  padding:8px 14px;
  font-size:11px;
  font-weight:900;
  opacity:0;
  pointer-events:none;
  z-index:20;
  transition:.22s;
  box-shadow:0 8px 25px #0008;
}

.feedback.show{
  opacity:1;
  transform:translate(-50%,0);
}

.modal{
  position:fixed;
  inset:0;
  background:#05070bd9;
  backdrop-filter:blur(8px);
  z-index:50;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modalBox{
  width:min(100%,430px);
  max-height:82dvh;
  overflow:auto;
  background:#1d2128;
  border:1px solid #555d69;
  border-radius:12px;
  padding:20px;
}

.modalBox h2{
  margin:0 0 12px;
  font-size:19px;
}

.modalBox p,.modalBox li{
  color:#cad0d8;
  font-size:13px;
  line-height:1.8;
}

.goods{
  display:grid;
  gap:7px;
}

.good{
  border:1px solid var(--line);
  background:#20242b;
  border-radius:7px;
  padding:10px;
}

.goodTop{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.good strong{
  font-size:13px;
}

.good small{
  display:block;
  color:var(--muted);
  font-size:10px;
}

.qty{
  display:flex;
  gap:7px;
  align-items:center;
  margin-top:7px;
}

.qty button{
  width:34px;
  height:34px;
  border:1px solid #4b525e;
  background:#2a2f38;
  border-radius:5px;
}

.qty span{
  min-width:45px;
  text-align:center;
}

.result{
  text-align:center;
  padding:15px 0;
}

.resultNumber{
  font-size:52px;
  font-weight:900;
  letter-spacing:-3px;
}

.resultNumber small{
  font-size:14px;
  letter-spacing:0;
  color:var(--muted);
}

.footer{
  flex:none;
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding-top:10px;
  font-size:10px;
  color:#737b86;
}

.footer button{
  border:none;
  background:none;
  color:#737b86;
  text-decoration:underline;
  padding:0;
}

@media(max-height:680px){
  .character{height:125px}
  .person{height:105px}
  .characters{min-height:125px}
  .dialogue{min-height:85px}
}

@media(min-width:700px){
  .characters{min-height:260px}
  .character{height:250px}
  .person{width:110px;height:200px}
  .person:before{width:85px;height:85px;left:12px}
}
</style>
</head>

<body>

<div class="app">

<header class="header">
  <div class="logo">
    O-VER-KiLL
    <span>MANAGER'S STORY</span>
  </div>
  <button class="help" id="help">?</button>
</header>

<main class="game">

  <section class="hud">
    <div class="hudtop">
      <div class="week" id="weekLabel">WEEK 1 / 04</div>
      <div class="cash">
        活動資金
        <strong id="cash">¥220,000</strong>
      </div>
    </div>

    <div class="stats" id="stats"></div>
  </section>

  <section class="stage">

    <div class="stageTop">
      <b id="stageLabel">FIRST MEETING</b>
      <span id="progressLabel">1 / 6</span>
    </div>

    <div class="characters" id="characters"></div>

    <div class="dialogue">
      <div class="speaker" id="speaker">MANAGER</div>
      <div class="dialogueText" id="dialogue"></div>
    </div>

    <div class="controls" id="controls"></div>

  </section>

</main>

<footer class="footer">
  <span>非公式ファンゲーム・体験版</span>
  <button id="reset">最初から</button>
</footer>

</div>

<div class="feedback" id="feedback"></div>

<div class="modal" id="modal">
  <div class="modalBox" id="modalBox"></div>
</div>

<script>
const MEMBERS = [
  {name:"SARiNA",color:"#65df90"},
  {name:"MiYU",color:"#6fb9ff"},
  {name:"KiLUA",color:"#ff737f"},
  {name:"RAiSA",color:"#ffdc69"}
];

const ACTIONS = {
  vocal:{
    name:"ボーカル練習",
    desc:"歌唱力を伸ばす",
    cost:6000,
    effect:{vocal:8,energy:-8,bond:1},
    reaction:["SARiNA","もっと歌えるようになりたい。\n次のライブでは、ちゃんと届かせたい。"]
  },
  dance:{
    name:"ダンス練習",
    desc:"パフォーマンスを鍛える",
    cost:6000,
    effect:{dance:8,energy:-9,bond:1},
    reaction:["KiLUA","もっと動ける。\nまだまだこんなもんじゃないよ！"]
  },
  sns:{
    name:"SNS告知",
    desc:"グループを知ってもらう",
    cost:2000,
    effect:{reach:9,energy:-3},
    reaction:["MiYU","反応ちょっと増えてる！\n少しずつ見つかってきてるかも。"]
  },
  flyer:{
    name:"フライヤー配布",
    desc:"直接ライブを知らせる",
    cost:8000,
    effect:{reach:12,energy:-7,bond:1},
    reaction:["RAiSA","受け取ってくれた人、ライブ来てくれるかな。\nちゃんと覚えてもらいたいね。"]
  },
  meeting:{
    name:"作戦会議",
    desc:"４人の連携を深める",
    cost:1500,
    effect:{bond:8,energy:-2},
    reaction:["SARiNA","４人で同じ方向を見ていこう。\nまだ始まったばかりだから。"]
  },
  rest:{
    name:"休養",
    desc:"体力を回復する",
    cost:0,
    effect:{energy:18},
    reaction:["MiYU","休むのも活動のうち！\nまた明日から頑張ろ。"]
  }
};

const EVENTS = {
  2:{
    text:"ライブハウスから、急きょ出演枠が空いたと連絡が来た。\n本番経験を積めるチャンス。でも準備時間は少ない。",
    choices:[
      {
        label:"出演する",
        hint:"認知＋ / 体力−",
        effect:{reach:8,bond:3,energy:-10},
        result:"急きょステージへ。完璧ではなかったけど、初めて４人を知った人もいた。"
      },
      {
        label:"今回は見送る",
        hint:"体力を温存",
        effect:{energy:5},
        result:"今回は準備を優先した。焦らずデビューライブに照準を合わせる。"
      }
    ]
  },
  3:{
    text:"SNSで投稿が少し伸び始めた。\nこの流れをどう使う？",
    choices:[
      {
        label:"追加で告知する",
        hint:"認知＋ / 費用−",
        effect:{reach:10,cash:-5000,energy:-3},
        result:"勢いに合わせて告知を追加。少しずつ名前が広がっていった。"
      },
      {
        label:"自然に任せる",
        hint:"連携＋",
        effect:{bond:3},
        result:"無理に追わず、次の活動を整えることにした。"
      }
    ]
  }
};

const GOODS = {
  tee:{
    name:"O-VER-KiLL Tシャツ",
    cost:1300,
    price:3000
  },
  base:{
    name:"ベースボールシャツ",
    cost:2300,
    price:5000
  }
};

const INTRO = [
  ["MANAGER","2,000名が応募したオーディション。\nその中から、４人が選ばれた。"],
  ["SARiNA","SARiNAです。\nまだ何も始まってないけど、絶対ここから大きくしたい。"],
  ["MiYU","MiYUです！\n４人なら、なんか面白いことできそうじゃない？"],
  ["KiLUA","KiLUA。\nやるなら中途半端は嫌。ちゃんと上まで行きたい。"],
  ["RAiSA","RAiSAです。\nまだ知られてないなら、これから知ってもらえばいいよね。"],
  ["MANAGER","デビューライブまで、あと４週間。\nあなたは今日から、この４人のマネージャーだ。"]
];

const STAT_NAMES = {
  vocal:"歌唱",
  dance:"ダンス",
  reach:"認知",
  bond:"連携",
  energy:"体力"
};

const STORAGE_KEY = "overkill_debut_v4";

function freshState(){
  return {
    phase:"intro",
    intro:0,
    week:1,
    cash:220000,
    stats:{
      vocal:35,
      dance:32,
      reach:10,
      bond:45,
      energy:85
    },
    plan:[],
    events:{},
    draft:{tee:0,base:0},
    ordered:{tee:0,base:0},
    stock:{tee:0,base:0},
    pending:[],
    setlist:"balanced",
    result:null
  };
}

function load(){
  try{
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
    return data ? {...freshState(),...data} : freshState();
  }catch(e){
    return freshState();
  }
}

let state = load();

const $ = id => document.getElementById(id);

const characters = $("characters");
const controls = $("controls");
const dialogue = $("dialogue");
const speaker = $("speaker");
const stageLabel = $("stageLabel");
const progressLabel = $("progressLabel");
const feedback = $("feedback");

function yen(n){
  return "¥"+Math.round(n).toLocaleString("ja-JP");
}

function save(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
}

function clamp(v,min=0,max=100){
  return Math.max(min,Math.min(max,v));
}

function applyEffect(effect){
  for(const [key,value] of Object.entries(effect)){
    if(key==="cash"){
      state.cash = Math.max(0,state.cash+value);
    }else{
      state.stats[key] = clamp(state.stats[key]+value);
    }
  }
}

function activeIndex(name){
  return MEMBERS.findIndex(m=>m.name===name);
}

function renderCharacters(active){
  const i = activeIndex(active);

  characters.innerHTML = MEMBERS.map((m,index)=>`
    <div class="character ${index===i?"active":""}" style="--member:${m.color}">
      <div class="person"></div>
      <div class="name">${m.name}</div>
    </div>
  `).join("");
}

function renderHud(animate=true){
  $("weekLabel").textContent =
    state.phase==="result"
    ? "DEBUT REPORT"
    : state.phase==="live"
    ? "DEBUT LIVE"
    : `WEEK ${state.week} / 04`;

  $("cash").textContent = yen(state.cash);

  $("stats").innerHTML = Object.entries(STAT_NAMES).map(([key,name])=>`
    <div class="stat">
      <label>
        <span>${name}</span>
        <strong>${state.stats[key]}</strong>
      </label>
      <div class="bar">
        <div class="fill"
             id="bar-${key}"
             style="background:${key==="energy"?"#fff":""};width:${animate?0:state.stats[key]}%">
        </div>
      </div>
    </div>
  `).join("");

  requestAnimationFrame(()=>{
    for(const key of Object.keys(STAT_NAMES)){
      const el = $("bar-"+key);
      if(el) el.style.width=state.stats[key]+"%";
    }
  });
}

function setScene(name,text,label,progress=""){
  speaker.textContent=name;
  dialogue.textContent=text;
  stageLabel.textContent=label;
  progressLabel.textContent=progress;
  renderCharacters(name);
}

function button(text,action,extra=""){
  return `<button class="primary" data-action="${action}" ${extra}>${text}</button>`;
}

function secondary(text,action,extra=""){
  return `<button class="secondary" data-action="${action}" ${extra}>${text}</button>`;
}

function showFeedback(text){
  feedback.textContent=text;
  feedback.classList.add("show");
  clearTimeout(showFeedback.timer);
  showFeedback.timer=setTimeout(()=>{
    feedback.classList.remove("show");
  },1300);
}

function pendingEvent(){
  return EVENTS[state.week] && !state.events[state.week] && state.plan.length===0;
}

function deliverGoods(){
  const delivered = state.pending.filter(p=>p.week<=state.week);

  for(const item of delivered){
    state.stock[item.id]+=item.qty;
  }

  state.pending=state.pending.filter(p=>p.week>state.week);
}

function renderIntro(){
  const [name,text]=INTRO[state.intro];

  setScene(
    name,
    text,
    "FIRST MEETING",
    `${state.intro+1} / ${INTRO.length}`
  );

  controls.innerHTML=`
    <div class="row">
      ${secondary("‹ 戻る","introBack",state.intro===0?"disabled":"")}
      ${button(
        state.intro===INTRO.length-1 ? "物語を始める →" : "次へ →",
        "introNext"
      )}
    </div>
  `;
}

function renderEvent(){
  const event=EVENTS[state.week];

  setScene(
    MEMBERS[(state.week-1)%4].name,
    event.text,
    "SPECIAL EVENT",
    `WEEK ${state.week}`
  );

  controls.innerHTML=`
    <div class="actions">
      ${event.choices.map((c,i)=>`
        <button class="choice" data-action="event" data-index="${i}">
          <strong>${c.label}</strong>
          <small>${c.hint}</small>
        </button>
      `).join("")}
    </div>
  `;
}

function renderPlanning(){
  if(pendingEvent()){
    renderEvent();
    return;
  }

  const member=MEMBERS[state.plan.length%4];

  let text="今日は、何から始めましょう？";

  if(state.plan.length===1){
    text="ひとつ終わったね。\n次はどうする？";
  }

  if(state.plan.length===2){
    text="今週はあとひとつ。\n最後は何を選ぶ？";
  }

  if(state.plan.length===3){
    setScene(
      "SARiNA",
      "今週も、おつかれさま！\nこの積み重ねが、きっと本番につながる。",
      `WEEK ${state.week}`,
      "3 / 3"
    );

    controls.innerHTML=`
      <div class="plan">
        <span class="slot done"></span>
        <span class="slot done"></span>
        <span class="slot done"></span>
      </div>

      ${button(
        state.week===4
          ? "デビューライブ当日へ →"
          : "次の１週間へ →",
        "advance"
      )}

      <div class="row">
        ${secondary("グッズ","goods")}
        ${secondary("ステータス","stats")}
      </div>
    `;

    return;
  }

  setScene(
    member.name,
    text,
    `WEEK ${state.week}`,
    `行動 ${state.plan.length+1} / 3`
  );

  controls.innerHTML=`
    <div class="plan">
      ${[0,1,2].map(i=>`
        <span class="slot ${i<state.plan.length?"done":""}"></span>
      `).join("")}
    </div>

    <div class="actions">
      ${Object.entries(ACTIONS).map(([id,a])=>`
        <button
          class="choice"
          data-action="activity"
          data-id="${id}"
          ${state.cash<a.cost?"disabled":""}
        >
          <strong>${a.name}</strong>
          <small>
            ${a.desc}
            ${a.cost ? "・"+yen(a.cost) : "・費用なし"}
          </small>
        </button>
      `).join("")}
    </div>

    <div class="row">
      ${secondary("グッズ","goods")}
      ${secondary("ステータス","stats")}
    </div>
  `;
}

function renderLiveReady(){
  setScene(
    "SARiNA",
    "いよいよデビューライブ。\n今日のステージ、何を一番大切にする？",
    "DEBUT DAY",
    ""
  );

  controls.innerHTML=`
    <div class="actions">
      <button class="choice" data-action="setlist" data-id="balanced">
        <strong>４人の総合力</strong>
        <small>歌・ダンス・連携をバランスよく</small>
      </button>

      <button class="choice" data-action="setlist" data-id="vocal">
        <strong>歌で届ける</strong>
        <small>歌唱力を活かしたステージ</small>
      </button>

      <button class="choice" data-action="setlist" data-id="dance">
        <strong>勢いで巻き込む</strong>
        <small>ダンスと熱量で会場を動かす</small>
      </button>
    </div>

    <div style="height:7px"></div>

    ${button("デビューライブ開演 →","startLive")}
  `;
}

function calculateResult(){
  const s=state.stats;

  let performance=
    s.vocal*.3+
    s.dance*.3+
    s.bond*.25+
    s.energy*.15;

  if(state.setlist==="vocal"){
    performance+=s.vocal*.08;
  }

  if(state.setlist==="dance"){
    performance+=s.dance*.08;
  }

  performance=Math.round(clamp(performance));

  const attendance=Math.max(
    20,
    Math.round(18+s.reach*1.65+s.bond*.35)
  );

  const fans=Math.max(
    4,
    Math.round(attendance*(performance/100)*.62)
  );

  const ticketIncome=attendance*2000;

  let teeSold=Math.min(
    state.stock.tee,
    Math.round(attendance*.18)
  );

  let baseSold=Math.min(
    state.stock.base,
    Math.round(attendance*.09)
  );

  const merchIncome=
    teeSold*GOODS.tee.price+
    baseSold*GOODS.base.price;

  state.stock.tee-=teeSold;
  state.stock.base-=baseSold;
  state.cash+=ticketIncome+merchIncome;

  state.result={
    performance,
    attendance,
    fans,
    teeSold,
    baseSold,
    ticketIncome,
    merchIncome,
    finalCash:state.cash
  };
}

function renderLive(){
  setScene(
    "SARiNA",
    "始まるよ。\n４人で、この景色を変えよう。",
    "ON STAGE",
    ""
  );

  controls.innerHTML=`
    <div class="result">
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px">
        DEBUT LIVE
      </div>
      <div style="font-size:35px;font-weight:900">
        O-VER-KiLL
      </div>
    </div>

    ${button("ライブ結果を見る →","finish")}
  `;
}

function renderResult(){
  const r=state.result;

  setScene(
    "SARiNA",
    r.performance>=75
      ? "初めてのライブ、ちゃんと届いた気がする。\nここからもっと大きくなろう。"
      : "まだまだこれから。\n今日が、私たちの最初の一歩。",
    "DEBUT REPORT",
    ""
  );

  controls.innerHTML=`
    <div class="result">

      <div class="resultNumber">
        ${r.attendance}
        <small>人</small>
      </div>

      <div style="font-size:11px;color:var(--muted)">
        デビューライブ動員
      </div>

    </div>

    <div class="actions">

      <div class="good">
        <strong>ライブ評価</strong>
        <small>${r.performance} / 100</small>
      </div>

      <div class="good">
        <strong>また来たい</strong>
        <small>${r.fans}人</small>
      </div>

      <div class="good">
        <strong>チケット売上</strong>
        <small>${yen(r.ticketIncome)}</small>
      </div>

      <div class="good">
        <strong>グッズ売上</strong>
        <small>${yen(r.merchIncome)}</small>
      </div>

    </div>

    <div style="height:8px"></div>

    ${button("もう一度はじめる","restart")}
  `;
}

function render(){
  renderHud();

  if(state.phase==="intro"){
    renderIntro();
  }

  if(state.phase==="planning"){
    renderPlanning();
  }

  if(state.phase==="liveReady"){
    renderLiveReady();
  }

  if(state.phase==="live"){
    renderLive();
  }

  if(state.phase==="result"){
    renderResult();
  }
}

function doActivity(id){
  const action=ACTIONS[id];

  if(!action)return;
  if(state.plan.length>=3)return;
  if(state.cash<action.cost)return;

  state.cash-=action.cost;

  const effect={...action.effect};

  if(state.stats.energy<30){
    if(effect.vocal>0){
      effect.vocal=Math.floor(effect.vocal/2);
    }

    if(effect.dance>0){
      effect.dance=Math.floor(effect.dance/2);
    }
  }

  applyEffect(effect);

  state.plan.push(id);

  save();
  renderHud();

  showFeedback(
    action.cost
      ? `${action.name}　−${yen(action.cost)}`
      : action.name
  );

  const [name,text]=action.reaction;

  setScene(
    name,
    text,
    `WEEK ${state.week}`,
    `${state.plan.length} / 3`
  );

  controls.innerHTML=`
    ${button("次へ →","continue")}
  `;
}

function openGoods(){
  const total=
    state.draft.tee*GOODS.tee.cost+
    state.draft.base*GOODS.base.cost;

  setScene(
    "MiYU",
    "ライブの思い出を、持ち帰れるように。\nグッズも準備しておこう！",
    "MERCH",
    `WEEK ${state.week}`
  );

  controls.innerHTML=`

    <div class="goods">

      ${Object.entries(GOODS).map(([id,g])=>`

        <div class="good">

          <div class="goodTop">
            <div>
              <strong>${g.name}</strong>
              <small>
                制作 ${yen(g.cost)} /
                販売 ${yen(g.price)}
              </small>
            </div>

            <small>
              在庫 ${state.stock[id]}枚
            </small>
          </div>

          <div class="qty">

            <button
              data-action="qty"
              data-id="${id}"
              data-delta="-10"
            >
              −
            </button>

            <span>${state.draft[id]}枚</span>

            <button
              data-action="qty"
              data-id="${id}"
              data-delta="10"
            >
              ＋
            </button>

          </div>

        </div>

      `).join("")}

    </div>

    <div style="height:8px"></div>

    ${button(
      total
        ? `${yen(total)}で発注する`
        : "枚数を選んでください",
      "order",
      total===0 ||
      total>state.cash ||
      state.week>3
        ? "disabled"
        : ""
    )}

    <div style="height:7px"></div>

    ${secondary("戻る","continue")}

  `;
}

function openStats(){
  const modal=$("modal");
  const box=$("modalBox");

  box.innerHTML=`
    <h2>４人の現在地</h2>

    <p>
      WEEK ${state.week} / 04<br>
      活動資金：${yen(state.cash)}
    </p>

    <ul>
      <li>歌唱：${state.stats.vocal}</li>
      <li>ダンス：${state.stats.dance}</li>
      <li>認知：${state.stats.reach}</li>
      <li>連携：${state.stats.bond}</li>
      <li>体力：${state.stats.energy}</li>
    </ul>

    <button class="primary" data-modal-close>
      閉じる
    </button>
  `;

  modal.classList.add("show");
}

function openHelp(){
  const modal=$("modal");
  const box=$("modalBox");

  box.innerHTML=`
    <h2>遊び方</h2>

    <p>
      あなたはO-VER-KiLLのマネージャー。
      デビューライブまでの４週間、
      毎週３つの行動を選びます。
    </p>

    <p>
      行動すると、その場で歌唱・ダンス・認知・連携・体力・活動資金が変化します。
    </p>

    <p>
      体力が30未満になると、
      ボーカル・ダンス練習の効果が半分になります。
    </p>

    <p>
      グッズは発注した翌週に納品。
      発注できるのは３週目までです。
    </p>

    <p>
      ゲーム進行はこの端末に自動保存されます。
    </p>

    <button class="primary" data-modal-close>
      閉じる
    </button>
  `;

  modal.classList.add("show");
}

document.addEventListener("click",e=>{

  if(e.target.matches("[data-modal-close]")){
    $("modal").classList.remove("show");
    return;
  }

  const btn=e.target.closest("[data-action]");

  if(!btn || btn.disabled)return;

  const action=btn.dataset.action;

  if(action==="introNext"){

    if(state.intro<INTRO.length-1){
      state.intro++;
    }else{
      state.phase="planning";
    }

    save();
    render();
    return;
  }

  if(action==="introBack"){
    state.intro=Math.max(0,state.intro-1);
    save();
    render();
    return;
  }

  if(action==="activity"){
    doActivity(btn.dataset.id);
    return;
  }

  if(action==="continue"){
    render();
    return;
  }

  if(action==="event"){
    const event=EVENTS[state.week];
    const choice=event.choices[Number(btn.dataset.index)];

    applyEffect(choice.effect);

    state.events[state.week]=choice.result;

    save();

    renderHud();

    showFeedback("あなたの選択が４人に届いた");

    setScene(
      "SARiNA",
      choice.result,
      "EVENT RESULT",
      ""
    );

    controls.innerHTML=button("次へ →","continue");

    return;
  }

  if(action==="advance"){

    state.plan=[];

    if(state.week===4){
      state.phase="liveReady";
    }else{
      state.week++;
      deliverGoods();
    }

    save();
    render();
    return;
  }

  if(action==="stats"){
    openStats();
    return;
  }

  if(action==="goods"){
    openGoods();
    return;
  }

  if(action==="qty"){

    if(state.week>3)return;

    const id=btn.dataset.id;
    const delta=Number(btn.dataset.delta);

    state.draft[id]=clamp(
      state.draft[id]+delta,
      0,
      100
    );

    save();
    openGoods();
    return;
  }

  if(action==="order"){

    const total=
      state.draft.tee*GOODS.tee.cost+
      state.draft.base*GOODS.base.cost;

    if(!total || total>state.cash || state.week>3){
      return;
    }

    state.cash-=total;

    for(const id of Object.keys(GOODS)){

      const qty=state.draft[id];

      if(qty>0){

        state.pending.push({
          id,
          qty,
          week:state.week+1
        });

        state.ordered[id]+=qty;
      }
    }

    state.draft={tee:0,base:0};

    save();

    showFeedback("グッズを発注しました");

    setScene(
      "MiYU",
      "発注完了！\n届くのは来週。ライブで誰かが着てくれたら嬉しいね。",
      "MERCH ORDER",
      ""
    );

    controls.innerHTML=button("次へ →","continue");

    renderHud();

    return;
  }

  if(action==="setlist"){
    state.setlist=btn.dataset.id;

    save();

    showFeedback("ライブ方針を決定");

    state.phase="live";

    save();

    render();

    return;
  }

  if(action==="startLive"){
    state.phase="live";
    save();
    render();
    return;
  }

  if(action==="finish"){

    calculateResult();

    state.phase="result";

    save();
    render();
    return;
  }

  if(action==="restart"){

    if(confirm("最初からやり直しますか？")){
      state=freshState();
      save();
      render();
    }

    return;
  }

});

$("help").onclick=openHelp;

$("modal").addEventListener("click",e=>{
  if(e.target===$("modal")){
    $("modal").classList.remove("show");
  }
});

$("reset").onclick=()=>{
  if(confirm("保存データを消して最初からやり直しますか？")){
    state=freshState();
    save();
    render();
  }
};

render();
</script>

</body>
</html>
