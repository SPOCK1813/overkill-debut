<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101216">

<title>O-VER-KiLL｜MANAGER'S STORY</title>

<style>
@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800;900&display=swap");

:root{
  --bg:#101216;
  --panel:#191c22;
  --line:#353a44;
  --text:#f4f5ef;
  --muted:#969da8;
  --acid:#d9ff66;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:"Noto Sans JP",sans-serif;
}

body{
  overscroll-behavior:none;
}

button{
  font:inherit;
  color:inherit;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

button:disabled{
  opacity:.35;
  cursor:not-allowed;
}

.app{
  width:min(100%,900px);
  min-height:100dvh;
  margin:auto;

  padding:
    max(14px,env(safe-area-inset-top))
    16px
    max(16px,env(safe-area-inset-bottom));

  display:flex;
  flex-direction:column;
}

.header{
  height:67px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  border-bottom:1px solid var(--line);
}

.logo{
  font-size:23px;
  font-weight:900;
  font-style:italic;
  letter-spacing:-1px;
}

.logo span{
  display:block;

  margin-top:7px;

  color:var(--muted);

  font-size:9px;
  font-style:normal;
  letter-spacing:3px;
}

.help{
  width:42px;
  height:42px;

  border:1px solid var(--line);
  border-radius:50%;

  background:none;

  font-size:19px;
  font-weight:800;
}

.game{
  flex:1;

  display:flex;
  flex-direction:column;
}

.hud{
  margin-top:12px;
  padding:12px;

  background:var(--panel);

  border:1px solid var(--line);
  border-radius:10px;
}

.hudTop{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin-bottom:10px;
}

.week{
  color:var(--acid);

  font-size:11px;
  font-weight:900;
  letter-spacing:1.4px;
}

.cash{
  color:var(--muted);

  font-size:12px;
}

.cash strong{
  color:#fff;

  font-size:14px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);

  gap:9px 10px;
}

.stat label{
  display:flex;
  justify-content:space-between;

  color:var(--muted);

  font-size:10px;
}

.stat strong{
  color:#fff;
}

.bar{
  height:4px;

  margin-top:5px;

  overflow:hidden;

  background:#303640;

  border-radius:20px;
}

.fill{
  width:0;
  height:100%;

  background:var(--acid);

  border-radius:20px;

  transition:width .7s ease;
}


/* =========================
   メインステージ
========================= */

.stage{
  flex:1;

  min-height:0;

  margin-top:12px;

  overflow:hidden;

  display:flex;
  flex-direction:column;

  border:1px solid var(--line);
  border-radius:11px;

  background:
    radial-gradient(
      circle at 50% 28%,
      #343a45 0,
      #20242b 39%,
      #111318 78%
    );
}

.stageTop{
  padding:13px 15px 5px;

  display:flex;
  justify-content:space-between;

  color:var(--muted);

  font-size:10px;
  letter-spacing:1px;
}

.stageTop b{
  color:var(--acid);
}


/* =========================
   1人だけ表示
========================= */

.characterStage{
  height:355px;

  position:relative;

  display:flex;
  align-items:flex-end;
  justify-content:center;

  overflow:hidden;
}

.characterStage::after{
  content:"";

  position:absolute;

  left:12%;
  right:12%;
  bottom:-15px;

  height:90px;

  background:
    radial-gradient(
      ellipse,
      rgba(0,0,0,.5),
      transparent 68%
    );

  pointer-events:none;
}

.singleCharacter{
  position:absolute;

  inset:0;

  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.singleCharacter.enter .characterImg{
  animation:characterEnter .35s ease both;
}

@keyframes characterEnter{

  from{
    opacity:0;
    transform:
      translateY(26px)
      scale(.94);
  }

  to{
    opacity:1;
    transform:
      translateY(0)
      scale(1);
  }

}

.characterImg{
  width:82%;
  height:100%;

  object-fit:contain;
  object-position:center bottom;

  display:block;

  filter:
    drop-shadow(
      0 18px 20px
      rgba(0,0,0,.52)
    );
}

.memberBadge{
  position:absolute;

  left:50%;
  bottom:5px;

  z-index:3;

  transform:translateX(-50%);

  padding:5px 12px;

  background:#0d0f13e6;

  border-top:2px solid var(--member);

  border-radius:6px;

  font-size:11px;
  font-weight:900;
  letter-spacing:.5px;
}


/* =========================
   MANAGER時
========================= */

.managerVisual{
  position:absolute;

  inset:0;

  display:none;
  align-items:center;
  justify-content:center;

  text-align:center;
}

.managerVisual.show{
  display:flex;

  animation:managerEnter .35s ease both;
}

.managerLogo{
  margin-top:-30px;

  font-size:36px;
  font-weight:900;
  font-style:italic;
  letter-spacing:-2px;

  opacity:.85;
}

.managerLogo span{
  display:block;

  margin-top:10px;

  color:var(--muted);

  font-size:10px;
  font-style:normal;
  letter-spacing:4px;
}

@keyframes managerEnter{

  from{
    opacity:0;
    transform:scale(.96);
  }

  to{
    opacity:1;
    transform:scale(1);
  }

}


/* =========================
   セリフ
========================= */

.dialogue{
  min-height:120px;

  margin:0 12px 12px;
  padding:15px 16px 17px;

  position:relative;

  background:#f2f2ec;
  color:#16191e;

  border-radius:12px;

  box-shadow:
    0 8px 24px
    rgba(0,0,0,.35);
}

.dialogue::before{
  content:"";

  position:absolute;

  top:-10px;
  left:36px;

  width:20px;
  height:20px;

  background:#f2f2ec;

  transform:rotate(45deg);
}

.speaker{
  position:relative;

  z-index:2;

  margin-bottom:7px;

  font-size:11px;
  font-weight:900;
  letter-spacing:2px;
}

.dialogueText{
  position:relative;

  z-index:2;

  white-space:pre-line;

  font-size:15px;
  font-weight:500;
  line-height:1.75;
}


/* =========================
   操作
========================= */

.controls{
  padding:0 10px 10px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;

  gap:7px;
}

.choice{
  width:100%;

  padding:11px;

  text-align:left;

  border:1px solid #434954;
  border-radius:7px;

  background:#20242b;
}

.choice:active{
  background:#292f38;
}

.choice strong{
  display:block;

  font-size:13px;
}

.choice small{
  display:block;

  margin-top:4px;

  color:var(--muted);

  font-size:10px;
  line-height:1.45;
}

.primary{
  width:100%;

  min-height:48px;

  padding:11px;

  border:none;
  border-radius:7px;

  background:var(--acid);
  color:#12160b;

  font-weight:900;
}

.secondary{
  width:100%;

  min-height:44px;

  border:1px solid var(--line);
  border-radius:7px;

  background:#1a1e24;

  font-weight:700;
}

.row{
  margin-top:7px;

  display:grid;
  grid-template-columns:1fr 1fr;

  gap:7px;
}

.plan{
  margin-bottom:8px;

  display:flex;

  gap:5px;
}

.slot{
  flex:1;

  height:4px;

  background:#343a44;

  border-radius:10px;
}

.slot.done{
  background:var(--acid);
}


/* =========================
   楽曲解放
========================= */

.songUnlock{
  margin-bottom:10px;
  padding:16px;

  text-align:center;

  border:
    1px solid
    rgba(217,255,102,.35);

  border-radius:10px;

  background:
    linear-gradient(
      145deg,
      rgba(217,255,102,.08),
      rgba(255,255,255,.015)
    );

  box-shadow:
    inset 0 0 25px
    rgba(217,255,102,.025);
}

.songNew{
  color:var(--acid);

  font-size:9px;
  font-weight:900;
  letter-spacing:3px;
}

.songTitle{
  margin-top:7px;

  font-size:23px;
  font-weight:900;
  letter-spacing:1px;
}

.songSub{
  margin-top:3px;

  color:var(--muted);

  font-size:10px;
}

.songButton{
  width:100%;

  margin-top:12px;
  padding:11px;

  border:
    1px solid
    rgba(217,255,102,.55);

  border-radius:7px;

  background:#151a13;
  color:var(--acid);

  font-weight:800;
}

.songButton.playing{
  background:var(--acid);
  color:#111;
}


/* =========================
   グッズ等
========================= */

.good{
  padding:10px;

  border:1px solid var(--line);
  border-radius:7px;

  background:#20242b;
}

.good strong{
  display:block;

  font-size:13px;
}

.good small{
  display:block;

  margin-top:3px;

  color:var(--muted);

  font-size:10px;
}

.goods{
  display:grid;

  gap:7px;
}

.goodTop{
  display:flex;
  justify-content:space-between;
}

.qty{
  margin-top:8px;

  display:flex;
  align-items:center;

  gap:8px;
}

.qty button{
  width:36px;
  height:36px;

  border:1px solid #4c535f;
  border-radius:5px;

  background:#2b3038;
}

.qty span{
  min-width:50px;

  text-align:center;
}

.result{
  padding:15px 0;

  text-align:center;
}

.resultNumber{
  font-size:52px;
  font-weight:900;
}

.resultNumber small{
  color:var(--muted);

  font-size:14px;
}


/* =========================
   その他
========================= */

.feedback{
  position:fixed;

  top:80px;
  left:50%;

  z-index:30;

  transform:
    translate(-50%,-10px);

  padding:8px 14px;

  border-radius:999px;

  background:var(--acid);
  color:#111;

  font-size:11px;
  font-weight:900;

  opacity:0;

  pointer-events:none;

  transition:.2s;
}

.feedback.show{
  opacity:1;

  transform:
    translate(-50%,0);
}

.modal{
  position:fixed;

  inset:0;

  z-index:50;

  display:none;
  align-items:center;
  justify-content:center;

  padding:20px;

  background:#05070bdf;

  backdrop-filter:blur(8px);
}

.modal.show{
  display:flex;
}

.modalBox{
  width:min(100%,430px);

  padding:20px;

  border:1px solid #555d69;
  border-radius:12px;

  background:#1d2128;
}

.modalBox h2{
  margin-top:0;
}

.modalBox p,
.modalBox li{
  color:#cad0d8;

  font-size:13px;
  line-height:1.8;
}

.footer{
  display:flex;
  justify-content:space-between;

  padding-top:10px;

  color:#737b86;

  font-size:10px;
}

.footer button{
  padding:0;

  border:none;

  background:none;
  color:#737b86;

  text-decoration:underline;
}


@media(max-height:750px){

  .characterStage{
    height:285px;
  }

}


@media(min-width:700px){

  .characterStage{
    height:520px;
  }

  .characterImg{
    width:65%;
  }

}
</style>
</head>


<body>


<div class="app">


<header class="header">

  <div class="logo">

    O-VER-KiLL

    <span>
      MANAGER'S STORY
    </span>

  </div>

  <button
    class="help"
    id="help"
  >
    ?
  </button>

</header>


<main class="game">


<section class="hud">

  <div class="hudTop">

    <div

</main>

</div>


<div

</div>


<div

  <div
    class="modalBox"
    id="modalBox"
  >
  </div>

</div>


<audio
  id="songAudio"
  src="./akunaki-kodou.mp3"

>
</audio>

/* ========================================
   共通
======================================== */

function yen(n){

  return "¥" +
    Math.round(n)
      .toLocaleString("ja-JP");

}


function clamp(
  value,
  min=0,
  max=100
){

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );

}


function applyEffect(effect){

  for(
    const [key,value]
    of Object.entries(effect)
  ){

    if(key==="cash"){

      state.cash =
        Math.max(
          0,
          state.cash + value
        );

    }

    else{

      state.stats[key] =
        clamp(
          state.stats[key]
          +
          value
        );

    }

  }

}

  managerVisual

    member.name;


  memberBadge.style.setProperty(
    "--member",

function doActivity(id){

  const action =
    ACTIONS[id];


  if(!action){
    return;
  }


  if(
    state.plan.length>=3
  ){
    return;
  }


  if(
    state.cash<action.cost
  ){
    return;
  }


  state.cash -=
    action.cost;


  const effect = {
    ...action.effect
  };


  if(
    state.stats.energy<30
  ){

    if(
      effect.vocal>0
    ){

      effect.vocal =
        Math.floor(
          effect.vocal/2
        );

    }


    if(
      effect.dance>0
    ){

      effect.dance =
        Math.floor(
          effect.dance/2
        );

    }

  }


  applyEffect(
    effect
  );


  state.plan.push(
    id
  );


  save();

  renderHud();


  showFeedback(

    action.cost

      ? `${action.name} −${yen(action.cost)}`

      : action.name

  );


  setScene(

    action.reaction.member,

    action.reaction.text,

    `WEEK ${state.week}`,

    `${state.plan.length} / 3`,

    action.reaction.expression

  );


  controls.innerHTML =
    primary(
      "次へ →",
      "continue"
    );

}

function calculateResult(){

  const stats =
    state.stats;


  let performance =

    stats.vocal*.3

    +

    stats.dance*.3

    +

    stats.bond*.25

    +

    stats.energy*.15;


  if(
    state.setlist==="vocal"
  ){

    performance +=
      stats.vocal*.08;

  }


  if(
    state.setlist==="dance"
  ){

    performance +=
      stats.dance*.08;

  }


  performance =
    Math.round(
      clamp(performance)
    );


  const attendance =
    Math.max(

      20,

      Math.round(

        18

        +

        stats.reach*1.65

        +

        stats.bond*.35

      )

    );


  const fans =
    Math.max(

      4,

      Math.round(

        attendance

        *

        (
          performance/100
        )

        *

        .62

      )

    );


  const ticketIncome =
    attendance*2000;


  const teeSold =
    Math.min(

      state.stock.tee,

      Math.round(
        attendance*.18
      )

    );


  const baseSold =
    Math.min(

      state.stock.base,

      Math.round(
        attendance*.09
      )

    );


  const merchIncome =

    teeSold
    *
    GOODS.tee.price

    +

    baseSold
    *
    GOODS.base.price;


  state.stock.tee -=
    teeSold;


  state.stock.base -=
    baseSold;


  state.cash +=
    ticketIncome
    +
    merchIncome;


  state.result = {

    performance,

    attendance,

    fans,

    teeSold,

    baseSold,

    ticketIncome,

    merchIncome

  };

}

function toggleSong(){

  const button =
    $("songButton");


  if(
    !songAudio.paused
  ){

    songAudio.pause();


    if(button){

      button.textContent =
        "▶ サビを聴く";


      button
        .classList
        .remove("playing");

    }


    return;

  }


  songAudio.currentTime =
    SONG_CHORUS_START;


  songAudio.play()
    .then(()=>{

      if(button){

        button.textContent =
          "■ 停止";


        button
          .classList
          .add("playing");

      }

    })
    .catch(()=>{

      showFeedback(
        "再生できませんでした"
      );

    });

}


songAudio
  .addEventListener(
    "timeupdate",
    ()=>{

      if(
        songAudio.currentTime
        >=
        SONG_CHORUS_END
      ){

        songAudio.pause();


        songAudio.currentTime =
          SONG_CHORUS_START;


        const button =
          $("songButton");


        if(button){

          button.textContent =
            "▶ もう一度聴く";


          button
            .classList
            .remove("playing");

        }

      }

    }
  );


/* ========================================
   CLICK
======================================== */

document
  .addEventListener(
    "click",
    event=>{


      if(
        event.target.matches(
          "[data-modal-close]"
        )
      ){

        $("modal")
          .classList
          .remove("show");

        return;

      }


      const button =
        event.target.closest(
          "[data-action]"
        );


      if(
        !button
        ||
        button.disabled
      ){

        return;

      }


      const action =
        button.dataset.action;


      if(
        action==="introNext"
      ){

        if(
          state.intro
          <
          INTRO.length-1
        ){

          state.intro++;

        }

        else{

          state.phase =
            "planning";

        }


        save();

        render();

        return;

      }


      if(
        action==="introBack"
      ){

        state.intro =
          Math.max(
            0,
            state.intro-1
          );


        save();

        render();

        return;

      }


      if(
        action==="activity"
      ){

        doActivity(
          button.dataset.id
        );

        return;

      }


      if(
        action==="continue"
      ){

        render();

        return;

      }


      if(
        action==="event"
      ){

        const currentEvent =
          EVENTS[state.week];


        const choice =
          currentEvent
            .choices[
              Number(
                button.dataset.index
              )
            ];


        applyEffect(
          choice.effect
        );


        state.events[state.week] =
          true;


        save();

        renderHud();


        showFeedback(
          "あなたの選択が４人に届いた"
        );


        setScene(

          choice.result.member,

          choice.result.text,

          "EVENT RESULT",

          "",

          choice.result.expression

        );


        controls.innerHTML =
          primary(
            "次へ →",
            "continue"
          );


        return;

      }


      if(
        action==="advance"
      ){

        state.plan = [];


        if(
          state.week===4
        ){

          state.phase =
            "liveReady";

        }

        else{

          state.week++;

          deliverGoods();

        }


        save();

        render();

        return;

      }


      if(
        action==="goods"
      ){

        openGoods();

        return;

      }


      if(
        action==="stats"
      ){

        openStats();

        return;

      }


      if(
        action==="qty"
      ){

        if(
          state.week>3
        ){

          return;

        }


        const id =
          button.dataset.id;


        const delta =
          Number(
            button.dataset.delta
          );


        state.draft[id] =
          clamp(

            state.draft[id]
            +
            delta,

            0,

            100

          );


        save();

        openGoods();

        return;

      }


      if(
        action==="order"
      ){

        const total =

          state.draft.tee
          *
          GOODS.tee.cost

          +

          state.draft.base
          *
          GOODS.base.cost;


        if(
          !total

          ||

          total>state.cash

          ||

          state.week>3
        ){

          return;

        }


        state.cash -=
          total;


        for(
          const id
          of Object.keys(GOODS)
        ){

          const qty =
            state.draft[id];


          if(qty>0){

            state.pending.push({

              id,

              qty,

              week:
                state.week+1

            });


            state.ordered[id] +=
              qty;

          }

        }


        state.draft = {
          tee:0,
          base:0
        };


        save();

        renderHud();


        showFeedback(
          "グッズを発注しました"
        );


        setScene(

          "MiYU",

`発注完了！

届くのは来週。

ライブで誰かが
着てくれたら嬉しいね。`,

          "MERCH ORDER",

          "",

          "smile"

        );


        controls.innerHTML =
          primary(
            "次へ →",
            "continue"
          );


        return;

      }


      if(
        action==="song"
      ){

        toggleSong();

        return;

      }


      if(
        action==="setlist"
      ){

        stopSong();


        state.setlist =
          button.dataset.id;


        state.phase =
          "live";


        save();

        render();

        return;

      }


      if(
        action==="finish"
      ){

        calculateResult();


        state.phase =
          "result";


        save();

        render();

        return;

      }


      if(
        action==="restart"
      ){

        if(
          confirm(
            "最初からやり直しますか？"
          )
        ){

          stopSong();


          state =
            freshState();


          save();

          render();

        }


        return;

      }

    }
  );


/* ========================================
   HELP / RESET
======================================== */

$("help")
  .addEventListener(
    "click",
    openHelp
  );


$("modal")
  .addEventListener(
    "click",
    event=>{

      if(
        event.target
        ===
        $("modal")
      ){

        $("modal")
          .classList
          .remove("show");

      }

    }
  );


$("reset")
  .addEventListener(
    "click",
    ()=>{

      if(
        confirm(
          "保存データを消して最初からやり直しますか？"
        )
      ){

        stopSong();


        state =
          freshState();


        save();

        render();

      }

    }
  );


render();

</script>

</body>
</html>
