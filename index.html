<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111118">

<title>O-VER-KiLL｜MANAGER'S STORY</title>

<style>
@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap");

:root{
  --bg:#111118;
  --panel:#1c1b25;
  --text:#fff;
  --muted:#aaa6b4;
  --line:#393744;
  --acid:#ddff63;
  --pink:#ff8ba2;
  --blue:#72bdff;
  --green:#69e09a;
  --yellow:#ffdc69;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#101017;
  color:var(--text);
  font-family:"Noto Sans JP",sans-serif;
  -webkit-user-select:none;
  user-select:none;
}

button{
  font:inherit;
  -webkit-tap-highlight-color:transparent;
}

.screen{
  position:fixed;
  inset:0;
  display:none;
}

.screen.active{
  display:flex;
}


/* =========================================================
   LOADING
========================================================= */

#loadingScreen{
  z-index:100;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;

  background:
    radial-gradient(circle at 50% 20%,rgba(221,255,99,.18),transparent 34%),
    radial-gradient(circle at 15% 75%,rgba(112,189,255,.18),transparent 30%),
    radial-gradient(circle at 85% 72%,rgba(255,139,162,.16),transparent 30%),
    linear-gradient(160deg,#252233,#111118);
}

.loadingStars{
  position:absolute;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}

.loadingStars span{
  position:absolute;
  font-size:28px;
  opacity:.7;
  animation:floatStar 2.6s ease-in-out infinite;
}

.loadingStars span:nth-child(1){
  top:9%;
  left:12%;
}

.loadingStars span:nth-child(2){
  top:18%;
  right:14%;
  animation-delay:.4s;
}

.loadingStars span:nth-child(3){
  bottom:19%;
  left:16%;
  animation-delay:.8s;
}

.loadingStars span:nth-child(4){
  bottom:12%;
  right:11%;
  animation-delay:1.2s;
}

@keyframes floatStar{
  0%,100%{
    transform:translateY(0) rotate(-7deg);
  }
  50%{
    transform:translateY(-12px) rotate(7deg);
  }
}

.loadingLogo{
  text-align:center;
  font-weight:900;
  font-style:italic;
  font-size:31px;
  letter-spacing:-2px;
  z-index:2;
}

.loadingLogo small{
  display:block;
  margin-top:9px;
  color:#b1adbb;
  font-size:9px;
  font-style:normal;
  letter-spacing:4px;
}

.loadingCharacterWrap{
  position:relative;
  width:230px;
  height:270px;
  margin-top:16px;
}

.loadingCharacter{
  width:100%;
  height:100%;
  object-fit:contain;
  filter:drop-shadow(0 18px 22px rgba(0,0,0,.45));
  animation:loadingBounce .9s ease-in-out infinite alternate;
}

@keyframes loadingBounce{
  from{
    transform:translateY(4px) scale(.98);
  }
  to{
    transform:translateY(-7px) scale(1.02);
  }
}

.loadingSpeech{
  min-height:42px;
  padding:8px 18px;
  margin-top:-4px;
  border-radius:999px;
  background:#fff;
  color:#16151c;
  font-size:11px;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 8px 25px rgba(0,0,0,.23);
  z-index:3;
}

.loadingBarOuter{
  width:min(78vw,330px);
  height:18px;
  margin-top:18px;
  padding:3px;
  border:2px solid rgba(255,255,255,.8);
  border-radius:999px;
  background:rgba(0,0,0,.25);
  overflow:hidden;
}

.loadingBarInner{
  height:100%;
  width:0%;
  border-radius:999px;
  background:
    linear-gradient(
      90deg,
      #75c8ff,
      #79efbe,
      #ddff63,
      #ffd86d,
      #ff90ad
    );
  transition:width .12s linear;
}

.loadingPercent{
  margin-top:7px;
  font-size:13px;
  font-weight:900;
  letter-spacing:1px;
}


/* =========================================================
   TITLE
========================================================= */

#titleScreen{
  z-index:90;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
  overflow:hidden;
  background:#000;
}

.titlePhoto{
  position:absolute;
  inset:0;
  background:url("./debut-live.webp") center/cover no-repeat;
}

.titlePhoto::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.15),
      rgba(0,0,0,.12) 38%,
      rgba(8,8,12,.80) 82%,
      #111118
    );
}

.titleSpark{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 17% 14%,rgba(221,255,99,.15),transparent 17%),
    radial-gradient(circle at 81% 24%,rgba(255,139,162,.14),transparent 18%);
  pointer-events:none;
}

.titleContent{
  position:relative;
  z-index:3;
  width:100%;
  padding:0 23px max(30px,env(safe-area-inset-bottom));
  text-align:center;
}

.titleMini{
  color:var(--acid);
  font-size:10px;
  font-weight:900;
  letter-spacing:4px;
}

.titleMain{
  margin-top:6px;
  font-size:40px;
  font-weight:900;
  font-style:italic;
  letter-spacing:-3px;
  text-shadow:0 7px 30px rgba(0,0,0,.55);
}

.titleSub{
  margin-top:5px;
  color:#ddd9e5;
  font-size:10px;
  letter-spacing:5px;
}

.startButton{
  width:100%;
  height:62px;
  margin-top:23px;
  border:0;
  border-radius:18px;
  background:
    linear-gradient(
      135deg,
      #e4ff68,
      #c8ff4d
    );
  color:#12130d;
  font-size:17px;
  font-weight:900;
  box-shadow:
    0 10px 30px rgba(213,255,93,.21),
    inset 0 -3px 0 rgba(0,0,0,.10);
  animation:startPulse 1.8s ease-in-out infinite;
}

@keyframes startPulse{
  50%{
    transform:scale(1.018);
    box-shadow:0 12px 34px rgba(213,255,93,.31);
  }
}

.continueButton{
  margin-top:10px;
  border:0;
  background:none;
  color:#bbb7c5;
  font-size:11px;
  text-decoration:underline;
}


/* =========================================================
   PROLOGUE
========================================================= */

#prologueScreen{
  z-index:80;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#050508;
}

.prologueImage{
  position:absolute;
  inset:0;
  background:url("./debut-live.webp") center/cover no-repeat;
  opacity:0;
  transform:scale(1.05);
  transition:
    opacity 1.5s ease,
    transform 4s ease;
}

.prologueImage.show{
  opacity:.72;
  transform:scale(1);
}

.prologueShade{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.42),
      rgba(0,0,0,.18) 45%,
      rgba(0,0,0,.75)
    );
}

.prologueText{
  position:relative;
  z-index:2;
  width:86%;
  text-align:center;
  white-space:pre-line;
  font-size:18px;
  font-weight:700;
  line-height:2;
  text-shadow:0 4px 16px rgba(0,0,0,.7);
}

.prologueHint{
  position:absolute;
  z-index:3;
  bottom:max(35px,env(safe-area-inset-bottom));
  font-size:10px;
  color:rgba(255,255,255,.65);
  animation:hintBlink 1.2s ease-in-out infinite;
}


/* =========================================================
   GAME
========================================================= */

#gameScreen{
  z-index:70;
  flex-direction:column;
  overflow:hidden;
  background:#15141c;
}

.gameTop{
  height:max(52px,calc(40px + env(safe-area-inset-top)));
  flex-shrink:0;
  padding:
    max(10px,env(safe-area-inset-top))
    13px
    7px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  background:#17161e;
  border-bottom:1px solid #34323d;
}

.chapter{
  color:var(--acid);
  font-size:10px;
  font-weight:900;
  letter-spacing:1.7px;
}

.topButtons{
  display:flex;
  align-items:center;
  gap:7px;
}

.miniStatus{
  border:1px solid #46434f;
  border-radius:999px;
  background:#25232c;
  color:#fff;
  padding:6px 11px;
  font-size:9px;
  font-weight:800;
}

.scene{
  position:relative;
  flex:1;
  min-height:0;
  overflow:hidden;
  background:#24252d;
}

.environment{
  position:absolute;
  inset:0;
  transition:background .35s ease;
}

.environment.studio{
  background:
    linear-gradient(to bottom,rgba(255,255,255,.07),transparent 20%),
    repeating-linear-gradient(
      to right,
      rgba(255,255,255,.03) 0 1px,
      transparent 1px 105px
    ),
    linear-gradient(
      to bottom,
      #454953 0 55%,
      #262831 55% 57%,
      #1a1b21 57%
    );
}

.environment.studio::before{
  content:"";
  position:absolute;
  left:7%;
  right:7%;
  top:8%;
  height:42%;
  border:4px solid rgba(255,255,255,.08);
  background:
    linear-gradient(
      120deg,
      rgba(255,255,255,.10),
      rgba(255,255,255,.015)
    );
}

.environment.studio::after{
  content:"DANCE STUDIO";
  position:absolute;
  right:10%;
  top:11%;
  color:rgba(255,255,255,.12);
  font-size:10px;
  font-weight:900;
  letter-spacing:3
