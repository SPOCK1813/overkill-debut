<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101216">
<title>O-VER-KiLL｜MANAGER'S STORY</title>

<style>
@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap");

:root{
  --bg:#101216;
  --panel:#1a1d23;
  --line:#353a44;
  --text:#f4f5ef;
  --muted:#98a0ab;
  --acid:#d7ff63;
}

*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:"Noto Sans JP",sans-serif;
}
body{overscroll-behavior:none}
button{
  font:inherit;
  color:inherit;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
button:disabled{
  opacity:.35;
  cursor:not-allowed;
}

.app{
  width:min(100%,900px);
  min-height:100dvh;
  margin:auto;
  padding:max(14px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
}

.header{
  height:66px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
}
.logo{
  font-size:23px;
  font-weight:900;
  font-style:italic;
  letter-spacing:-1px;
}
.logo span{
  display:block;
  margin-top:7px;
  color:var(--muted);
  font-size:9px;
  font-style:normal;
  letter-spacing:3px;
}
.help{
  width:42px;
  height:42px;
  border:1px solid var(--line);
  border-radius:50%;
  background:none;
  font-size:19px;
  font-weight:800;
}

.hud{
  margin-top:12px;
  padding:12px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
}
.hudTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}
.week{
  color:var(--acid);
  font-size:11px;
  font-weight:900;
  letter-spacing:1.5px;
}
.groupInfo{
  text-align:right;
  color:var(--muted);
  font-size:11px;
  line-height:1.6;
}
.groupInfo strong{
  color:#fff;
  font-size:14px;
}

.groupBarWrap{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
}
.groupStat label{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:10px;
}
.groupStat strong{color:#fff}
.bar{
  height:5px;
  margin-top:5px;
  overflow:hidden;
  background:#303640;
  border-radius:999px;
}
.fill{
  width:0;
  height:100%;
  background:var(--acid);
  border-radius:999px;
  transition:width .55s ease;
}

.memberEnergyRow{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:12px;
}
.energyMini{
  padding:8px 8px 7px;
  background:#20242b;
  border:1px solid #313744;
  border-radius:8px;
}
.energyMini .top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:10px;
  font-weight:800;
  margin-bottom:5px;
}
.energyMini .top span:last-child{
  color:#fff;
}
.energyMini .name{
  display:flex;
  align-items:center;
  gap:6px;
}
.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--member-color,#fff);
}

.stage{
  flex:1;
  min-height:0;
  margin-top:12px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:11px;
  background:radial-gradient(circle at 50% 28%,#353b46 0,#20242b 40%,#111318 82%);
}

.stageTop{
  padding:13px 15px 5px;
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:10px;
  letter-spacing:1px;
}
.stageTop b{color:var(--acid)}

.visualArea{
  height:365px;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}
.visualArea::after{
  content:"";
  position:absolute;
  left:10%;
  right:10%;
  bottom:-16px;
  height:90px;
  background:radial-gradient(ellipse,rgba(0,0,0,.52),transparent 70%);
  pointer-events:none;
}

.photoVisual,
.managerVisual,
.singleCharacter{
  position:absolute;
  inset:0;
  display:none;
}
.photoVisual.show,
.managerVisual.show,
.singleCharacter.show{
  display:flex;
}

.photoVisual{
  align-items:flex-end;
  justify-content:center;
  background-position:center center;
  background-size:cover;
  background-repeat:no-repeat;
}
.photoVisual::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(to bottom,rgba(8,10,14,.30),rgba(8,10,14,.25) 35%,rgba(8,10,14,.68)),
    radial-gradient(circle at center,rgba(255,255,255,.06),rgba(255,255,255,0) 52%);
}
.photoOverlay{
  position:absolute;
  left:0;
  right:0;
  bottom:28px;
  z-index:2;
  padding:0 22px;
  text-align:left;
}
.photoTag{
  color:var(--acid);
  font-size:10px;
  font-weight:900;
  letter-spacing:2.4px;
}
.photoTitle{
  margin-top:8px;
  font-size:28px;
  font-weight:900;
  font-style:italic;
  letter-spacing:-1px;
}
.photoSub{
  margin-top:6px;
  color:#eef1f6;
  font-size:12px;
  font-weight:700;
}

.managerVisual{
  align-items:center;
  justify-content:center;
  text-align:center;
}
.managerLogo{
  margin-top:-34px;
  font-size:36px;
  font-weight:900;
  font-style:italic;
  letter-spacing:-2px;
  opacity:.86;
}
.managerLogo span{
  display:block;
  margin-top:10px;
  color:var(--muted);
  font-size:10px;
  font-style:normal;
  letter-spacing:4px;
}

.singleCharacter{
  align-items:flex-end;
  justify-content:center;
}
.singleCharacter.enter .characterImg{
  animation:enter .35s ease both;
}
@keyframes enter{
  from{
    opacity:0;
    transform:translateY(22px) scale(.95);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}
.characterImg{
  width:80%;
  height:100%;
  object-fit:contain;
  object-position:center bottom;
  display:block;
  filter:drop-shadow(0 18px 20px rgba(0,0,0,.55));
}
.memberBadge{
  position:absolute;
  left:50%;
  bottom:8px;
  transform:translateX(-50%);
  z-index:3;
  padding:5px 12px;
  background:#0d1014e7;
  border-top:2px solid var(--member,#fff);
  border-radius:6px;
  font-size:11px;
  font-weight:900;
  letter-spacing:.5px;
}

.dialogue{
  min-height:122px;
  margin:0 12px 12px;
  padding:15px 16px 17px;
  position:relative;
  background:#f1f1eb;
  color:#16191e;
  border-radius:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.35);
}
.dialogue::before{
  content:"";
  position:absolute;
  top:-10px;
  left:36px;
  width:20px;
  height:20px;
  background:#f1f1eb;
  transform:rotate(45deg);
}
.speaker{
  position:relative;
  z-index:2;
  margin-bottom:7px;
  font-size:11px;
  font-weight:900;
  letter-spacing:2px;
}
.dialogueText{
  position:relative;
  z-index:2;
  white-space:pre-line;
  font-size:15px;
  font-weight:500;
  line-height:1.75;
}

.controls{
  padding:0 10px 10px;
}
.plan{
  margin-bottom:9px;
  display:flex;
  gap:5px;
}
.slot{
  flex:1;
  height:4px;
  background:#343a44;
  border-radius:10px;
}
.slot.done{
  background:var(--acid);
}

.memberGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.memberChoice{
  width:100%;
  padding:10px;
  text-align:left;
  border:1px solid #404753;
  border-radius:8px;
  background:#20242b;
}
.memberChoice.active{
  border-color:var(--acid);
  box-shadow:0 0 0 1px rgba(215,255,99,.28) inset;
}
.memberChoice .head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:4px;
  font-size:12px;
  font-weight:900;
}
.memberChoice .role{
  color:var(--muted);
  font-size:10px;
  margin-bottom:8px;
}
.memberChoice .tiny{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4px 8px;
  color:#dfe2e8;
  font-size:10px;
}
.memberChoice .energyLine{
  margin-top:7px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.choice{
  width:100%;
  padding:11px;
  text-align:left;
  border:1px solid #434954;
  border-radius:8px;
  background:#20242b;
}
.choice strong{
  display:block;
  font-size:13px;
}
.choice small{
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-size:10px;
  line-height:1.45;
}
.row{
  margin-top:8px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.primary{
  width:100%;
  min-height:48px;
  padding:11px;
  border:none;
  border-radius:8px;
  background:var(--acid);
  color:#12160b;
  font-weight:900;
}
.secondary{
  width:100%;
  min-height:44px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#1a1e24;
  font-weight:700;
}

.songUnlock{
  margin-bottom:10px;
  padding:16px;
  text-align:center;
  border:1px solid rgba(215,255,99,.35);
  border-radius:10px;
  background:linear-gradient(145deg,rgba(215,255,99,.08),rgba(255,255,255,.015));
}
.songNew{
  color:var(--acid);
  font-size:9px;
  font-weight:900;
  letter-spacing:3px;
}
.songTitle{
  margin-top:7px;
  font-size:23px;
  font-weight:900;
}
.songSub{
  margin-top:3px;
  color:var(--muted);
  font-size:10px;
}
.songButton{
  width:100%;
  margin-top:12px;
  padding:11px;
  border:1px solid rgba(215,255,99,.55);
  border-radius:8px;
  background:#151a13;
  color:var(--acid);
  font-weight:800;
}
.songButton.playing{
  background:var(--acid);
  color:#111;
}

.result{
  padding:10px 0 6px;
  text-align:center;
}
.resultNumber{
  font-size:50px;
  font-weight:900;
}
.resultNumber small{
  color:var(--muted);
  font-size:14px;
}
.resultGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.resultCard{
  padding:11px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#20242b;
}
.resultCard strong{
  display:block;
  font-size:13px;
}
.resultCard small{
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-size:10px;
}

.footer{
  display:flex;
  justify-content:space-between;
  padding-top:10px;
  color:#737b86;
  font-size:10px;
}
.footer button{
  padding:0;
  border:none;
  background:none;
  color:#737b86;
  text-decoration:underline;
}

.feedback{
  position:fixed;
  top:80px;
  left:50%;
  z-index:30;
  transform:translate(-50%,-10px);
  padding:8px 14px;
  border-radius:999px;
  background:var(--acid);
  color:#111;
  font-size:11px;
  font-weight:900;
  opacity:0;
  pointer-events:none;
  transition:.2s;
}
.feedback.show{
  opacity:1;
  transform:translate(-50%,0);
}

.modal{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#05070bdf;
  backdrop-filter:blur(8px);
}
.modal.show{display:flex}
.modalBox{
  width:min(100%,460px);
  max-height:85dvh;
  overflow:auto;
  padding:20px;
  border:1px solid #555d69;
  border-radius:12px;
  background:#1d2128;
}
.modalBox h2{
  margin-top:0;
}
.modalBox p,
.modalBox li{
  color:#cad0d8;
  font-size:13px;
  line-height:1.8;
}
.statusBlock{
  padding:11px;
  margin-bottom:10px;
  border:1px solid #343a46;
  border-radius:10px;
  background:#222730;
}
.statusBlock h3{
  margin:0 0 8px;
  font-size:14px;
}
.statusMini{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4px 10px;
  font-size:12px;
  color:#eff2f7;
}

@media(max-height:760px){
  .visualArea{height:300px}
}
@media(min-width:700px){
  .visualArea{height:520px}
  .characterImg{width:62%}
}
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <div class="logo">
      O-VER-KiLL
      <span>MANAGER'S STORY</span>
    </div>
    <button class="help" id="help">?</button>
  </header>

  <section class="hud">
    <div class="hudTop">
      <div class="week" id="weekLabel">WEEK 1 / 04</div>
      <div class="groupInfo">
        認知 <strong id="reachLabel">10</strong><br>
        活動資金 <strong id="cashLabel">¥220,000</strong>
      </div>
    </div>

    <div class="groupBarWrap">
      <div class="groupStat">
        <label><span>認知</span><strong id="reachValue">10</strong></label>
        <div class="bar"><div class="fill" id="reachBar"></div></div>
      </div>
      <div class="groupStat">
        <label><span>ライブ総合期待</span><strong id="livePotential">59</strong></label>
        <div class="bar"><div class="fill" id="liveBar"></div></div>
      </div>
    </div>

    <div class="memberEnergyRow" id="memberEnergyRow"></div>
  </section>

  <section class="stage">
    <div class="stageTop">
      <b id="stageLabel">FIRST MEETING</b>
      <span id="progressLabel">1 / 6</span>
    </div>

    <div class="visualArea">
      <div class="photoVisual" id="photoVisual">
        <div class="photoOverlay">
          <div class="photoTag" id="photoTag">DEBUT LIVE</div>
          <div class="photoTitle" id="photoTitle">O-VER-KiLL</div>
          <div class="photoSub" id="photoSub">ここから、物語が始まる。</div>
        </div>
      </div>

      <div class="managerVisual" id="managerVisual">
        <div class="managerLogo">
          O-VER-KiLL
          <span>THE BEGINNING</span>
        </div>
      </div>

      <div class="singleCharacter" id="singleCharacter">
        <img class="characterImg" id="characterImg" alt="">
        <div class="memberBadge" id="memberBadge"></div>
      </div>
    </div>

    <div class="dialogue">
      <div class="speaker" id="speaker">MANAGER</div>
      <div class="dialogueText" id="dialogueText"></div>
    </div>

    <div class="controls" id="controls"></div>
  </section>

  <footer class="footer">
    <span>非公式ファンゲーム・体験版</span>
    <button id="reset">最初から</button>
  </footer>
</div>

<div class="feedback" id="feedback"></div>

<div class="modal" id="modal">
  <div class="modalBox" id="modalBox"></div>
</div>

<audio id="songAudio" src="./akunaki-kodou.mp3" preload="metadata"></audio>

<script>
const DEBUT_PHOTO = "./debut-live.webp";
const SONG_CHORUS_START = 0;
const SONG_CHORUS_END = 30;

const MEMBERS = {
  sarina:{
    id:"sarina",
    name:"SARiNA",
    color:"#65df90",
    role:"歌◎ / 連携◎ / ダンス△",
    stats:{vocal:78,dance:48,bond:74,energy:72}
  },
  miyu:{
    id:"miyu",
    name:"MiYU",
    color:"#6fb9ff",
    role:"歌◎ / バランス型",
    stats:{vocal:74,dance:54,bond:68,energy:76}
  },
  kilua:{
    id:"kilua",
    name:"KiLUA",
    color:"#ff737f",
    role:"ダンス◎ / 連携△ / 歌△",
    stats:{vocal:52,dance:84,bond:40,energy:80}
  },
  raisa:{
    id:"raisa",
    name:"RAiSA",
    color:"#ffdc69",
    role:"歌△ / ダンス△ / 成長枠",
    stats:{vocal:42,dance:44,bond:58,energy:70}
  }
};

const CHAR_IMAGES = {
  sarina:{
    normal:"./sarina_normal.png",
    smile:"./sarina_smile.png",
    angry:"./sarina_angry.png",
    troubled:"./sarina_troubled.png",
    cry:"./sarina_cry.png"
  },
  miyu:{
    normal:"./miyu_normal.png",
    smile:"./miyu_smile.png",
    angry:"./miyu_angry.png",
    troubled:"./miyu_troubled.png",
    cry:"./miyu_cry.png"
  },
  kilua:{
    normal:"./kilua_normal.png",
    smile:"./kilua_smile.png",
    angry:"./kilua_angry.png",
    troubled:"./kilua_troubled.png",
    cry:"./kilua_cry.png"
  },
  raisa:{
    normal:"./raisa_normal.png",
    smile:"./raisa_smile.png",
    angry:"./raisa_angry.png",
    troubled:"./raisa_troubled.png",
    cry:"./raisa_cry.png"
  }
};

const INTRO = [
  {
    member:"MANAGER",
    visual:"photo",
    title:"DEBUT LIVE",
    photoTitle:"O-VER-KiLL",
    photoSub:"豊洲公園。4人の物語は、ここから始まる。",
    text:`豊洲公園。

O-VER-KiLLの
デビューライブ当日。

まだ何者でもない4人が、
最初のステージに立った。`
  },
  {
    member:"MANAGER",
    visual:"logo",
    text:`2,000名が応募した
オーディション。

その中から、
4人が選ばれた。`
  },
  {
    member:"sarina",
    expression:"normal",
    text:`SARiNAです。

ここから絶対、
大きくなってみせる。`
  },
  {
    member:"miyu",
    expression:"smile",
    text:`MiYUです！

4人なら、
面白い景色を
見せられる気がする。`
  },
  {
    member:"kilua",
    expression:"angry",
    text:`KiLUA。

やるなら本気。
中途半端は嫌い。`
  },
  {
    member:"raisa",
    expression:"smile",
    text:`RAiSAです。

まだ知られてないなら、
これから知ってもらえばいいよね。`
  },
  {
    member:"MANAGER",
    visual:"logo",
    text:`デビューライブまで
あと4週間。

あなたは今日から
この4人のマネージャーだ。`
  }
];

const ACTIONS = {
  vocal:{
    name:"ボーカル練習",
    desc:"歌唱力を伸ばす",
    cost:6000
  },
  dance:{
    name:"ダンス練習",
    desc:"ダンス力を伸ばす",
    cost:6000
  },
  meeting:{
    name:"ミーティング",
    desc:"連携を深める",
    cost:2000
  },
  sns:{
    name:"SNS告知",
    desc:"認知を広げる",
    cost:1500
  },
  rest:{
    name:"休養",
    desc:"体力を回復する",
    cost:0
  }
};

const STORAGE_KEY = "overkill_debut_v7_individual";

function deepClone(obj){
  return JSON.parse(JSON.stringify(obj));
}

function freshState(){
  const memberState = {};
  Object.values(MEMBERS).forEach(member=>{
    memberState[member.id] = deepClone(member.stats);
  });

  return {
    phase:"intro",
    intro:0,
    week:1,
    cash:220000,
    reach:10,
    selectedMember:null,
    plan:[],
    members:memberState,
    setlist:"balanced",
    result:null
  };
}

function load(){
  try{
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
    return data ? {...freshState(), ...data} : freshState();
  }catch(e){
    return freshState();
  }
}

let state = load();

function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function $(id){ return document.getElementById(id); }

const photoVisual = $("photoVisual");
const photoTag = $("photoTag");
const photoTitle = $("photoTitle");
const photoSub = $("photoSub");
const managerVisual = $("managerVisual");
const singleCharacter = $("singleCharacter");
const characterImg = $("characterImg");
const memberBadge = $("memberBadge");
const speaker = $("speaker");
const dialogueText = $("dialogueText");
const stageLabel = $("stageLabel");
const progressLabel = $("progressLabel");
const controls = $("controls");
const feedback = $("feedback");
const songAudio = $("songAudio");

photoVisual.style.backgroundImage = `url('${DEBUT_PHOTO}')`;

function yen(n){
  return "¥" + Math.round(n).toLocaleString("ja-JP");
}
function clamp(value,min=0,max=100){
  return Math.max(min, Math.min(max, value));
}
function memberName(id){
  return MEMBERS[id].name;
}
function avg(values){
  return values.reduce((a,b)=>a+b,0) / values.length;
}
function getLivePotential(){
  const members = Object.keys(state.members);
  const vocal = avg(members.map(id=>state.members[id].vocal));
  const dance = avg(members.map(id=>state.members[id].dance));
  const bond = avg(members.map(id=>state.members[id].bond));
  const energy = avg(members.map(id=>state.members[id].energy));
  return clamp(Math.round(vocal*0.3 + dance*0.28 + bond*0.22 + energy*0.1 + state.reach*0.1));
}
function getActionEfficiency(member){
  if(member.energy >= 60) return 1;
  if(member.energy >= 35) return 0.8;
  return 0.6;
}
function adjustMember(id, key, amount){
  state.members[id][key] = clamp(state.members[id][key] + amount);
}
function showFeedback(text){
  feedback.textContent = text;
  feedback.classList.add("show");
  clearTimeout(showFeedback.timer);
  showFeedback.timer = setTimeout(()=>feedback.classList.remove("show"), 1300);
}

function doActivity(actionId){
  const memberId = state.selectedMember;
  const meta = MEMBERS[memberId];
  const member = state.members[memberId];
  const action = ACTIONS[actionId];
  if(!action) return;
  if(state.cash < action.cost) return;

  state.cash -= action.cost;

  const efficiency = getActionEfficiency(member);

  let resultText = "";
  let expression = "smile";

  if(actionId === "vocal"){
    const gain = Math.round(8 * efficiency);
    adjustMember(memberId, "vocal", gain);
    adjustMember(memberId, "energy", -8);
    state.reach = clamp(state.reach + 1);
    resultText = `${meta.name}は
ボーカル練習に集中した。

歌唱が伸びた。`;
    expression = "smile";
  }

  if(actionId === "dance"){
    const gain = Math.round(8 * efficiency);
    adjustMember(memberId, "dance", gain);
    adjustMember(memberId, "energy", -9);
    state.reach = clamp(state.reach + 1);
    resultText = `${meta.name}は
ダンス練習を重ねた。

動きのキレが増した。`;
    expression = meta.id === "kilua" ? "smile" : "normal";
  }

  if(actionId === "meeting"){
    const gain = Math.round(7 * efficiency);
    adjustMember(memberId, "bond", gain);
    adjustMember(memberId, "energy", -4);
    Object.keys(state.members).forEach(id=>{
      if(id !== memberId){
        adjustMember(id, "bond", 1);
      }
    });
    resultText = `${meta.name}を中心に
ミーティングを行った。

4人の方向性が
少し揃ってきた。`;
    expression = "smile";
  }

  if(actionId === "sns"){
    adjustMember(memberId, "energy", -4);
    adjustMember(memberId, "bond", 2);
    state.reach = clamp(state.reach + 8);
    resultText = `${meta.name}が前に出て
SNS告知を行った。

グループの認知が
広がっていく。`;
    expression = "smile";
  }

  if(actionId === "rest"){
    adjustMember(memberId, "energy", 18);
    resultText = `${meta.name}は
しっかり休養をとった。

体力が回復した。`;
    expression = "smile";
  }

  state.plan.push({
    memberId,
    actionId
  });

  state.selectedMember = null;
  save();
  renderHud();
  showFeedback(`${meta.name}：${action.name}`);
  setScene({
    speakerName:meta.name,
    text:resultText,
    label:`WEEK ${state.week}`,
    progress:`${state.plan.length} / 3`,
    visual:"character",
    memberId,
    expression
  });

  controls.innerHTML = `
    <button class="primary" data-action="continue">次へ →</button>
  `;
}

function calculateResult(){
  const ids = Object.keys(state.members);
  const vocal = avg(ids.map(id=>state.members[id].vocal));
  const dance = avg(ids.map(id=>state.members[id].dance));
  const bond = avg(ids.map(id=>state.members[id].bond));
  const energy = avg(ids.map(id=>state.members[id].energy));

  let performance = vocal*0.30 + dance*0.28 + bond*0.22 + energy*0.10 + state.reach*0.10;

  if(state.setlist === "vocal") performance += vocal*0.08;
  if(state.setlist === "dance") performance += dance*0.08;

  performance = clamp(Math.round(performance));

  const attendance = Math.max(35, Math.round(30 + state.reach*1.8 + bond*0.45));
  const fans = Math.max(6, Math.round(attendance * (performance/100) * 0.55));
  const ticketIncome = attendance * 2000;

  state.cash += ticketIncome;

  const memberScores = ids.map(id=>{
    const m = state.members[id];
    return {
      id,
      score: Math.round(m.vocal*0.3 + m.dance*0.3 + m.bond*0.2 + m.energy*0.2)
    };
  }).sort((a,b)=>b.score-a.score);

  state.result = {
    performance,
    attendance,
    fans,
    ticketIncome,
    mvp: memberScores[0].id
  };
}

  songAudio.play().then(()=>{

      button.classList.add("playing");

  renderHud();

  if(state.phase === "intro") renderIntro();
  if(state.phase === "planning") renderPlanning();

  if(state.phase === "live") renderLive();
  if(state.phase === "result") renderResult();
}

document.addEventListener("click", (event)=>{
  if(event.target.matches("[data-modal-close]")){
    $("modal").classList.remove("show");
    return;
  }

  const button = event.target.closest("[data-action]");
  if(!button || button.disabled) return;

  const action = button.dataset.action;

  if(action === "introNext"){
    if(state.intro < INTRO.length - 1){
      state.intro++;
    }else{
      state.phase = "planning";
    }
    save();
    render();
    return;
  }

  if(action === "introBack"){
    state.intro = Math.max(0, state.intro - 1);
    save();
    render();
    return;
  }

  if(action === "pickMember"){
    state.selectedMember = button.dataset.id;
    save();
    render();
    return;
  }

  if(action === "backMember"){
    state.selectedMember = null;
    save();
    render();
    return;
  }

  if(action === "activity"){
    doActivity(button.dataset.id);
    return;
  }

  if(action === "continue"){
    render();
    return;
  }

  if(action === "advance"){
    state.plan = [];
    state.selectedMember = null;
    if(state.week === 4){
      state.phase = "liveReady";
    }else{
      state.week++;
    }
    save();
    render();
    return;
  }

  if(action === "song"){
    toggleSong();
    return;
  }

  if(action === "setlist"){
    state.setlist = button.dataset.id;
    state.phase = "live";
    save();
    render();
    return;
  }

  if(action === "finish"){
    calculateResult();
    state.phase = "result";
    save();
    render();
    return;
  }

  if(action === "stats"){
    openStats();
    return;
  }

  if(action === "helpStep"){
    openHelp();
    return;
  }

  if(action === "history"){
    openHistory();
    return;
  }

  if(action === "restart"){
    if(confirm("最初からやり直しますか？")){
      stopSong();
      state = freshState();
      save();
      render();
    }
    return;
  }
});

$("help").addEventListener("click", openHelp);

$("reset").addEventListener("click", ()=>{
  if(confirm("保存データを消して最初からやり直しますか？")){
    stopSong();
    state = freshState();
    save();
    render();
  }
});

$("modal").addEventListener("click", (event)=>{
  if(event.target === $("modal")){
    $("modal").classList.remove("show");
  }
});

render();
</script>
</body>
</html>
