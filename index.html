<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101216">

<title>O-VER-KiLL｜MANAGER'S STORY</title>

<style>
@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800;900&display=swap");

:root{
  --bg:#101216;
  --panel:#191c22;
  --line:#353a44;
  --text:#f4f5ef;
  --muted:#969da8;
  --acid:#d9ff66;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:"Noto Sans JP",sans-serif;
}

body{
  overscroll-behavior:none;
}

button{
  font:inherit;
  color:inherit;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

button:disabled{
  opacity:.35;
}

.app{
  width:min(100%,900px);
  min-height:100dvh;
  margin:auto;
  padding:
    max(14px,env(safe-area-inset-top))
    16px
    max(16px,env(safe-area-inset-bottom));

  display:flex;
  flex-direction:column;
}

.header{
  height:67px;
  display:flex;
  justify-content:space-between;
  align-items:center;

  border-bottom:1px solid var(--line);
}

.logo{
  font-size:23px;
  font-weight:900;
  font-style:italic;
  letter-spacing:-1px;
}

.logo span{
  display:block;
  margin-top:7px;

  font-size:9px;
  letter-spacing:3px;
  font-style:normal;

  color:var(--muted);
}

.help{
  width:42px;
  height:42px;

  border:1px solid var(--line);
  border-radius:50%;

  background:none;

  font-size:19px;
  font-weight:800;
}

.game{
  flex:1;
  display:flex;
  flex-direction:column;
}

.hud{
  margin-top:12px;
  padding:12px;

  background:var(--panel);

  border:1px solid var(--line);
  border-radius:10px;
}

.hudTop{
  display:flex;
  justify-content:space-between;
  gap:10px;

  margin-bottom:10px;
}

.week{
  color:var(--acid);

  font-size:11px;
  font-weight:900;
  letter-spacing:1.4px;
}

.cash{
  color:var(--muted);
  font-size:12px;
}

.cash strong{
  color:white;
  font-size:14px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px 10px;
}

.stat label{
  display:flex;
  justify-content:space-between;

  font-size:10px;
  color:var(--muted);
}

.stat strong{
  color:white;
}

.bar{
  height:4px;
  margin-top:5px;

  background:#303640;

  border-radius:20px;
  overflow:hidden;
}

.fill{
  height:100%;
  width:0;

  background:var(--acid);

  border-radius:20px;

  transition:width .7s ease;
}

.stage{
  flex:1;

  min-height:0;

  margin-top:12px;

  border:1px solid var(--line);
  border-radius:10px;

  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 25%,
      #363b45 0,
      #22262d 40%,
      #121419 78%
    );

  display:flex;
  flex-direction:column;
}

.stageTop{
  padding:13px 15px 5px;

  display:flex;
  justify-content:space-between;

  font-size:10px;
  letter-spacing:1px;

  color:var(--muted);
}

.stageTop b{
  color:var(--acid);
}

.characters{
  flex:1;

  min-height:220px;

  display:flex;
  justify-content:center;
  align-items:flex-end;

  gap:1px;

  padding:8px 4px 0;
}

.character{
  width:25%;
  height:215px;

  position:relative;

  display:flex;
  justify-content:center;
  align-items:flex-end;

  opacity:.36;

  transform:scale(.91);

  transition:
    opacity .25s ease,
    transform .25s ease;
}

.character.active{
  opacity:1;
  transform:scale(1.03);
}

.charImg{
  width:100%;
  height:100%;

  object-fit:contain;

  display:block;

  filter:
    drop-shadow(0 10px 14px rgba(0,0,0,.45));
}

.character:not(.active) .charImg{
  filter:
    grayscale(.18)
    brightness(.68)
    drop-shadow(0 8px 12px rgba(0,0,0,.3));
}

.memberName{
  position:absolute;

  left:50%;
  bottom:4px;

  transform:translateX(-50%);

  background:#101216dd;

  border-top:2px solid var(--member);

  padding:3px 6px;

  border-radius:4px;

  white-space:nowrap;

  font-size:9px;
  font-weight:900;
}

.dialogue{
  min-height:108px;

  margin:0 10px 10px;
  padding:14px 15px;

  background:#f1f2eb;

  color:#171a20;

  border-radius:9px;

  box-shadow:0 5px 18px #0008;
}

.speaker{
  margin-bottom:6px;

  font-size:10px;
  font-weight:900;
  letter-spacing:1.5px;
}

.dialogueText{
  font-size:14px;
  font-weight:500;
  line-height:1.75;

  white-space:pre-line;
}

.controls{
  padding:0 10px 10px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;

  gap:7px;
}

.choice{
  width:100%;

  padding:11px;

  text-align:left;

  border:1px solid #434954;
  border-radius:7px;

  background:#20242b;
}

.choice strong{
  display:block;

  font-size:13px;
}

.choice small{
  display:block;

  margin-top:4px;

  color:var(--muted);

  font-size:10px;
  line-height:1.45;
}

.primary{
  width:100%;

  min-height:48px;

  border:none;
  border-radius:7px;

  background:var(--acid);
  color:#12160b;

  font-weight:900;
}

.secondary{
  width:100%;

  min-height:44px;

  border:1px solid var(--line);
  border-radius:7px;

  background:#1a1e24;

  font-weight:700;
}

.row{
  margin-top:7px;

  display:grid;
  grid-template-columns:1fr 1fr;

  gap:7px;
}

.plan{
  display:flex;

  gap:5px;

  margin-bottom:8px;
}

.slot{
  flex:1;

  height:4px;

  background:#343a44;

  border-radius:10px;
}

.slot.done{
  background:var(--acid);
}

.good{
  padding:10px;

  border:1px solid var(--line);
  border-radius:7px;

  background:#20242b;
}

.good strong{
  display:block;

  font-size:13px;
}

.good small{
  display:block;

  margin-top:3px;

  color:var(--muted);

  font-size:10px;
}

.goods{
  display:grid;

  gap:7px;
}

.goodTop{
  display:flex;
  justify-content:space-between;
}

.qty{
  margin-top:8px;

  display:flex;
  align-items:center;

  gap:8px;
}

.qty button{
  width:36px;
  height:36px;

  border:1px solid #4c535f;
  border-radius:5px;

  background:#2b3038;
}

.qty span{
  min-width:50px;

  text-align:center;
}

.result{
  padding:15px 0;

  text-align:center;
}

.resultNumber{
  font-size:52px;
  font-weight:900;
}

.resultNumber small{
  font-size:14px;
  color:var(--muted);
}

.feedback{
  position:fixed;

  top:80px;
  left:50%;

  z-index:30;

  transform:translate(-50%,-10px);

  padding:8px 14px;

  border-radius:999px;

  background:var(--acid);
  color:#111;

  font-size:11px;
  font-weight:900;

  opacity:0;

  pointer-events:none;

  transition:.2s;
}

.feedback.show{
  opacity:1;

  transform:translate(-50%,0);
}

.modal{
  position:fixed;

  inset:0;

  z-index:50;

  display:none;
  align-items:center;
  justify-content:center;

  padding:20px;

  background:#05070bdf;

  backdrop-filter:blur(8px);
}

.modal.show{
  display:flex;
}

.modalBox{
  width:min(100%,430px);

  padding:20px;

  border:1px solid #555d69;
  border-radius:12px;

  background:#1d2128;
}

.modalBox h2{
  margin-top:0;
}

.modalBox p,
.modalBox li{
  color:#cad0d8;

  font-size:13px;
  line-height:1.8;
}

.footer{
  display:flex;
  justify-content:space-between;

  padding-top:10px;

  color:#737b86;

  font-size:10px;
}

.footer button{
  padding:0;

  border:none;

  background:none;
  color:#737b86;

  text-decoration:underline;
}

@media(max-height:700px){

  .characters{
    min-height:170px;
  }

  .character{
    height:170px;
  }

}

@media(min-width:700px){

  .characters{
    min-height:320px;
  }

  .character{
    height:300px;
  }

}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="logo">
    O-VER-KiLL
    <span>MANAGER'S STORY</span>
  </div>

  <button class="help" id="help">?</button>

</header>

<main class="game">

<section class="hud">

  <div class="hudTop">

    <div class="week" id="weekLabel">

    </div>

    <div class="cash">

    class="characters"

  </div>


  <div class="dialogue">

    <div
      class="speaker"
      id="speaker">
      MANAGER

    <div

  </div>


  <div
    class="controls"
    id="controls">
  </div>

</section>

</main>


<footer class="footer">

  <span>
    非公式ファンゲーム・体験版
  </span>

  <button id="reset">

  </button>

</footer>

</div>


<div
  class="feedback"
  id="feedback">
</div>


<div
  class="modal"
  id="modal">

  <div
    class="modalBox"
    id="modalBox">
  </div>

</div>

        result:{

      {

        },

`無理に追わず、

};


const GOODS = {

  tee:{
    name:"O-VER-KiLL Tシャツ",
    cost:1300,
    price:3000
  },

  base:{
    name:"ベースボールシャツ",
    cost:2300,
    price:5000
  }

};


const INTRO = [

  {
    member:"MANAGER",
    expression:"normal",

    text:
`2,000名が応募したオーディション。

  },

`SARiNAです。

    expression:"smile",

    text:
`MiYUです！

  },


  {

    text:
`KiLUA。

  },


  {

    expression:"smile",

    text:
`RAiSAです。

まだ知られてないなら、

  },


  {
    member:"MANAGER",

    text:
`デビューライブまで、あと４週間。

あなたは今日から、

  }

];


const STORAGE_KEY =
  "overkill_debut_v5";


function freshState(){

  return {

    phase:"intro",

    intro:0,

    week:1,

    cash:220000,

    stats:{
      vocal:35,
      dance:32,
      reach:10,
      bond:45,
      energy:85
    },

    plan:[],

    events:{},

    draft:{
      tee:0,
      base:0
    },

    ordered:{
      tee:0,
      base:0
    },

    stock:{
      tee:0,
      base:0
    },

    pending:[],

    setlist:"balanced",

    result:null

  };

}


function load(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem(
          STORAGE_KEY
        )
      );

    return saved
      ? {
          ...freshState(),
          ...saved
        }
      : freshState();

  }

  catch(e){

    return freshState();

  }

}


let state =
  load();


const $ =
  id =>
    document.getElementById(id);


const characters =
  $("characters");

const controls =
  $("controls");

const dialogue =
  $("dialogue");

const speaker =
  $("speaker");

const stageLabel =
  $("stageLabel");

const progressLabel =
  $("progressLabel");

const feedback =
  $("feedback");


function yen(n){

  return "¥" +
    Math.round(n)
      .toLocaleString("ja-JP");

}


function save(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state)
  );

}


function clamp(
  value,
  min=0,
  max=100
){

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );

}


function applyEffect(effect){

  for(
    const [key,value]
    of Object.entries(effect)
  ){

    if(key==="cash"){

      state.cash =
        Math.max(
          0,
          state.cash + value
        );

    }

    else{

      state.stats[key] =
        clamp(
          state.stats[key] + value
        );

    }

  }

}


function getMember(name){

  return MEMBERS.find(
    member =>
      member.name===name
  );

}


function renderCharacters(
  activeName,
  activeExpression="normal"
){

  const active =
    getMember(activeName);


  characters.innerHTML =
    MEMBERS.map(member=>{

      const isActive =
        active &&
        active.id===member.id;


      const expression =
        isActive
          ? activeExpression
          : "normal";


      const source =
        CHAR_IMAGES[member.id][expression]
        ||
        CHAR_IMAGES[member.id].normal;


      return `

        <div
          class="character
          ${isActive ? "active" : ""}"

          style="
          --member:${member.color}
          "
        >

          <img
            class="charImg"
            src="${source}"
            alt="${member.name}"
          >

          <div
            class="memberName"
          >
            ${member.name}
          </div>

        </div>

      `;

    }).join("");

}


function renderHud(){

  $("weekLabel").textContent =

    state.phase==="result"
      ? "DEBUT REPORT"

      : state.phase==="live"
      ? "DEBUT LIVE"

      : `WEEK ${state.week} / 04`;


  $("cash").textContent =
    yen(state.cash);


  $("stats").innerHTML =
    Object.entries(
      STAT_NAMES
    )
    .map(
      ([key,name])=>`

      <div class="stat">

        <label>

          <span>
            ${name}
          </span>

          <strong>
            ${state.stats[key]}
          </strong>

        </label>

        <div class="bar">

          <div
            class="fill"
            id="bar-${key}"
          ></div>

        </div>

      </div>

    `
    )
    .join("");


  requestAnimationFrame(()=>{

    for(
      const key
      of Object.keys(STAT_NAMES)
    ){

      const el =
        $("bar-"+key);

      if(el){

        el.style.width =
          state.stats[key] + "%";

      }

    }

  });

}


function setScene(
  member,
  text,
  label,
  progress="",
  expression="normal"
){

  speaker.textContent =
    member;


  dialogue.textContent =
    text;


  stageLabel.textContent =
    label;


  progressLabel.textContent =
    progress;


  renderCharacters(
    member,
    expression
  );

}


function primary(
  text,
  action,
  extra=""
){

  return `

    <button
      class="primary"
      data-action="${action}"
      ${extra}
    >

      ${text}

    </button>

  `;

}


function secondary(
  text,
  action,
  extra=""
){

  return `

    <button
      class="secondary"
      data-action="${action}"
      ${extra}
    >

      ${text}

    </button>

  `;

}


function showFeedback(text){

  feedback.textContent =
    text;


  feedback.classList.add(
    "show"
  );


  clearTimeout(
    showFeedback.timer
  );


  showFeedback.timer =
    setTimeout(
      ()=>{
        feedback.classList.remove(
          "show"
        );
      },
      1300
    );

}


function pendingEvent(){

  return (

    EVENTS[state.week]

    &&

    !state.events[state.week]

    &&

    state.plan.length===0

  );

}


function deliverGoods(){

  const delivered =
    state.pending.filter(
      item =>
        item.week<=state.week
    );


  for(
    const item
    of delivered
  ){

    state.stock[item.id]
      += item.qty;

  }


  state.pending =
    state.pending.filter(
      item =>
        item.week>state.week
    );

}


function renderIntro(){

  const scene =

  setScene(

    scene.member,

}


function renderEvent(){

  const event =
    EVENTS[state.week];

}


function renderPlanning(){

  if(
    pendingEvent()
  ){

    renderEvent();

    return;

  }


  if(
    state.plan.length===3
  ){

    setScene(

      "SARiNA",

      `今週も、おつかれさま！

この積み重ねが、
きっと本番につながる。`,

      `WEEK ${state.week}`,

      "3 / 3",

      "smile"

    );


    controls.innerHTML = `

      <div class="plan">

        <span class="slot done"></span>

        <span class="slot done"></span>

        <span class="slot done"></span>

      </div>


      ${primary(

        state.week===4
          ? "デビューライブ当日へ →"
          : "次の１週間へ →",

        "advance"

      )}


      <div class="row">

        ${secondary(
          "グッズ",
          "goods"
        )}

        ${secondary(
          "ステータス",
          "stats"
        )}

      </div>

    `;


    return;

  }


  const member =
    MEMBERS[
      state.plan.length % 4
    ];


  let text =
    "今日は、何から始めましょう？";


  let expression =
    "normal";


  if(
    state.plan.length===1
  ){

    text =
      `ひとつ終わったね。

次はどうする？`;

    expression =
      "smile";

  }


  if(
    state.plan.length===2
  ){

    text =
      `今週はあとひとつ。

最後は何を選ぶ？`;

  }


  setScene(

    member.name,

    text,

    `WEEK ${state.week}`,

    `行動 ${state.plan.length+1} / 3`,

    expression

  );


  controls.innerHTML = `

    <div class="plan">

      ${[0,1,2]
        .map(
          i=>`
          <span
            class="
              slot
              ${
                i<state.plan.length
                  ? "done"
                  : ""
              }
            "
          ></span>
        `
        )
        .join("")
      }

    </div>


    <div class="actions">

      ${Object.entries(ACTIONS)
        .map(
          ([id,action])=>`

          <button

            class="choice"

            data-action="activity"

            data-id="${id}"

            ${
              state.cash<action.cost
                ? "disabled"
                : ""
            }

          >

            <strong>
              ${action.name}
            </strong>

            <small>

              ${action.desc}

              ・

              ${
                action.cost
                  ? yen(action.cost)
                  : "費用なし"
              }

            </small>

          </button>

        `
        )
        .join("")
      }

    </div>


    <div class="row">

      ${secondary(
        "グッズ",
        "goods"
      )}

      ${secondary(
        "ステータス",
        "stats"
      )}

    </div>

  `;

}


function doActivity(id){

  const action =
    ACTIONS[id];


  if(!action){
    return;
  }


  if(
    state.plan.length>=3
  ){
    return;
  }


  if(
    state.cash<action.cost
  ){
    return;
  }


  state.cash -=
    action.cost;


  const effect =
    {
      ...action.effect
    };


  if(
    state.stats.energy<30
  ){

    if(effect.vocal>0){

      effect.vocal =
        Math.floor(
          effect.vocal / 2
        );

    }


    if(effect.dance>0){

      effect.dance =
        Math.floor(
          effect.dance / 2
        );

    }

  }


  applyEffect(effect);


  state.plan.push(id);


  save();

  renderHud();


  showFeedback(

    action.cost

      ? `${action.name} −${yen(action.cost)}`

      : action.name

  );


  setScene(

    action.reaction.member,

    action.reaction.text,

    `WEEK ${state.week}`,

    `${state.plan.length} / 3`,

    action.reaction.expression

  );


  controls.innerHTML =
    primary(
      "次へ →",
      "continue"
    );

}

持ち帰れるように。

グッズも準備しておこう！`,

    ${primary(

}

function calculateResult(){

  const stats =
    state.stats;


  let performance =

    stats.vocal * .3

    +

    stats.dance * .3

    +

    stats.bond * .25

    +

    stats.energy * .15;


  if(
    state.setlist==="vocal"
  ){

    performance
      += stats.vocal * .08;

  }


  if(
    state.setlist==="dance"
  ){

    performance
      += stats.dance * .08;

  }


  performance =
    Math.round(
      clamp(performance)
    );


  const attendance =
    Math.max(

      20,

      Math.round(

        18

        +

        stats.reach * 1.65

        +

        stats.bond * .35

      )

    );


  const fans =
    Math.max(

      4,

      Math.round(

        attendance

        *

        (
          performance / 100
        )

        *

        .62

      )

    );


  const ticketIncome =
    attendance * 2000;


  const teeSold =
    Math.min(

      state.stock.tee,

      Math.round(
        attendance * .18
      )

    );


  const baseSold =
    Math.min(

      state.stock.base,

      Math.round(
        attendance * .09
      )

    );


  const merchIncome =

    teeSold
    * GOODS.tee.price

    +

    baseSold
    * GOODS.base.price;


  state.stock.tee -=
    teeSold;


  state.stock.base -=
    baseSold;


  state.cash +=
    ticketIncome
    +
    merchIncome;


  state.result = {

    performance,

    attendance,

    fans,

    teeSold,

    baseSold,

    ticketIncome,

    merchIncome

  };

}

function render(){

  renderHud();


  if(
    state.phase==="intro"
  ){

    renderIntro();

  }


  if(
    state.phase==="planning"
  ){

    renderPlanning();

  }


  if(
    state.phase==="liveReady"
  ){

    renderLiveReady();

  }


  if(
    state.phase==="live"
  ){

    renderLive();

  }


  if(
    state.phase==="result"
  ){

    renderResult();

  }

}


document.addEventListener(
  "click",
  event=>{

    if(
      event.target.matches(
        "[data-modal-close]"
      )
    ){

      $("modal")
        .classList
        .remove("show");

      return;

    }


    const button =
      event.target.closest(
        "[data-action]"
      );


    if(
      !button
      ||
      button.disabled
    ){

      return;

    }


    const action =
      button.dataset.action;


    if(
      action==="introNext"
    ){

      if(
        state.intro
        <
        INTRO.length-1
      ){

        state.intro++;

      }

      else{

        state.phase =
          "planning";

      }


      save();

      render();

      return;

    }


    if(
      action==="introBack"
    ){

      state.intro =
        Math.max(
          0,
          state.intro-1
        );


      save();

      render();

      return;

    }


    if(
      action==="activity"
    ){

      doActivity(
        button.dataset.id
      );

      return;

    }


    if(
      action==="continue"
    ){

      render();

      return;

    }


    if(
      action==="event"
    ){

      const currentEvent =
        EVENTS[state.week];


      const choice =
        currentEvent
          .choices[
            Number(
              button.dataset.index
            )
          ];


      applyEffect(
        choice.effect
      );


      state.events[state.week] =
        true;


      save();

      renderHud();


      showFeedback(
        "あなたの選択が４人に届いた"
      );


      setScene(

        choice.result.member,

        choice.result.text,

        "EVENT RESULT",

        "",

        choice.result.expression

      );


      controls.innerHTML =
        primary(
          "次へ →",
          "continue"
        );


      return;

    }


    if(
      action==="advance"
    ){

      state.plan = [];


      if(
        state.week===4
      ){

        state.phase =
          "liveReady";

      }

      else{

        state.week++;

        deliverGoods();

      }


      save();

      render();

      return;

    }


    if(
      action==="goods"
    ){

      openGoods();

      return;

    }


    if(
      action==="stats"
    ){

      openStats();

      return;

    }


    if(
      action==="qty"
    ){

      if(
        state.week>3
      ){

        return;

      }


      const id =
        button.dataset.id;


      const delta =
        Number(
          button.dataset.delta
        );


      state.draft[id] =
        clamp(

          state.draft[id]
          +
          delta,

          0,

          100

        );


      save();

      openGoods();

      return;

    }


    if(
      action==="order"
    ){

      const total =

        state.draft.tee
        * GOODS.tee.cost

        +

        state.draft.base
        * GOODS.base.cost;


      if(
        !total
        ||
        total>state.cash
        ||
        state.week>3
      ){

        return;

      }


      state.cash -=
        total;


      for(
        const id
        of Object.keys(GOODS)
      ){

        const qty =
          state.draft[id];


        if(qty>0){

          state.pending.push({

            id,

            qty,

            week:
              state.week+1

          });


          state.ordered[id] +=
            qty;

        }

      }


      state.draft = {
        tee:0,
        base:0
      };


      save();

      renderHud();


      showFeedback(
        "グッズを発注しました"
      );


      setScene(

        "MiYU",

        `発注完了！

届くのは来週。

ライブで誰かが
着てくれたら嬉しいね。`,

        "MERCH ORDER",

        "",

        "smile"

      );


      controls.innerHTML =
        primary(
          "次へ →",
          "continue"
        );


      return;

    }


    if(
      action==="setlist"
    ){

      state.setlist =
        button.dataset.id;


      state.phase =
        "live";


      save();

      render();

      return;

    }


    if(
      action==="finish"
    ){

      calculateResult();


      state.phase =
        "result";


      save();

      render();

      return;

    }


    if(
      action==="restart"
    ){

      if(
        confirm(
          "最初からやり直しますか？"
        )
      ){

        state =
          freshState();


        save();

        render();

      }


      return;

    }

  }
);


$("help")
  .addEventListener(
    "click",
    openHelp
  );


$("modal")
  .addEventListener(
    "click",
    event=>{

      if(
        event.target
        ===
        $("modal")
      ){

        $("modal")
          .classList
          .remove("show");

      }

    }
  );


$("reset")
  .addEventListener(

    ()=>{

      if(
        confirm(
          "保存データを消して最初からやり直しますか？"
        )
      ){

        state =
          freshState();


        save();

        render();

      }

    }
  );


render();

</script>
