<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15131c">
<title>O-VER-KiLL｜MANAGER'S STORY</title>

<style>
@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap");

:root{
  --bg:#111118;
  --panel:#1c1b25;
  --line:#393744;
  --text:#f8f7fb;
  --muted:#aaa7b5;
  --acid:#ddff63;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(circle at 50% 0%,#262131 0,#111118 48%);
  color:var(--text);
  font-family:"Noto Sans JP",sans-serif;
}

body{
  overscroll-behavior:none;
}

button{
  font:inherit;
  -webkit-tap-highlight-color:transparent;
}

.app{
  width:min(100%,820px);
  min-height:100dvh;
  margin:auto;
  padding:
    max(10px,env(safe-area-inset-top))
    12px
    max(14px,env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
}

/* HEADER */

.header{
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:21px;
  line-height:1;
  font-weight:900;
  font-style:italic;
  letter-spacing:-1px;
}

.logo small{
  display:block;
  margin-top:8px;
  color:#888494;
  font-size:8px;
  font-style:normal;
  letter-spacing:3px;
}

.headerButton{
  width:38px;
  height:38px;
  border:1px solid #3e3b49;
  border-radius:50%;
  background:#201e28;
  color:#fff;
  font-weight:900;
}

/* HUD */

.hud{
  padding:10px 11px;
  border:1px solid #393744;
  border-radius:12px;
  background:rgba(27,26,34,.92);
}

.hudTop{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}

.weekLabel{
  color:var(--acid);
  font-size:11px;
  font-weight:900;
  letter-spacing:1.4px;
}

.days{
  margin-top:3px;
  color:#fff;
  font-size:15px;
  font-weight:900;
}

.money{
  text-align:right;
  color:#9693a0;
  font-size:9px;
}

.money strong{
  display:block;
  margin-top:2px;
  color:#fff;
  font-size:14px;
}

.groupRow{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:9px;
}

.statLine{
  font-size:9px;
  color:#9996a4;
}

.statLineTop{
  display:flex;
  justify-content:space-between;
}

.statLineTop b{
  color:#fff;
}

.bar{
  height:4px;
  margin-top:5px;
  overflow:hidden;
  border-radius:999px;
  background:#353340;
}

.fill{
  height:100%;
  border-radius:999px;
  background:var(--acid);
  transition:width .5s ease;
}

.energyRow{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  margin-top:9px;
}

.energy{
  padding:6px;
  border-radius:7px;
  background:#25232d;
}

.energyTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:8px;
  font-weight:800;
}

.dot{
  display:inline-block;
  width:6px;
  height:6px;
  margin-right:3px;
  border-radius:50%;
}

/* GAME */

.game{
  flex:1;
  min-height:0;
  margin-top:10px;
  overflow:hidden;
  border:1px solid #393744;
  border-radius:15px;
  background:#171720;
  display:flex;
  flex-direction:column;
  position:relative;
}

.sceneHead{
  height:38px;
  padding:0 13px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#1d1c25;
  border-bottom:1px solid #34323e;
  color:#918e9b;
  font-size:9px;
  letter-spacing:1.2px;
}

.sceneHead b{
  color:var(--acid);
}

/* VISUAL */

.visual{
  position:relative;
  height:365px;
  overflow:hidden;
  flex-shrink:0;
  background:#22242d;
  transition:background .35s ease;
}

.visual.scene-studio{
  background:
    linear-gradient(to bottom,rgba(255,255,255,.08),transparent 20%),
    repeating-linear-gradient(
      to right,
      rgba(255,255,255,.035) 0 1px,
      transparent 1px 95px
    ),
    linear-gradient(
      to bottom,
      #393d47 0 58%,
      #272a31 58% 60%,
      #202127 60%
    );
}

.visual.scene-studio::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:42%;
  z-index:0;
  background:
    repeating-linear-gradient(
      90deg,
      rgba(255,255,255,.025) 0 1px,
      transparent 1px 70px
    ),
    linear-gradient(to bottom,#26262c,#18181e);
  transform:perspective(500px) rotateX(58deg);
  transform-origin:bottom;
}

.visual.scene-lounge{
  background:
    radial-gradient(circle at 18% 25%,rgba(255,198,102,.16),transparent 25%),
    radial-gradient(circle at 82% 30%,rgba(125,166,255,.12),transparent 25%),
    linear-gradient(to bottom,#302d39,#1e1d25 62%,#17161c);
}

.visual.scene-city{
  background:
    linear-gradient(to bottom,rgba(85,130,190,.18),transparent 45%),
    linear-gradient(135deg,#39414d 0 35%,#2a3038 35% 55%,#20252b 55%);
}

.visual.scene-sns{
  background:
    radial-gradient(circle at 50% 40%,rgba(135,112,255,.26),transparent 34%),
    linear-gradient(145deg,#25203b,#151620);
}

.visual.scene-photo{
  background:#111;
}

.visual.scene-manager{
  background:
    radial-gradient(circle at 50% 35%,rgba(221,255,99,.12),transparent 30%),
    linear-gradient(to bottom,#292a33,#17181e);
}

/* fake environment */

.mirror{
  display:none;
}

.scene-studio .mirror{
  display:block;
  position:absolute;
  z-index:0;
  left:7%;
  right:7%;
  top:8%;
  height:50%;
  border:4px solid #464a55;
  background:
    linear-gradient(125deg,rgba(255,255,255,.09),rgba(255,255,255,.015));
  box-shadow:
    inset 0 0 25px rgba(255,255,255,.04);
}

.scene-studio .mirror::after{
  content:"DANCE STUDIO";
  position:absolute;
  top:10px;
  right:12px;
  color:rgba(255,255,255,.12);
  font-weight:900;
  font-size:9px;
  letter-spacing:2px;
}

.speakerBox{
  display:none;
}

.scene-studio .speakerBox{
  display:block;
  position:absolute;
  left:16px;
  bottom:20px;
  width:46px;
  height:70px;
  z-index:1;
  border-radius:5px;
  background:#101116;
  border:2px solid #32343c;
}

.scene-studio .speakerBox::before,
.scene-studio .speakerBox::after{
  content:"";
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  border:2px solid #3e4149;
  border-radius:50%;
}

.scene-studio .speakerBox::before{
  width:24px;
  height:24px;
  top:8px;
}

.scene-studio .speakerBox::after{
  width:14px;
  height:14px;
  bottom:8px;
}

/* character aura */

.aura{
  position:absolute;
  z-index:1;
  left:50%;
  top:46%;
  width:270px;
  height:270px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:
    radial-gradient(
      circle,
      rgba(var(--char-rgb),.22),
      rgba(var(--char-rgb),0) 68%
    );
  filter:blur(10px);
  display:none;
}

.visual.hasCharacter .aura{
  display:block;
}

.character{
  position:absolute;
  z-index:3;
  left:50%;
  bottom:0;
  width:82%;
  height:98%;
  object-fit:contain;
  object-position:center bottom;
  transform:translateX(-50%);
  filter:drop-shadow(0 17px 14px rgba(0,0,0,.45));
  display:none;
}

.character.show{
  display:block;
  animation:pop .28s ease both;
}

@keyframes pop{
  from{
    opacity:0;
    transform:translateX(-50%) translateY(20px) scale(.94);
  }
  to{
    opacity:1;
    transform:translateX(-50%) translateY(0) scale(1);
  }
}

.reaction{
  position:absolute;
  z-index:4;
  right:18%;
  top:19%;
  font-size:35px;
  opacity:0;
  transform:scale(.5);
}

.reaction.show{
  animation:reaction .6s ease both;
}

@keyframes reaction{
  0%{opacity:0;transform:scale(.4) rotate(-10deg)}
  45%{opacity:1;transform:scale(1.2) rotate(6deg)}
  100%{opacity:1;transform:scale(1)}
}

/* photo */

.photo{
  position:absolute;
  inset:0;
  z-index:1;
  display:none;
  background-size:cover;
  background-position:center;
}

.photo.show{
  display:block;
}

.photo::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,.15),rgba(0,0,0,.12) 45%,rgba(0,0,0,.72));
}

.photoText{
  position:absolute;
  z-index:2;
  left:20px;
  right:20px;
  bottom:22px;
}

.photoTag{
  color:var(--acid);
  font-size:9px;
  font-weight:900;
  letter-spacing:2px;
}

.photoTitle{
  margin-top:5px;
  font-size:29px;
  font-weight:900;
  font-style:italic;
}

.photoSub{
  margin-top:5px;
  font-size:11px;
  font-weight:700;
}

/* manager */

.managerMark{
  position:absolute;
  inset:0;
  display:none;
  z-index:2;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.managerMark.show{
  display:flex;
}

.managerMark div{
  font-size:32px;
  font-style:italic;
  font-weight:900;
  letter-spacing:-1px;
}

.managerMark span{
  display:block;
  margin-top:9px;
  color:#858391;
  font-size:9px;
  font-style:normal;
  letter-spacing:4px;
}

/* TALK */

.talkArea{
  padding:0 10px 10px;
  position:relative;
  z-index:8;
  margin-top:-2px;
}

.talk{
  min-height:116px;
  padding:14px 15px 15px;
  border-radius:13px;
  background:#f6f3ec;
  color:#17171d;
  box-shadow:0 6px 24px rgba(0,0,0,.34);
  position:relative;
}

.talk::before{
  content:"";
  position:absolute;
  top:-9px;
  left:33px;
  width:19px;
  height:19px;
  transform:rotate(45deg);
  background:#f6f3ec;
}

.name{
  position:relative;
  z-index:1;
  margin-bottom:7px;
  font-size:10px;
  font-weight:900;
  letter-spacing:1.7px;
}

.text{
  position:relative;
  z-index:1;
  white-space:pre-line;
  font-size:15px;
  font-weight:500;
  line-height:1.65;
}

.tapHint{
  margin-top:8px;
  text-align:right;
  color:#96919b;
  font-size:9px;
  animation:blink 1.2s ease infinite;
}

@keyframes blink{
  50%{opacity:.35}
}

/* choices */

.choices{
  display:none;
  padding:0 10px 11px;
  gap:7px;
}

.choices.show{
  display:grid;
}

.choice{
  width:100%;
  padding:12px 13px;
  border:1px solid #4b4856;
  border-radius:10px;
  background:#24232d;
  color:#fff;
  text-align:left;
}

.choice:active{
  transform:scale(.985);
  background:#302e39;
}

.choice b{
  display:block;
  font-size:12px;
}

.choice span{
  display:block;
  margin-top:4px;
  color:#aaa7b4;
  font-size:9px;
  line-height:1.5;
}

/* result overlay */

.resultOverlay{
  position:absolute;
  z-index:40;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(10,9,14,.88);
  backdrop-filter:blur(6px);
}

.resultOverlay.show{
  display:flex;
  animation:fade .25s ease;
}

@keyframes fade{
  from{opacity:0}
  to{opacity:1}
}

.resultPanel{
  width:min(100%,420px);
  padding:19px;
  border:1px solid #55515f;
  border-radius:15px;
  background:#22212a;
  box-shadow:0 20px 50px rgba(0,0,0,.45);
}

.resultTitle{
  text-align:center;
  color:var(--acid);
  font-weight:900;
  font-size:10px;
  letter-spacing:3px;
}

.resultHeadline{
  margin-top:6px;
  text-align:center;
  font-size:20px;
  font-weight:900;
}

.changeList{
  margin-top:15px;
  display:grid;
  gap:7px;
}

.change{
  display:grid;
  grid-template-columns:1.4fr 1fr auto;
  align-items:center;
  gap:8px;
  padding:8px 9px;
  border-radius:8px;
  background:#2c2a35;
  font-size:10px;
}

.change .who{
  font-weight:900;
}

.change .beforeAfter{
  color:#b8b5c0;
}

.change .delta{
  font-size:13px;
  font-weight:900;
}

.delta.plus{color:#cfff63}
.delta.minus{color:#ff8d96}

.resultTap{
  margin-top:15px;
  text-align:center;
  color:#94919d;
  font-size:9px;
}

/* week end */

.weekResult{
  display:none;
  position:absolute;
  z-index:50;
  inset:0;
  overflow:auto;
  padding:22px 17px;
  background:
    radial-gradient(circle at 50% 15%,rgba(221,255,99,.10),transparent 30%),
    #14131b;
}

.weekResult.show{
  display:block;
}

.weekResultTag{
  color:var(--acid);
  font-size:9px;
  font-weight:900;
  letter-spacing:3px;
}

.weekResult h2{
  margin:10px 0 6px;
  font-size:27px;
  line-height:1.25;
}

.weekResultSub{
  color:#9b98a5;
  font-size:11px;
}

.summaryBox{
  margin-top:18px;
  padding:12px;
  border:1px solid #383642;
  border-radius:12px;
  background:#201f28;
}

.summaryTitle{
  margin-bottom:9px;
  color:#8e8b98;
  font-size:9px;
  letter-spacing:2px;
}

.summaryRow{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:7px 0;
  border-bottom:1px solid #302e39;
  font-size:11px;
}

.summaryRow:last-child{
  border:none;
}

.summaryRow b{
  text-align:right;
}

.daysBig{
  margin-top:25px;
  text-align:center;
  color:#fff;
  font-size:13px;
}

.daysBig strong{
  display:block;
  margin-top:3px;
  color:var(--acid);
  font-size:35px;
}

.weekEndHint{
  margin-top:17px;
  text-align:center;
  color:#777482;
  font-size:9px;
  animation:blink 1.2s infinite;
}

/* modal */

.modal{
  position:fixed;
  z-index:100;
  inset:0;
  display:none;
  padding:18px;
  align-items:center;
  justify-content:center;
  background:rgba(5,5,9,.86);
  backdrop-filter:blur(7px);
}

.modal.show{
  display:flex;
}

.modalBox{
  width:min(100%,430px);
  max-height:85dvh;
  overflow:auto;
  padding:18px;
  border:1px solid #45424e;
  border-radius:13px;
  background:#201f28;
}

.modalBox h2{
  margin:0 0 13px;
}

.memberStatus{
  margin-top:8px;
  padding:10px;
  border-radius:9px;
  background:#292731;
}

.memberStatus h3{
  margin:0 0 7px;
  font-size:13px;
}

.memberStats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4px;
  font-size:11px;
}

.closeButton{
  width:100%;
  margin-top:14px;
  padding:11px;
  border:0;
  border-radius:9px;
  background:var(--acid);
  color:#111;
  font-weight:900;
}

footer{
  display:flex;
  justify-content:space-between;
  padding-top:8px;
  color:#6e6b77;
  font-size:9px;
}

footer button{
  border:0;
  padding:0;
  background:none;
  color:#7c7884;
  text-decoration:underline;
}

@media(max-height:760px){
  .visual{height:310px}
}

</style>
</head>

<body>

<div class="app">

<header class="header">
  <div class="logo">
    O-VER-KiLL
    <small>MANAGER'S STORY</small>
  </div>
  <button class="headerButton" id="statusButton">＋</button>
</header>

<section class="hud">

  <div class="hudTop">
    <div>
      <div class="weekLabel" id="weekLabel">WEEK 1</div>
      <div class="days">デビューまであと <span id="dayLabel">28</span>日</div>
    </div>

    <div class="money">
      活動資金
      <strong id="cashLabel">¥220,000</strong>
    </div>
  </div>

  <div class="groupRow">

    <div class="statLine">
      <div class="statLineTop">
        <span>認知</span>
        <b id="reachLabel">10</b>
      </div>
      <div class="bar">
        <div class="fill" id="reachBar"></div>
      </div>
    </div>

    <div class="statLine">
      <div class="statLineTop">
        <span>連携</span>
        <b id="bondLabel">60</b>
      </div>
      <div class="bar">
        <div class="fill" id="bondBar"></div>
      </div>
    </div>

  </div>

  <div class="energyRow" id="energyRow"></div>

</section>

<section class="game" id="game">

  <div class="sceneHead">
    <b id="sceneTitle">PROLOGUE</b>
    <span id="sceneCounter"></span>
  </div>

  <div class="visual scene-photo" id="visual">

    <div class="mirror"></div>
    <div class="speakerBox"></div>
    <div class="aura"></div>

    <div class="photo" id="photo">
      <div class="photoText">
        <div class="photoTag" id="photoTag">DEBUT LIVE</div>
        <div class="photoTitle" id="photoTitle">O-VER-KiLL</div>
        <div class="photoSub" id="photoSub">豊洲公園</div>
      </div>
    </div>

    <div class="managerMark" id="managerMark">
      <div>
        O-VER-KiLL
        <span>THE BEGINNING</span>
      </div>
    </div>

    <img class="character" id="character" alt="">

    <div class="reaction" id="reaction"></div>

  </div>

  <div class="talkArea" id="talkArea">
    <div class="talk" id="talk">
      <div class="name" id="speakerName">MANAGER</div>
      <div class="text" id="dialogue"></div>
      <div class="tapHint" id="tapHint">画面をタップ</div>
    </div>
  </div>

  <div class="choices" id="choices"></div>

  <div class="resultOverlay" id="resultOverlay">
    <div class="resultPanel" id="resultPanel"></div>
  </div>

  <div class="weekResult" id="weekResult"></div>

</section>

<footer>
  <span>非公式ファンゲーム・体験版</span>
  <button id="resetButton">最初から</button>
</footer>

</div>

<div class="modal" id="modal">
  <div class="modalBox" id="modalBox"></div>
</div>

<audio id="songAudio" src="./akunaki-kodou.mp3" preload="metadata"></audio>

<script>

/* =========================
   ASSETS
========================= */

const DEBUT_PHOTO = "./debut-live.webp";

const CHAR_IMAGES = {
  sarina:{
    normal:"./sarina_normal.png",
    smile:"./sarina_smile.png",
    angry:"./sarina_angry.png",
    troubled:"./sarina_troubled.png",
    cry:"./sarina_cry.png"
  },
  miyu:{
    normal:"./miyu_normal.png",
    smile:"./miyu_smile.png",
    angry:"./miyu_angry.png",
    troubled:"./miyu_troubled.png",
    cry:"./miyu_cry.png"
  },
  kilua:{
    normal:"./kilua_normal.png",
    smile:"./kilua_smile.png",
    angry:"./kilua_angry.png",
    troubled:"./kilua_troubled.png",
    cry:"./kilua_cry.png"
  },
  raisa:{
    normal:"./raisa_normal.png",
    smile:"./raisa_smile.png",
    angry:"./raisa_angry.png",
    troubled:"./raisa_troubled.png",
    cry:"./raisa_cry.png"
  }
};

const MEMBERS = {
  sarina:{
    name:"SARiNA",
    color:"#67e095",
    rgb:"103,224,149"
  },
  miyu:{
    name:"MiYU",
    color:"#70baff",
    rgb:"112,186,255"
  },
  kilua:{
    name:"KiLUA",
    color:"#ff737f",
    rgb:"255,115,127"
  },
  raisa:{
    name:"RAiSA",
    color:"#ffdc68",
    rgb:"255,220,104"
  }
};


/* =========================
   STATE
========================= */

const STORAGE_KEY = "overkill_story_week1_v1";

function createInitialMembers(){
  return {
    sarina:{vocal:78,dance:48,bond:74,energy:72},
    miyu:{vocal:74,dance:54,bond:68,energy:76},
    kilua:{vocal:52,dance:84,bond:40,energy:80},
    raisa:{vocal:42,dance:44,bond:58,energy:70}
  };

function freshState(){
  return {
    node:"p0",
    cash:220000,
    reach:10,
    members:createInitialMembers(),

    flags:{
      kilua_teaching:false,
      team_conflict:false,
      team_bond:false,
      week1_promotion:null,
      danceChoice:null
    },

    weekStart:{
      reach:10,
      members:createInitialMembers()
    },

    weekFinished:false
  };
}

function loadState(){
  try{
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || freshState();
  }catch{
    return freshState();
  }
}

let state = loadState();

function save(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
}

/* =========================
   HELPERS
========================= */

function clamp(v){
  return Math.max(0,Math.min(100,v));
}

function yen(v){
  return "¥"+v.toLocaleString("ja-JP");
}

function averageBond(){
  const ids = Object.keys(state.members);
  return Math.round(
    ids.reduce((sum,id)=>sum+state.members[id].bond,0) / ids.length
  );
}

function metricLabel(metric){
  return {
    vocal:"歌唱",
    dance:"ダンス",
    bond:"連携",
    energy:"体力",
    reach:"認知"
  }[metric] || metric;
}

function applyChanges(changes,title,headline){

  const display = [];

  changes.forEach(([target,metric,delta])=>{

    if(target==="GROUP"){

      const before = state.reach;
      state.reach = clamp(state.reach + delta);

      display.push({
        who:"GROUP",
        metric,
        before,
        after:state.reach,
        delta
      });

      return;
    }

    const before = state.members[target][metric];

    state.members[target][metric] =
      clamp(before + delta);

    display.push({
      who:MEMBERS[target].name,
      metric,
      before,
      after:state.members[target][metric],
      delta
    });

  });

  save();
  renderHud();

  return {
    title,
    headline,
    changes:display
  };
}


/* =========================
   ACTION FLAGS
========================= */

function runChoiceAction(action){

  if(action==="danceTeach"){
    state.flags.danceChoice="teach";
  }

  if(action==="dancePush"){
    state.flags.danceChoice="push";
  }

  if(action==="danceSplit"){
    state.flags.danceChoice="split";
  }

  if(action==="danceRest"){
    state.flags.danceChoice="rest";
  }

  if(action==="promoSNS"){
    state.flags.week1_promotion="sns";
  }

  if(action==="promoFlyer"){
    state.flags.week1_promotion="flyer";
  }

  if(action==="promoVocal"){
    state.flags.week1_promotion="vocal";
  }

  if(action==="promoRest"){
    state.flags.week1_promotion="rest";
  }

  save();
}


/* =========================
   HUD
========================= */

function renderHud(){

  $("cashLabel").textContent = yen(state.cash);

  $("reachLabel").textContent = state.reach;
  $("bondLabel").textContent = averageBond();

  requestAnimationFrame(()=>{
    $("reachBar").style.width = state.reach+"%";
    $("bondBar").style.width = averageBond()+"%";
  });

  $("energyRow").innerHTML =
    Object.keys(MEMBERS).map(id=>{

      const m = MEMBERS[id];
      const energy = state.members[id].energy;

      return `
        <div class="energy">

          <div class="energyTop">

            <span>
              <span
                class="dot"
                style="background:${m.color}"
              ></span>
              ${m.name}
            </span>

            <span>${energy}</span>

          </div>

          <div class="bar">
            <div
              class="fill"
              style="width:${energy}%"
            ></div>
          </div>

        </div>
      `;

    }).join("");
}


/* =========================
   BACKGROUND
========================= */

function setBackground(bg){

  visual.className = "visual";

  visual.classList.remove("hasCharacter");

  photo.classList.remove("show");
  managerMark.classList.remove("show");
  character.classList.remove("show");

  if(bg==="photo"){
    visual.classList.add("scene-photo");
    photo.classList.add("show");
  }

  else if(bg==="studio"){
    visual.classList.add("scene-studio");
  }

  else if(bg==="lounge"){
    visual.classList.add("scene-lounge");
  }

  else if(bg==="city"){
    visual.classList.add("scene-city");
  }

  else if(bg==="sns"){
    visual.classList.add("scene-sns");
  }

  else{
    visual.classList.add("scene-manager");
    managerMark.classList.add("show");
  }

}


/* =========================
   CHARACTER
========================= */

function showCharacter(memberId,expression){

  if(!memberId){
    character.classList.remove("show");
    return;
  }

  const m = MEMBERS[memberId];

  visual.classList.add("hasCharacter");

  visual.style.setProperty("--char-rgb",m.rgb);

  character.src =
    CHAR_IMAGES[memberId][expression || "normal"];

  character.alt = m.name;

  character.classList.remove("show");

  requestAnimationFrame(()=>{
    character.classList.add("show");
  });

}


/* =========================
   REACTION
========================= */

function showReaction(symbol){

  reaction.classList.remove("show");
  reaction.textContent="";

  if(!symbol) return;

  reaction.textContent=symbol;

  requestAnimationFrame(()=>{
    reaction.classList.add("show");
  });
}


/* =========================
   STORY RENDER
========================= */

function renderNode(){

  if(state.node==="showWeekResult"){
    renderWeekResult();
    return;
  }

  const node = STORY[state.node];

  if(!node) return;

  choices.classList.remove("show");
  choices.innerHTML="";

  resultOverlay.classList.remove("show");

  sceneTitle.textContent=node.scene || "WEEK 1";
  sceneCounter.textContent="";

  setBackground(node.bg);

  if(node.photo){
    photoTag.textContent=node.photo.tag;
    photoTitle.textContent=node.photo.title;
    photoSub.textContent=node.photo.sub;
  }

  if(node.bg==="manager"){
    managerMark.classList.add("show");
  }

  showCharacter(node.member,node.expression);
  showReaction(node.reaction);

  speakerName.textContent=node.speaker || "MANAGER";
  dialogue.textContent=node.text || "";

  if(node.choices){
    tapHint.style.display="none";

    choices.innerHTML=node.choices.map((c,index)=>`
      <button
        class="choice"
        data-choice="${index}"
      >
        <b>${c.text}</b>
        <span>${c.sub}</span>
      </button>
    `).join("");

    choices.classList.add("show");

  }else{
    tapHint.style.display="block";
  }

}


/* =========================
   RESULT OVERLAY
========================= */

function showResult(result,nextNode){

  resultPanel.innerHTML=`

    <div class="resultTitle">
      ${result.title}
    </div>

    <div class="resultHeadline">
      ${result.headline}
    </div>

    <div class="changeList">

      ${result.changes.map(change=>`

        <div class="change">

          <div class="who">
            ${change.who}<br>
            <span style="color:#918e9a;font-weight:500">
              ${metricLabel(change.metric)}
            </span>
          </div>

          <div class="beforeAfter">
            ${change.before}
            →
            ${change.after}
          </div>

          <div
            class="delta
            ${change.delta>=0 ? "plus":"minus"}"
          >
            ${change.delta>=0 ? "+":""}${change.delta}
          </div>

        </div>

      `).join("")}

    </div>

    <div class="resultTap">
      タップして続ける
    </div>

  `;

  resultOverlay.classList.add("show");

  resultOverlay.onclick=()=>{

    resultOverlay.classList.remove("show");

    state.node=nextNode;

    save();

    renderNode();

  };

}


/* =========================
   ADVANCE STORY
========================= */

function advanceStory(){

  if(resultOverlay.classList.contains("show")) return;
  if(weekResult.classList.contains("show")) return;

  const node=STORY[state.node];

  if(!node) return;
  if(node.choices) return;

  if(node.result){

    const result =
      RESULT_HANDLERS[node.result]();

    showResult(result,node.next);

    return;
  }

  if(node.next){

    state.node=node.next;
    save();
    renderNode();

  }

}


/* =========================
   CHOICE
========================= */

choices.addEventListener("click",event=>{

  const button =
    event.target.closest("[data-choice]");

  if(!button) return;

  const node=STORY[state.node];

  const choice=
    node.choices[
      Number(button.dataset.choice)
    ];

  runChoiceAction(choice.action);

  state.node=choice.next;

  save();

  renderNode();

});


/* =========================
   TAP ADVANCE
========================= */

$("talk").addEventListener(
  "click",
  advanceStory
);

visual.addEventListener(
  "click",
  advanceStory
);


/* =========================
   WEEK RESULT
========================= */

function buildSummaryRows(){

  const rows=[];

  if(state.reach !== state.weekStart.reach){

    const delta=
      state.reach-state.weekStart.reach;

    rows.push(`
      <div class="summaryRow">
        <span>GROUP｜認知</span>
        <b>
          ${state.weekStart.reach}
          →
          ${state.reach}
          <span style="color:${delta>=0?"#cfff63":"#ff8d96"}">
            ${delta>=0?"+":""}${delta}
          </span>
        </b>
      </div>
    `);
  }

  Object.keys(MEMBERS).forEach(id=>{

    ["vocal","dance","bond","energy"].forEach(metric=>{

      const before=state.weekStart.members[id][metric];
      const after=state.members[id][metric];

      if(before===after) return;

      const delta=after-before;

      rows.push(`
        <div class="summaryRow">
          <span>
            ${MEMBERS[id].name}｜
            ${metricLabel(metric)}
          </span>

          <b>
            ${before}
            →
            ${after}

            <span
              style="
                color:${delta>=0?"#cfff63":"#ff8d96"}
              "
            >
              ${delta>=0?"+":""}${delta}
            </span>
          </b>
        </div>
      `);

    });

  });

  return rows.join("");
}


function renderWeekResult(){

  state.weekFinished=true;
  save();

  weekResult.innerHTML=`

    <div class="weekResultTag">
      WEEK 1 COMPLETE
    </div>

    <h2>
      4人でやるって、<br>
      難しい。
    </h2>

    <div class="weekResultSub">
      それでも少しずつ、
      O-VER-KiLLになっていく。
    </div>

    <div class="summaryBox">

      <div class="summaryTitle">
        THIS WEEK
      </div>

      ${buildSummaryRows()}

    </div>

    <div class="daysBig">
      デビューまで
      <strong>あと21日</strong>
    </div>

    <div class="weekEndHint">
      WEEK2へ続く
    </div>

  `;

  weekResult.classList.add("show");

}


/* =========================
   STATUS
========================= */

function openStatus(){

  $("modalBox").innerHTML=`

    <h2>
      O-VER-KiLL STATUS
    </h2>

    <p
      style="
        color:#aaa7b5;
        font-size:11px;
      "
    >
      認知 ${state.reach}
      ／
      平均連携 ${averageBond()}
    </p>

    ${Object.keys(MEMBERS).map(id=>{

      const m=MEMBERS[id];
      const s=state.members[id];

      return `
        <div class="memberStatus">

          <h3 style="color:${m.color}">
            ${m.name}
          </h3>

          <div class="memberStats">
            <div>歌唱：${s.vocal}</div>
            <div>ダンス：${s.dance}</div>
            <div>連携：${s.bond}</div>
            <div>体力：${s.energy}</div>
          </div>

        </div>
      `;

    }).join("")}

    <button
      class="closeButton"
      data-close-modal
    >
      閉じる
    </button>
  `;

  $("modal").classList.add("show");

}

$("statusButton").onclick=openStatus;

$("modal").addEventListener("click",event=>{

  if(
    event.target.id==="modal" ||
    event.target.matches("[data-close-modal]")
  ){
    $("modal").classList.remove("show");
  }

});


/* =========================
   RESET
========================= */

$("resetButton").onclick=()=>{

  if(confirm("最初からやり直しますか？")){

    localStorage.removeItem(STORAGE_KEY);

    state=freshState();

    weekResult.classList.remove("show");

    renderHud();
    renderNode();

  }

};


/* =========================
   START
========================= */

renderHud();

if(state.weekFinished){
  renderWeekResult();
}else{
  renderNode();
}

</script>
