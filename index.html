<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#080a10"
  >

  <title>
    O-VER-KiLL｜MANAGER'S STORY
  </title>

  <link
    rel="stylesheet"
    href="./style.css"
  >
</head>

<body>

  <!-- ==========================================
       LOADING
  =========================================== -->

  <section
    id="loading"
    class="screen active"
  >

    <div class="loadingLogo">
      O-VER-KiLL
    </div>

    <div class="loadingSub">
      MANAGER'S STORY
    </div>

    <div class="loadingBar">
      <div
        id="loadingProgress"
        class="loadingProgress"
      ></div>
    </div>

    <div
      id="loadingPercent"
      class="loadingPercent"
    >
      0%
    </div>

  </section>


  <!-- ==========================================
       TITLE
  =========================================== -->

  <section
    id="title"
    class="screen"
  >

    <div class="titleBgBlur"></div>

    <img
      class="titlePhoto"
      src="./debut-live.webp"
      alt=""
    >

    <div class="titleShade"></div>

    <div class="titleContent">

      <div class="titleSmall">
        IDOL MANAGEMENT GAME
      </div>

      <h1 class="titleLogo">
        O-VER-KiLL
      </h1>

      <div class="titleGameName">
        MANAGER'S STORY
      </div>

      <div class="titleButtons">

        <button id="startBtn">
          NEW GAME
        </button>

        <button id="continueBtn">
          CONTINUE
        </button>

      </div>

    </div>

  </section>


  <!-- ==========================================
       PROLOGUE
  =========================================== -->

  <section
    id="prologue"
    class="screen"
  >

    <div class="prologueBrand">
      O-VER-KiLL
    </div>

    <div id="prologueText"></div>

    <button id="prologueNext">
      NEXT
    </button>

  </section>


  <!-- ==========================================
       STORY / ADV
  =========================================== -->

  <section
    id="game"
    class="screen"
  >

    <div id="env"></div>

    <header class="storyHeader">

      <div class="storyHeaderInfo">

        <span id="seasonLabel">
          SEASON 1
        </span>

        <div id="chapter">
          WEEK 1
        </div>

      </div>

      <button id="statusBtn">
        STATUS
      </button>

    </header>


    <div id="managerMark"></div>


    <img
      id="char"
      src=""
      alt=""
    >


    <div id="reaction"></div>


    <div
      id="dialogue"
      data-mode="normal"
    >

      <div id="speaker"></div>

      <div id="text"></div>

      <div id="choices"></div>

    </div>

  </section>


  <!-- ==========================================
       MANAGEMENT / TRAINING
  =========================================== -->

  <section
    id="training"
    class="screen"
  >

    <header class="trainingHeader">

      <div class="trainingHeaderInfo">

        <span id="trainingSeason">
          SEASON 1
        </span>

        <div id="trainingWeek">
          WEEK 1
        </div>

      </div>

      <button id="trainingStatusBtn">
        STATUS
      </button>

    </header>


    <main class="trainingBody">

      <div class="trainingTitleBlock">

        <small>
          MANAGEMENT
        </small>

        <h1>
          今日、何をする？
        </h1>

        <p>
          メンバーと活動を選んで、
          O-VER-KiLLを育てよう。
        </p>

      </div>


      <div class="trainingInfo">

        <div>
          <span>
            認知度
          </span>

          <strong id="trainingReach">
            0
          </strong>
        </div>


        <div>
          <span>
            ファン
          </span>

          <strong id="trainingFans">
            0
          </strong>
        </div>


        <div>
          <span>
            活動資金
          </span>

          <strong id="trainingCash">
            ¥0
          </strong>
        </div>

      </div>


      <div id="trainingDays">
        デビューまであと28日
      </div>


      <div class="trainingSectionLabel">
        育成するメンバー
      </div>

      <div id="trainingMembers"></div>


      <div class="trainingSectionLabel">
        ACTIVITY
      </div>

      <div id="commandGrid"></div>

    </main>

  </section>


  <!-- ==========================================
       ACTION RESULT
       JavaScriptで中身を生成
  =========================================== -->

  <section
    id="actionResult"
    class="screen"
  ></section>


  <!-- ==========================================
       WEEK RESULT
       JavaScriptで中身を生成
  =========================================== -->

  <section
    id="weekEnd"
    class="screen"
  ></section>


  <!-- ==========================================
       STATUS MODAL
       JavaScriptで中身を生成
  =========================================== -->

  <div id="statusModal"></div>


  <!-- ==========================================
       AUDIO
  =========================================== -->

  <audio
    id="song"
    preload="metadata"
  >

    <source
      src="./akunaki-kodou.mp3"
      type="audio/mpeg"
    >

  </audio>


  <!-- ==========================================
       GAME DATA
       順番重要
  =========================================== -->

  <script src="./data.js"></script>

  <script src="./story.js"></script>

  <script src="./game.js"></script>

</body>
</html>
